<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霓虹清明上河图</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#d9faff;font-family:"Microsoft YaHei",system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}#hud,#tip,#pause,#card{position:fixed;z-index:10;pointer-events:none}#hud{left:18px;top:16px;color:#a7f7ff;text-shadow:0 0 8px #00eaff;letter-spacing:2px;font-size:12px;line-height:1.6}#hud b{font-size:18px;color:#fff;text-shadow:0 0 10px #ff2bd6,0 0 18px #00eaff}#tip{right:18px;top:16px;padding:8px 12px;border:1px solid #1df4ff88;background:#03101dcc;box-shadow:0 0 16px #00eaff33;color:#7ff8ff;font-size:11px;letter-spacing:1px}#card{display:none;min-width:230px;max-width:300px;padding:14px 16px;background:linear-gradient(135deg,#071422f2,#12051cf2);border:1px solid #2df5ff;box-shadow:0 0 18px #00eaff66,inset 0 0 18px #ff27d522;transform:translate(12px,12px)}#card:before{content:"SHOP // DATA LINK";display:block;font-size:9px;color:#ff46d8;letter-spacing:2px;margin-bottom:6px}#card h3{margin:0 0 7px;font-size:16px;color:#fff;text-shadow:0 0 8px #ff2bd6}#card p{margin:3px 0;font-size:11px;color:#a9f8ff;line-height:1.6}.bar{height:4px;background:#071c25;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00eaff,#ff2bd6);box-shadow:0 0 9px #00eaff}#pause{bottom:18px;left:50%;transform:translateX(-50%);padding:7px 14px;border:1px solid #ff2bd688;background:#080610bb;color:#ff8be9;font-size:10px;letter-spacing:1px;opacity:.5}</style></head><body><canvas id="c"></canvas><div id="hud"><b>赛博清明上河图</b><br>NEON BIANHE // 2088 · 自动巡卷中<br><span id="stats"></span></div><div id="tip">鼠标移动到店铺附近 · HOVER TO SCAN</div><div id="card"><h3 id="ct"></h3><p id="cp"></p><p id="cr"></p><div class="bar"><i id="cb"></i></div></div><div id="pause">SPACE：暂停 / 继续　·　鼠标：扫描街区</div><script>
(()=>{'use strict';const C=document.getElementById('c'),X=C.getContext('2d'),card=document.getElementById('card'),ct=document.getElementById('ct'),cp=document.getElementById('cp'),cr=document.getElementById('cr'),cb=document.getElementById('cb'),stats=document.getElementById('stats');let W=innerWidth,H=innerHeight,D=devicePixelRatio||1,scroll=0,last=performance.now(),paused=false,world=9000,mouse={x:-1,y:-1};function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const neon=['#00eaff','#ff2bd6','#b5ff3d','#ffe45c','#8a5cff'],pick=a=>a[Math.random()*a.length|0],rand=(a,b)=>a+Math.random()*(b-a);let shops=[];const names=['老王义体维修店','汴梁量子茶馆','八方合成药房','赛博纸马铺','东京汴梁数据行','飞虹机车行','赵氏机械肢体','霓虹糖水铺','天街芯片铺','宋潮全息戏楼','汴河无人船站','云端香料坊','龙门算力客栈','赛博书画院','铁牛锻造厂','开封神经网络诊所'],desc=['神经接口校准 / 机械臂换芯','古法茶汤 + 量子冷泡','纳米修复剂与义体润滑液','祭祀投影 / 可编程纸鸢','城市节点情报与黑客委托','反重力悬浮摩托 / 氢电池','仿生手掌与军规伺服器','霓虹果冻 / 电解质糖水','二手晶体管 / 记忆芯片','全息戏曲与沉浸式评书','自动摆渡 / 水面磁悬浮','香料分子合成 / 气味打印','GPU租赁 / 梦境渲染','AI临摹 / 数字碑帖','磁轨兵器 / 民用外骨骼','神经修复 / 睡眠协议'];for(let i=0;i<55;i++){let w=rand(90,170),h=rand(80,150);shops.push({x:120+i*(world-240)/55+rand(-45,45),w,h,y:470-h,name:names[i%names.length],desc:desc[i%desc.length],rate:94+i%6,c:pick(neon),f:rand(0,9)})}const particles=Array.from({length:180},()=>({x:Math.random()*world,y:rand(20,430),s:rand(.3,1.7),a:rand(.2,.8)})),rain=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,l:rand(5,18),s:rand(1.5,5)})),cars=Array.from({length:16},()=>({x:rand(0,world),y:rand(90,270),v:rand(25,75),z:rand(.65,1.25),c:pick(neon),dir:Math.random()<.5?-1:1})),drones=Array.from({length:12},()=>({x:rand(0,world),y:rand(45,250),v:rand(18,45),c:pick(neon),p:rand(0,6.28)})),people=Array.from({length:38},()=>({x:rand(0,world),y:rand(320,485),v:rand(4,13)*(Math.random()<.5?-1:1),h:rand(26,48),c:pick(neon),arm:Math.random()<.6,p:rand(0,6.28)})),holo=Array.from({length:15},()=>({x:rand(0,world),y:rand(105,310),w:rand(35,90),h:rand(35,80),c:pick(neon),p:rand(0,6.28)}));function wx(x){let v=x-(scroll%world);if(v<-300)v+=world;if(v>W+300)v-=world;return v}function glow(c,b=10){X.shadowColor=c;X.shadowBlur=b}function line(a,b,c,d,col,w=1,al=1){X.globalAlpha=al;X.strokeStyle=col;X.lineWidth=w;X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke();X.globalAlpha=1}function txt(s,x,y,n,c){X.font=n+'px "Microsoft YaHei",sans-serif';X.textAlign='center';X.fillStyle=c;X.fillText(s,x,y)}function sky(t){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02050e');g.addColorStop(.55,'#081526');g.addColorStop(1,'#12051a');X.fillStyle=g;X.fillRect(0,0,W,H);let mx=W*.73,my=H*.16;glow('#ff2bd6',28);X.fillStyle='#ffd7f6';X.beginPath();X.arc(mx,my,34,0,7);X.fill();X.shadowBlur=0;X.globalAlpha=.45;X.strokeStyle='#ff2bd6';for(let r=44;r<95;r+=10){X.beginPath();X.arc(mx,my,r,0,7);X.stroke()}X.globalAlpha=1;for(let i=0;i<65;i++){let x=(i*137+40-scroll*.08)%(W+180)-90,h=40+(i*37%110),y=340-h;X.fillStyle=i%3?'#07111d':'#0b1424';X.fillRect(x,y,30+(i*19%55),h);if(i%4===0){glow('#00eaff',5);X.fillStyle='#00eaff';X.fillRect(x+7,y+12,2,8);X.shadowBlur=0}}}function water(t){let y=495;X.fillStyle='#04141d';X.fillRect(0,y,W,H-y);for(let i=0;i<34;i++){let yy=y+12+i*12+Math.sin(t*.001+i)*2,off=(i*83-scroll*.22)%160;for(let x=off-160;x<W+160;x+=160)line(x,yy,x+30+(i*17%50),yy,'#0b7180',1,.34)}}function road(){let y=395;X.fillStyle='#090b12';X.fillRect(0,y,W,105);line(0,y,W,y,'#ff2bd6',2,.45);line(0,y+103,W,y+103,'#00eaff',2,.25);for(let x=-100;x<W+100;x+=85){let q=x-scroll%85;line(q,y+51,q+42,y+51,'#d9f8ff',2,.28)}}function bridge(){let b=340;X.fillStyle='#11101b';X.fillRect(0,b+45,W,33);X.strokeStyle='#c26aff';X.lineWidth=4;X.beginPath();X.moveTo(-20,b+45);X.quadraticCurveTo(W*.5,b-30,W+20,b+45);X.stroke();for(let x=-10;x<W+10;x+=70)line(x-(scroll*.5%70),b+12,x-(scroll*.5%70),b+68,'#00eaff',2,.5);txt('汴河·NEO RIVER',W*.5,b+25,10,'#9cfaff')}function building(s,t){let x=wx(s.x),y=s.y;if(x<-220||x>W+220)return;X.fillStyle='#0a0b13';X.fillRect(x,y,s.w,s.h);X.strokeStyle='#24374a';X.strokeRect(x,y,s.w,s.h);X.fillStyle='#111526';X.fillRect(x+6,y+20,s.w-12,s.h-24);glow(s.c,9);X.strokeStyle=s.c;X.lineWidth=2;X.beginPath();X.moveTo(x-5,y+20);X.lineTo(x+s.w/2,y-12);X.lineTo(x+s.w+5,y+20);X.stroke();X.shadowBlur=0;for(let a=x+13;a<x+s.w-10;a+=25)for(let b=y+34;b<y+s.h-15;b+=30){let on=Math.sin(t*.002+a*.05+b*.03+s.f)>-.35;X.fillStyle=on?s.c:'#14202a';X.globalAlpha=on?.7:.35;X.fillRect(a,b,12,9)}X.globalAlpha=1;glow(s.c,12);X.fillStyle='#061018';X.fillRect(x+7,y+4,s.w-14,22);X.strokeStyle=s.c;X.strokeRect(x+7,y+4,s.w-14,22);X.shadowBlur=0;txt(s.name.length>8?s.name.slice(0,8)+'…':s.name,x+s.w/2,y+20,11,s.c);X.fillStyle='#151929';X.fillRect(x,y+58,s.w,12);line(x,y+70,x+s.w,y+70,s.c,1,.7);X.fillStyle='#03070d';X.fillRect(x+s.w*.42,y+s.h-46,s.w*.16,46);glow('#00eaff',5);X.strokeStyle='#00eaff';X.strokeRect(x+s.w*.42,y+s.h-46,s.w*.16,46);X.shadowBlur=0;if(Math.sin(t*.002+s.f)>.2)txt('SCAN',x+s.w/2,y+s.h+12,7,'#ff2bd6')}function signs(){for(let i=0;i<18;i++){let x=wx(i*530+180),y=220+(i*37%105),c=neon[i%5];glow(c,10);line(x,y,x,y+70,c,2,.75);X.fillStyle='#050914';X.fillRect(x-45,y-17,90,34);X.strokeStyle=c;X.strokeRect(x-45,y-17,90,34);txt(['汴京','天街','御街','虹桥','夜市','云门'][i%6],x,y+5,13,c);X.shadowBlur=0}}function hh(h,t){let x=wx(h.x);if(x<-100||x>W+100)return;let p=.5+.5*Math.sin(t*.004+h.p);X.globalAlpha=.28+.35*p;glow(h.c,18);X.strokeStyle=h.c;X.strokeRect(x-h.w/2,h.y-h.h,h.w,h.h);for(let y=h.y-h.h;y<h.y;y+=8)line(x-h.w/2,y,x+h.w/2,y,h.c,1,.25);txt(['AI戏台','纳米茶','赛博佛塔','NEO-药','芯片折扣'][Math.random()*5|0],x,h.y-h.h/2,10,h.c);X.shadowBlur=0;X.globalAlpha=1}function drone(d,t){let x=wx(d.x),y=d.y+Math.sin(t*.0015+d.p)*12;if(x<-80||x>W+80)return;glow(d.c,12);X.strokeStyle=d.c;X.lineWidth=2;X.beginPath();X.ellipse(x,y,18,7,0,0,7);X.stroke();X.fillStyle='#dff';X.fillRect(x-3,y-2,6,4);line(x-30,y+8,x-10,y+3,d.c,1,.6);line(x+10,y+3,x+30,y+8,d.c,1,.6);X.shadowBlur=0}function car(c){let x=wx(c.x),y=c.y;if(x<-100||x>W+100)return;X.save();X.translate(x,y);X.scale(c.z,c.z);glow(c.c,15);X.fillStyle='#080d17';X.strokeStyle=c.c;X.lineWidth=2;X.beginPath();X.moveTo(-38,7);X.lineTo(-18,-7);X.lineTo(20,-7);X.lineTo(38,6);X.lineTo(29,13);X.lineTo(-30,13);X.closePath();X.fill();X.stroke();X.fillStyle='#9ff';X.fillRect(-12,-5,22,6);X.fillStyle=c.c;X.fillRect(-29,10,10,3);X.fillRect(20,10,10,3);line(-55,12,-40,12,c.c,2,.35);line(40,12,62,12,c.c,2,.35);X.restore();X.shadowBlur=0}function person(p,t){let x=wx(p.x),y=p.y;if(x<-60||x>W+60)return;let bob=Math.sin(t*.005+p.p)*2;X.save();X.translate(x,y+bob);X.fillStyle='#0a0e17';X.strokeStyle=p.c;X.lineWidth=1.5;glow(p.c,7);X.beginPath();X.arc(0,-p.h+7,7,0,7);X.fill();X.stroke();X.beginPath();X.moveTo(0,-p.h+14);X.lineTo(0,-7);X.moveTo(0,-p.h+23);X.lineTo(-13,-p.h+8+Math.sin(t*.004+p.p)*5);X.moveTo(0,-p.h+23);X.lineTo(13,-p.h+8-Math.sin(t*.004+p.p)*5);X.moveTo(0,-7);X.lineTo(-9,5);X.moveTo(0,-7);X.lineTo(10,5);X.stroke();if(p.arm){X.fillStyle='#d4fbff';X.fillRect(10,-p.h+3,6,23);X.fillStyle=p.c;X.fillRect(12,-p.h+2,3,22)}X.restore();X.shadowBlur=0}function boats(){for(let i=0;i<9;i++){let x=wx(i*720+90+Math.sin(scroll*.0005+i)*30),y=485-i%3*4;if(x<-130||x>W+130)continue;X.fillStyle='#080a12';X.strokeStyle=neon[i%5];glow(neon[i%5],7);X.beginPath();X.moveTo(x-45,y);X.lineTo(x+45,y);X.lineTo(x+28,y+12);X.lineTo(x-30,y+12);X.closePath();X.fill();X.stroke();X.fillStyle='#111b28';X.fillRect(x-5,y-25,10,25);X.strokeRect(x-8,y-28,16,4);X.shadowBlur=0}}function rainDraw(){for(let r of rain){r.y+=r.s;if(r.y>H)r.y=-20;line(r.x,r.y,r.x-2,r.y+r.l,'#00d9ff',1,.18)}}function hit(mx,my){let best=null,bd=1e9;for(let s of shops){let x=wx(s.x),dx=Math.abs(mx-(x+s.w/2)),dy=Math.abs(my-(s.y+s.h/2));if(x>-100&&x<W+100&&dx<s.w/2+18&&dy<s.h/2+24&&dx+dy<bd){bd=dx+dy;best=s}}return best}function show(s,x,y){ct.textContent=s.name;cp.textContent=s.desc;cr.textContent=`好评率 ${s.rate}%　｜　营业状态：OPEN　｜　信誉等级：S+`;cb.style.width=s.rate+'%';card.style.display='block';card.style.left=x+'px';card.style.top=y+'px'}C.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;let s=hit(mouse.x,mouse.y);s?show(s,mouse.x,mouse.y):card.style.display='none'});addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault()}});function update(dt){if(paused)return;scroll+=dt*.026;for(let c of cars){c.x+=c.v*dt*.001*c.dir;if(c.x>world+100)c.x=-100;if(c.x<-100)c.x=world+100}for(let d of drones){d.x+=d.v*dt*.001;if(d.x>world+100)d.x=-100}for(let p of people){p.x+=p.v*dt*.001;if(p.x>world+60)p.x=-60;if(p.x<-60)p.x=world+60}}function draw(t){X.clearRect(0,0,W,H);sky(t);signs();bridge();water(t);road();shops.forEach(s=>building(s,t));holo.forEach(h=>hh(h,t));drones.forEach(d=>drone(d,t));cars.forEach(car);people.forEach(p=>person(p,t));boats();particles.forEach(p=>{let x=wx(p.x);if(x>=0&&x<=W){X.globalAlpha=p.a;X.fillStyle=pick(neon);X.fillRect(x,p.y,p.s,p.s);X.globalAlpha=1}});rainDraw();X.globalAlpha=.05;for(let y=0;y<H;y+=4)X.fillStyle='#8ff',X.fillRect(0,y,W,1);X.globalAlpha=1;let v=X.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.8);v.addColorStop(0,'transparent');v.addColorStop(1,'#000b');X.fillStyle=v;X.fillRect(0,0,W,H);stats.textContent=`DYNAMIC OBJECTS 316+  //  ROLL ${Math.floor(scroll%world)}m  //  SPACE PAUSE`}function loop(t){let dt=Math.min(50,t-last);last=t;update(dt);draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
