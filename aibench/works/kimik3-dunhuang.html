<body>
<canvas id="stage"></canvas>

<div id="title">
  <h1>敦煌飞天 · 粒子画</h1>
  <p>飘 带 随 心 · 壁 画 复 苏</p>
</div>
<div id="hint">移动鼠标或手指 —— 快则飞沙散开，慢则聚合成带</div>
<div id="bar">
  <button class="btn" id="btnPause">暂 停</button>
  <button class="btn" id="btnReplay">回 放</button>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var titleEl = document.getElementById("title");
  var hintEl = document.getElementById("hint");
  var btnPause = document.getElementById("btnPause");
  var btnReplay = document.getElementById("btnReplay");

  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ============ 敦煌配色 ============ */
  var PALETTE = [
    [178, 58, 46],   // 朱砂
    [212, 160, 74],  // 土金
    [232, 195, 122], // 金粉
    [86, 138, 122],  // 石绿
    [140, 82, 50],   // 赭石
    [198, 120, 88]   // 绛红
  ];
  function pickColor() { return PALETTE[(Math.random() * PALETTE.length) | 0]; }

  /* ============ 飘带轨迹（拖尾弹簧链） ============ */
  var SEG = 46;                 // 飘带节数
  var trail = [];
  var head = { x: W * 0.5, y: H * 0.45 };
  for (var i = 0; i < SEG; i++) trail.push({ x: head.x, y: head.y });

  var SEG_LEN = function () { return Math.max(10, Math.min(W, H) * 0.016); };

  /* ============ 粒子系统 ============ */
  var COUNT = (W * H > 900000) ? 1500 : 1000;   // 小屏少粒子
  if (W < 640) COUNT = 700;
  var particles = [];

  function ribbonPoint(t, time) {
    // t ∈ [0,1] 沿飘带取点（节间线性插值 + 横向正弦飘动在外层做）
    var f = t * (SEG - 1);
    var i0 = Math.min(SEG - 2, f | 0);
    var fr = f - i0;
    var a = trail[i0], b = trail[i0 + 1];
    return { x: a.x + (b.x - a.x) * fr, y: a.y + (b.y - a.y) * fr };
  }

  function ribbonNormal(t) {
    var f = t * (SEG - 1);
    var i0 = Math.max(1, Math.min(SEG - 2, f | 0));
    var a = trail[i0 - 1], b = trail[i0 + 1];
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.hypot(dx, dy) || 1;
    return { x: -dy / len, y: dx / len };
  }

  function makeParticle() {
    var c = pickColor();
    var t = Math.pow(Math.random(), 0.85); // 头部粒子更密
    return {
      t: t,
      side: (Math.random() * 2 - 1),                 // 横向分布
      widthK: 0.3 + Math.random() * 0.9,             // 横向系数
      phase: Math.random() * Math.PI * 2,
      flutter: 0.5 + Math.random() * 1.6,            // 飘动频率
      x: head.x + (Math.random() - 0.5) * 40,
      y: head.y + (Math.random() - 0.5) * 40,
      vx: 0, vy: 0,
      size: 0.8 + Math.random() * 2.2,
      r: c[0], g: c[1], b: c[2],
      alpha: 0.35 + Math.random() * 0.55,
      glow: Math.random() < 0.12                     // 少量发光金粉
    };
  }
  for (var p = 0; p < COUNT; p++) particles.push(makeParticle());

  /* ============ 交互：鼠标 / 触摸 ============ */
  var target = { x: W * 0.5, y: H * 0.45 };
  var lastTarget = { x: target.x, y: target.y };
  var pointerSpeed = 0;
  var hasInteracted = false;

  function setTarget(x, y) {
    target.x = x; target.y = y;
    if (!hasInteracted) {
      hasInteracted = true;
      hintEl.classList.add("hide");
      titleEl.classList.add("dim");
    }
  }
  window.addEventListener("mousemove", function (e) {
    if (mode !== "live") return;
    setTarget(e.clientX, e.clientY);
  });
  window.addEventListener("touchstart", function (e) {
    if (e.target.closest && e.target.closest(".btn")) return;
    if (mode !== "live") return;
    var t = e.touches[0];
    setTarget(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener("touchmove", function (e) {
    if (mode !== "live") return;
    var t = e.touches[0];
    setTarget(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  /* ============ 模式：live / replay ============ */
  var mode = "live";        // live=跟随鼠标, replay=自动回放
  var replayT = 0;
  var REPLAY_DUR = 9;       // 回放秒数

  function replayPath(time) {
    // 自动舞动的飞行轨迹：双纽线 + 竖向余弦，像飞天回旋
    var cx = W * 0.5, cy = H * 0.46;
    var rx = W * 0.34, ry = H * 0.26;
    var w = time * 1.15;
    var s = Math.sin(w), c = Math.cos(w);
    return {
      x: cx + rx * s * c * 2 / (1 + s * s) + Math.sin(time * 0.7) * W * 0.05,
      y: cy + ry * Math.sin(w * 2) * 0.8 + Math.cos(time * 0.5) * H * 0.06
    };
  }

  btnReplay.addEventListener("click", function () {
    mode = "replay";
    replayT = 0;
    btnReplay.classList.add("active");
    hintEl.classList.add("hide");
    titleEl.classList.remove("dim");
  });

  var paused = false;
  btnPause.addEventListener("click", function () {
    paused = !paused;
    btnPause.textContent = paused ? "继 续" : "暂 停";
    btnPause.classList.toggle("active", paused);
    if (!paused) { lastTime = performance.now(); requestAnimationFrame(loop); }
  });

  /* ============ 主循环 ============ */
  var time = 0;
  var lastTime = performance.now();
  var frame = 0;

  function loop(now) {
    if (paused) return;
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    time += dt;
    frame++;

    /* --- 回放推进 --- */
    if (mode === "replay") {
      replayT += dt;
      var rp = replayPath(replayT);
      target.x = rp.x; target.y = rp.y;
      if (replayT >= REPLAY_DUR) {
        mode = "live";
        target.x = W * 0.5; target.y = H * 0.45;
        btnReplay.classList.remove("active");
      }
    }

    /* --- 指针速度（决定散开程度） --- */
    var dx = target.x - lastTarget.x, dy = target.y - lastTarget.y;
    var inst = Math.hypot(dx, dy) / Math.max(dt, 0.001);
    pointerSpeed += (inst - pointerSpeed) * 0.12;
    lastTarget.x = target.x; lastTarget.y = target.y;
    // 0(静)~1(狂舞)
    var excite = Math.min(1, pointerSpeed / 1400);

    /* --- 飘带头跟随 + 弹簧链 --- */
    head.x += (target.x - head.x) * Math.min(1, dt * 10);
    head.y += (target.y - head.y) * Math.min(1, dt * 10);
    trail[0].x = head.x; trail[0].y = head.y;
    var sl = SEG_LEN();
    for (var i = 1; i < SEG; i++) {
      var a = trail[i], b = trail[i - 1];
      var ddx = a.x - b.x, ddy = a.y - b.y;
      var d = Math.hypot(ddx, ddy) || 1;
      // 约束节距 + 柔性回弹
      var pull = (d - sl) / d;
      a.x -= ddx * pull * 0.62;
      a.y -= ddy * pull * 0.62;
      // 每节自带一点正弦波动，让飘带"活"
      a.x += Math.sin(time * 2.2 + i * 0.42) * 14 * dt;
      a.y += Math.cos(time * 1.8 + i * 0.35) * 10 * dt;
    }

    /* --- 背景：壁画残影（拖尾不清屏） --- */
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(23, 16, 10, 0.22)";
    ctx.fillRect(0, 0, W, H);

    /* --- 飘带底层柔光带 --- */
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (var k = SEG - 1; k > 0; k--) {
      var tt = 1 - k / SEG;                 // 头 0 → 尾 1
      var wd = (1 - tt) * Math.min(W, H) * 0.028 + 1;
      var fade = (1 - tt);
      ctx.strokeStyle = "rgba(" + 178 + "," + 90 + "," + 60 + "," + (0.05 * fade).toFixed(3) + ")";
      ctx.lineWidth = wd * (1.6 + Math.sin(time * 3 + k * 0.3) * 0.4);
      ctx.beginPath();
      ctx.moveTo(trail[k].x, trail[k].y);
      ctx.lineTo(trail[k - 1].x, trail[k - 1].y);
      ctx.stroke();
    }

    /* --- 粒子：散开 ⇄ 聚拢 --- */
    var springK = 6.5 - excite * 5.2;       // 快→弹簧弱→散开
    var friction = 0.9 - excite * 0.06;
    var noiseAmp = excite * excite * 260;   // 散开冲量
    var baseW = Math.min(W, H) * 0.05;

    for (var j = 0; j < particles.length; j++) {
      var pt = particles[j];

      // 归宿点：飘带上 + 横向偏移 + 尾部更宽 + 正弦飘动
      var rpnt = ribbonPoint(pt.t, time);
      var nrm = ribbonNormal(pt.t);
      var widthHere = baseW * (0.25 + pt.t * 1.1) * pt.widthK;
      var sway = Math.sin(time * pt.flutter * 2 + pt.phase) * widthHere * 0.6;
      var hx = rpnt.x + nrm.x * (pt.side * widthHere + sway);
      var hy = rpnt.y + nrm.y * (pt.side * widthHere + sway);

      // 弹簧归位
      pt.vx += (hx - pt.x) * springK * dt;
      pt.vy += (hy - pt.y) * springK * dt;

      // 散开冲量（兴奋时注入乱流）
      if (noiseAmp > 1) {
        pt.vx += (Math.random() - 0.5) * noiseAmp * dt;
        pt.vy += (Math.random() - 0.5) * noiseAmp * dt;
      }

      pt.vx *= friction; pt.vy *= friction;
      pt.x += pt.vx * dt * 60 * 0.016 * 60; // 帧率无关近似
      pt.y += pt.vy * dt * 60 * 0.016 * 60;

      // 越分散越淡，聚合时颜色饱满
      var spread = Math.min(1, Math.hypot(pt.x - hx, pt.y - hy) / 120);
      var al = pt.alpha * (1 - spread * 0.75);

      if (pt.glow) {
        ctx.fillStyle = "rgba(240,210,140," + (al * 0.5).toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size * 3.2, 0, 6.2832);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(" + pt.r + "," + pt.g + "," + pt.b + "," + al.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, 6.2832);
      ctx.fill();
    }

    requestAnimationFrame(loop);
  }

  /* --- 开场：先自动舞一段，引人入画 --- */
  mode = "replay";
  replayT = 0;
  btnReplay.classList.add("active");
  setTimeout(function () { hintEl.classList.remove("hide"); }, REPLAY_DUR * 1000);

  ctx.fillStyle = "#17100a";
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(loop);
})();
</script>
