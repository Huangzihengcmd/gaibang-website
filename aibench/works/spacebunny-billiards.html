<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D 台球 · 黑八</title>
<style>
  :root{
    --bg:#0b0e13; --panel:rgba(18,24,32,.82); --line:rgba(255,255,255,.10);
    --txt:#e8eef5; --dim:#8ea0b4; --acc:#39d98a; --acc2:#f5c542; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    user-select:none;-webkit-user-select:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  #hud{position:fixed;inset:0;pointer-events:none}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(0,0,0,.45)}
  .lbl{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

  /* 左上：比分/玩家 */
  #topbar{position:absolute;left:18px;top:18px;display:flex;gap:10px}
  .player{min-width:150px;padding:11px 14px;border-radius:14px;transition:.22s;position:relative;overflow:hidden}
  .player .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .player .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .player .balls{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:14px}
  .pb{width:15px;height:15px;border-radius:50%;position:relative;
    box-shadow:inset -2px -3px 5px rgba(0,0,0,.45),inset 2px 2px 3px rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.5)}
  .pb.gone{opacity:.17;filter:grayscale(1)}
  .player.act{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 10px 30px rgba(57,217,138,.16)}
  .player.act .dot{box-shadow:0 0 0 0 var(--acc);animation:pl 1.6s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(57,217,138,.55)}70%{box-shadow:0 0 0 8px rgba(57,217,138,0)}100%{box-shadow:0 0 0 0 rgba(57,217,138,0)}}

  /* 右上：按钮 */
  #tools{position:absolute;right:18px;top:18px;display:flex;gap:8px;pointer-events:auto}
  .btn{padding:9px 13px;font-size:12.5px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);cursor:pointer;backdrop-filter:blur(14px);
    transition:.16s;white-space:nowrap;font-family:inherit}
  .btn:hover{background:rgba(40,52,66,.9);border-color:rgba(255,255,255,.24)}
  .btn.on{background:rgba(57,217,138,.18);border-color:var(--acc);color:#bff5da}

  /* 中上：状态 */
  #msg{position:absolute;left:50%;top:20px;transform:translateX(-50%);padding:9px 20px;
    font-size:13.5px;letter-spacing:.03em;text-align:center;max-width:62vw;
    opacity:0;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #msg.show{opacity:1}
  #msg b{color:var(--acc2)}

  /* 底部：力度 */
  #bottom{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
    display:flex;align-items:center;gap:16px;padding:12px 18px}
  #spins{display:flex;gap:5px;pointer-events:auto}
  .spin{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    cursor:pointer;display:grid;place-items:center;transition:.15s;color:var(--dim);font-size:14px}
  .spin:hover{background:rgba(255,255,255,.1)}
  .spin.act{background:rgba(245,197,66,.2);border-color:var(--acc2);color:#ffe6a3}
  .spin.eng{border-color:rgba(120,180,255,.4)}
  .spin.eng.act{background:rgba(120,180,255,.22);border-color:#7cb8ff;color:#cfe6ff}
  #bar{width:230px;height:9px;border-radius:9px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
  #fill{height:100%;width:0%;border-radius:9px;background:linear-gradient(90deg,#39d98a,#f5c542 62%,#ff5f5f);transition:width .04s linear}
  #barhint{font-size:11.5px;color:var(--dim);min-width:96px}

  /* 左下：帮助 */
  #help{position:absolute;left:18px;bottom:20px;padding:11px 14px;font-size:11.5px;
    line-height:1.85;color:var(--dim);max-width:250px}
  #help kbd{display:inline-block;min-width:17px;text-align:center;padding:1px 5px;margin-right:5px;
    border-radius:5px;background:rgba(255,255,255,.09);border:1px solid var(--line);
    color:var(--txt);font-size:10.5px;font-family:inherit}
  #help .t{color:var(--txt);font-weight:600;font-size:12px;display:block;margin-bottom:5px;letter-spacing:.06em}

  /* 摆球提示 */
  #place{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    padding:20px 30px;opacity:0;transition:.2s;pointer-events:none}
  #place.show{opacity:1}
  #place .big{font-size:19px;font-weight:700;color:var(--acc2);margin-bottom:6px}
  #place .sm{font-size:12.5px;color:var(--dim)}

  /* 结算 */
  #over{position:absolute;inset:0;display:none;place-items:center;background:rgba(5,8,12,.72);
    backdrop-filter:blur(6px);pointer-events:auto}
  #over.show{display:grid}
  #overbox{padding:34px 44px;text-align:center;border-radius:20px}
  #overbox h1{font-size:30px;margin-bottom:8px}
  #overbox p{color:var(--dim);font-size:13px;margin-bottom:20px}
  #overbox button{padding:11px 26px;font-size:14px;border-radius:12px;border:none;cursor:pointer;
    background:var(--acc);color:#062b18;font-weight:700;font-family:inherit}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 85% at 50% 42%,transparent 52%,rgba(0,0,0,.62) 100%)}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;
    font-size:13px;color:var(--dim);transition:opacity .4s}
  @media(max-width:860px){
    .player{min-width:112px} #help{display:none} #bar{width:150px}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>

<div id="hud">
  <div id="topbar">
    <div class="player pane" id="p1">
      <div class="nm"><span class="dot" style="background:#39d98a"></span>玩家一 · 全色球</div>
      <div class="balls" id="b1"></div>
    </div>
    <div class="player pane" id="p2">
      <div class="nm"><span class="dot" style="background:#7cb8ff"></span>玩家二 · 花色球</div>
      <div class="balls" id="b2"></div>
    </div>
  </div>

  <div id="tools">
    <button class="btn" id="bTop">俯视 <kbd style="opacity:.5">V</kbd></button>
    <button class="btn" id="bCam">环视 <kbd style="opacity:.5">C</kbd></button>
    <button class="btn" id="bReset">重新开局 <kbd style="opacity:.5">R</kbd></button>
  </div>

  <div id="msg" class="pane"></div>

  <div id="bottom" class="pane">
    <div id="spins">
      <div class="spin" data-s="draw" title="低杆：白球撞击后回缩">◣</div>
      <div class="spin act" data-s="stun" title="中杆：白球撞击后停住">◈</div>
      <div class="spin" data-s="follow" title="高杆：白球撞击后跟进">◥</div>
      <div class="spin eng" data-e="-1" title="左塞">⟨</div>
      <div class="spin eng" data-e="1" title="右塞">⟩</div>
    </div>
    <div id="bar"><div id="fill"></div></div>
    <div id="barhint">移动瞄准 · 按住蓄力</div>
  </div>

  <div id="help" class="pane">
    <span class="t">操作</span>
    <div><kbd>移</kbd>瞄准线路</div>
    <div><kbd>左键</kbd>按住蓄力，松开出杆</div>
    <div><kbd>右键</kbd>拖动环视 · <kbd>滚轮</kbd>推拉</div>
    <div><kbd>V</kbd>俯视规划 · <kbd>C</kbd>跟球视角</div>
    <div><kbd>R</kbd>重新开局</div>
  </div>

  <div id="place" class="pane">
    <div class="big">自由球</div>
    <div class="sm">点击台面放置白球位置</div>
  </div>

  <div id="over"><div id="overbox" class="pane">
    <h1 id="ovt"></h1><p id="ovs"></p><button id="ovb">再来一局</button>
  </div></div>
</div>

<div id="boot">正在生成球台材质…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   常量
============================================================ */
const L = 2.54, W = 1.27;          // 台面内沿
const RAIL = 0.085;               // 库边宽度
const R = 0.028575;               // 球半径
const BALL_D = R*2;
const TABLE_TOP = 0.75;           // 台面离地高度
const ROLL_DECEL = 0.98;          // 台呢滚动减速度 m/s^2
const CUSHION_E = 0.755;          // 库边恢复系数
const BALL_E   = 0.945;           // 球间恢复系数
const TANG_F   = 0.986;           // 切向保留
const RAIL_F   = 0.90;            // 库边切向摩擦
const STOP_V   = 0.019;
const DT       = 1/360;
const MAX_V    = 6.6;
const MIN_V    = 1.15;

const POCKETS = [
  {x:-L/2, z: W/2}, {x:0, z: W/2}, {x: L/2, z: W/2},
  {x:-L/2, z:-W/2}, {x:0, z:-W/2}, {x: L/2, z:-W/2}
];
// 洞口（略缩进台面内，视觉与物理共用）
const HOLES = [
  {x:-1.245, z: 0.625, r:0.090, p:0}, {x:0, z: 0.645, r:0.070, p:1}, {x:1.245, z: 0.625, r:0.090, p:2},
  {x:-1.245, z:-0.625, r:0.090, p:3}, {x:0, z:-0.645, r:0.070, p:4}, {x:1.245, z:-0.625, r:0.090, p:5}
];

const COLORS = [0xf5d021,0x1455c8,0xcf2f2f,0x71389e,0xe5721c,0x127a45,0x8c3a1c,
                0x16181c,0xf5d021,0x1455c8,0xcf2f2f,0x71389e,0xe5721c,0x127a45,0x8c3a1c,0x16181c];
const CN = ['红','黄','蓝','紫','橙','绿','栗','黑','红','黄','蓝','紫','橙','绿','栗','黑'];

/* ============================================================
   渲染基础
============================================================ */
const cv = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090c11);
scene.fog = new THREE.Fog(0x090c11, 4.5, 12);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.05, 60);
camera.position.set(-2.4, 1.6, 1.9);

// 环境反射（让球有"漆面"质感）
try{
  const pm = new THREE.PMREMGenerator(renderer);
  pm.compileEquirectangularShader();
  const env = new RoomEnvironment();
  scene.environment = pm.fromScene(env, 0.03).texture;
  pm.dispose();
}catch(e){ console.warn('env skipped', e); }

const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x1a1208, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e2, 1.15);
key.position.set(1.4, 3.4, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-2.0; key.shadow.camera.right=2.0;
key.shadow.camera.top=1.9; key.shadow.camera.bottom=-1.9;
key.shadow.camera.near=0.5; key.shadow.camera.far=8;
key.shadow.bias=-0.0009; key.shadow.normalBias=0.012;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa9c8ff, 0.30);
fill.position.set(-2.2, 2.0, -2.0);
scene.add(fill);

/* ============================================================
   程序化贴图
============================================================ */
function cv2(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

function ballTexture(num, color){
  const W_=640,H_=320, c=cv2(W_,H_), g=c.getContext('2d');
  const hex='#'+color.toString(16).padStart(6,'0');
  // 球体底色
  g.fillStyle='#f6f2e8'; g.fillRect(0,0,W_,H_);
  // 极区微暗，增加体积感
  const lg=g.createLinearGradient(0,0,0,H_);
  lg.addColorStop(0,'rgba(0,0,0,0.10)'); lg.addColorStop(0.16,'rgba(0,0,0,0)');
  lg.addColorStop(0.84,'rgba(0,0,0,0)'); lg.addColorStop(1,'rgba(0,0,0,0.12)');
  g.fillStyle=lg; g.fillRect(0,0,W_,H_);
  // 中央色带
  const y0=H_*0.437, y1=H_*0.563;
  const bg=g.createLinearGradient(0,y0,0,y1);
  bg.addColorStop(0,'rgba(0,0,0,0.18)'); bg.addColorStop(0.45,hex);
  bg.addColorStop(1,'rgba(255,255,255,0.20)');
  g.fillStyle=bg; g.fillRect(0,y0,W_,y1-y0);
  // 号码圈位于 u=0.25（球局部 +Z 方向）
  const cx=W_*0.25, cy=H_*0.5, rr=H_*0.152;
  g.fillStyle='#fbfaf6'; g.beginPath(); g.arc(cx,cy,rr,0,6.2832); g.fill();
  g.strokeStyle='rgba(0,0,0,0.13)'; g.lineWidth=2; g.stroke();
  g.fillStyle = num===8 ? '#c8342c' : '#1a1c20';
  g.font='bold italic '+Math.round(rr*1.30)+'px Arial, Helvetica, sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(String(num), cx, cy+rr*0.06);
  // 极区小圆点（1号球标志位，省略编号，留纯色）
  const tex=new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function woodTexture(){
  const W_=512,H_=512, c=cv2(W_,H_), g=c.getContext('2d');
  g.fillStyle='#4a2f1d'; g.fillRect(0,0,W_,H_);
  for(let i=0;i<260;i++){
    const y=Math.random()*H_;
    g.strokeStyle='rgba('+(90+Math.random()*70|0)+','+(52+Math.random()*40|0)+','+(28+Math.random()*26|0)+','+(0.10+Math.random()*0.30).toFixed(2)+')';
    g.lineWidth=0.6+Math.random()*2.6;
    g.beginPath(); g.moveTo(0,y);
    for(let x=0;x<=W_;x+=32) g.lineTo(x, y+Math.sin((x/W_)*7+i)*5.5 + (Math.random()-0.5)*3);
    g.stroke();
  }
  const vg=g.createLinearGradient(0,0,0,H_);
  vg.addColorStop(0,'rgba(255,220,180,0.10)'); vg.addColorStop(1,'rgba(0,0,0,0.28)');
  g.fillStyle=vg; g.fillRect(0,0,W_,H_);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

function clothTexture(){
  const S_=512, c=cv2(S_,S_), g=c.getContext('2d');
  g.fillStyle='#12603e'; g.fillRect(0,0,S_,S_);
  const im=g.getImageData(0,0,S_,S_), d=im.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()*30-15)|0;
    d[i]=Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
  }
  g.putImageData(im,0,0);
  // 绒毛方向
  g.globalAlpha=0.055;
  for(let i=0;i<900;i++){
    g.strokeStyle= Math.random()>0.5?'#ffffff':'#000000';
    g.lineWidth=1; const x=Math.random()*S_, y=Math.random()*S_;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+ (Math.random()-0.5)*16, y+(Math.random()-0.5)*16); g.stroke();
  }
  g.globalAlpha=1;
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,1.6);
  return t;
}

function floorTexture(){
  const S_=256,c=cv2(S_,S_),g=c.getContext('2d');
  g.fillStyle='#141a22'; g.fillRect(0,0,S_,S_);
  for(let i=0;i<2600;i++){
    g.fillStyle='rgba('+(40+Math.random()*26|0)+','+(48+Math.random()*26|0)+','+(60+Math.random()*28|0)+',0.5)';
    g.fillRect(Math.random()*S_,Math.random()*S_,2,2);
  }
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(9,9);
  return t;
}

/* ============================================================
   球台搭建
============================================================ */
const table = new THREE.Group(); table.position.y = TABLE_TOP; scene.add(table);

const wood = woodTexture();
const woodMat = new THREE.MeshStandardMaterial({map:wood, roughness:0.42, metalness:0.06, color:0xffffff});
const woodMat2 = new THREE.MeshStandardMaterial({map:wood, roughness:0.5, metalness:0.05, color:0xd9c8b8});
const cloth = clothTexture();
const clothMat = new THREE.MeshStandardMaterial({map:cloth, roughness:0.94, metalness:0.0});

// --- 木框（带 6 个袋洞）---
(function buildRails(){
  const ow = L/2 + RAIL, oh = W/2 + RAIL;
  const s = new THREE.Shape();
  s.moveTo(-ow, -oh); s.lineTo(ow,-oh); s.lineTo(ow,oh); s.lineTo(-ow,oh); s.closePath();
  HOLES.forEach(h=>{
    const p = new THREE.Path();
    p.absarc(h.x, h.z, h.r, 0, Math.PI*2, true);
    s.holes.push(p);
  });
  const geo = new THREE.ExtrudeGeometry(s, {depth:0.062, bevelEnabled:true, bevelThickness:0.004,
    bevelSize:0.004, bevelSegments:2, curveSegments:24});
  geo.rotateX(Math.PI/2);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, woodMat);
  m.castShadow = true; m.receiveShadow = true;
  table.add(m);
})();

// --- 台呢 ---
const felt = new THREE.Mesh(new THREE.PlaneGeometry(L, W), clothMat);
felt.rotation.x = -Math.PI/2; felt.position.y = 0.001; felt.receiveShadow = true;
table.add(felt);

// --- 桌体 ---
(function buildBody(){
  const bw = L + 2*RAIL + 0.075, bd = W + 2*RAIL + 0.075, bh = 0.70;
  const body = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), woodMat2);
  body.position.y = -0.062 - bh/2;
  body.castShadow = true; body.receiveShadow = true;
  table.add(body);
  const base = new THREE.Mesh(new THREE.BoxGeometry(bw-0.14, 0.09, bd-0.14), woodMat);
  base.position.y = -0.062 - bh - 0.045;
  base.castShadow = true; base.receiveShadow = true;
  table.add(base);
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(bw-0.30, 0.06, bd-0.30), new THREE.MeshStandardMaterial({color:0x1b1d22,roughness:.7,metalness:.3}));
  plinth.position.y = -0.062 - bh - 0.12; plinth.castShadow = true; plinth.receiveShadow = true;
  table.add(plinth);
})();

// --- 星位 ---
(function buildSightings(){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0xe9e2d2, roughness:.5, metalness:.15});
  const geo = new THREE.CylinderGeometry(0.006,0.006,0.0035,12);
  const pts=[];
  for(let i=1;i<=3;i++){ const x = -L/2 + L*i/4; pts.push([x, W/4],[x,-W/4]); }
  for(let i=1;i<=3;i++){ const z = -W/2 + W*i/4; pts.push([L/4,z],[-L/4,z]); }
  pts.forEach(p=>{ const m=new THREE.Mesh(geo,mat); m.position.set(p[0],0.002,p[1]); g.add(m); });
  table.add(g);
})();

// --- 袋网 ---
const netMat = new THREE.MeshStandardMaterial({color:0x0a0b0d, roughness:.95, side:THREE.DoubleSide});
(function buildNets(){
  HOLES.forEach(h=>{
    const g = new THREE.Group();
    const wall = new THREE.Mesh(new THREE.CylinderGeometry(h.r, h.r*0.34, 0.115, 20, 1, true), netMat);
    wall.position.y = -0.058; g.add(wall);
    const bot = new THREE.Mesh(new THREE.CircleGeometry(h.r*0.34, 20), netMat);
    bot.rotation.x = -Math.PI/2; bot.position.y = -0.1155; g.add(bot);
    g.position.set(h.x, 0, h.z); table.add(g);
  });
})();

// --- 袋口高亮圈 ---

function setDash(line, a, b, dash, gap){
  const pts=[]; const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
  const len=Math.hypot(dx,dy,dz); if(len<1e-5){ line.visible=false; return; }
  const n=Math.max(2, Math.ceil(len/(dash+gap)));
  for(let i=0;i<n;i++){
    const t0=(i*(dash+gap))/len, t1=Math.min(1, ((i*(dash+gap))+dash)/len);
    if(t1<=t0) continue;
    pts.push(new THREE.Vector3(a.x+dx*t0, a.y+dy*t0, a.z+dz*t0));
    pts.push(new THREE.Vector3(a.x+dx*t1, a.y+dy*t1, a.z+dz*t1));
  }
  line.geometry.dispose();
  line.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  line.visible = true;
}
function setSolid(line, a, b){
  line.geometry.dispose();
  line.geometry = new THREE.BufferGeometry().setFromPoints([a,b]);
  line.visible = true;
}

/* ============================================================
   物理
============================================================ */
function inHole(x,z,h,shrink){
  const r = h.r - (shrink===undefined? R*0.55 : shrink);
  if(r<=0) return false;
  const dx=x-h.x, dz=z-h.z;
  return dx*dx+dz*dz < r*r;
}
function holeOpenX(x,z){
  // x = ±L/2 边界：该处是否有开口
  for(const h of HOLES) if(inHole(x,z,h)) return true;
  return false;
}
function holeOpenZ(x,z){
  for(const h of HOLES) if(inHole(x,z,h)) return true;
  return false;
}

function pocketBall(b, hi){
  const v = Math.hypot(b.vx, b.vz);
  b.pocketed = true; b.vx=0; b.vz=0; b.drop = 0;
  b.pocketIdx = hi;
  sfx.pocket(v);
  if(G.shot) G.shot.potted.push(b.id);
}

function physicsStep(dt){
  const active = balls.filter(b=>!b.pocketed);

  for(const b of active){
    // 袋口吸引
    for(const h of HOLES){
      const dx=h.x-b.x, dz=h.z-b.z, d=Math.hypot(dx,dz);
      const rr = h.r + R*0.55;
      if(d < rr && d > 1e-5){
        const k = (1 - d/rr) * 3.6;
        b.vx += (dx/d)*k*dt; b.vz += (dz/d)*k*dt;
      }
    }
    // 推进
    b.x += b.vx*dt; b.z += b.vz*dt;

    // 摩擦
    const s = Math.hypot(b.vx,b.vz);
    if(s>0){
      const ns = Math.max(0, s - ROLL_DECEL*dt);
      if(ns===0){ b.vx=0; b.vz=0; }
      else { b.vx*=ns/s; b.vz*=ns/s; }
    }

    // 边界
    if(Math.abs(b.x)+R > L/2){
      if(!holeOpenX(Math.sign(b.x)*L/2, b.z)){
        b.x = Math.sign(b.x)*(L/2 - R);
        if(b.vx*Math.sign(b.x) > 0){
          const impact = Math.abs(b.vx);
          b.vx = -b.vx*CUSHION_E;
          b.vz = b.vz*RAIL_F + G.english*impact*0.42;
          if(G.shot && !G.shot.cushion) G.shot.cushion = true;
          sfx.cushion(impact);
        }
      }
    }
    if(Math.abs(b.z)+R > W/2){
      if(!holeOpenZ(b.x, Math.sign(b.z)*W/2)){
        b.z = Math.sign(b.z)*(W/2 - R);
        if(b.vz*Math.sign(b.z) > 0){
          const impact = Math.abs(b.vz);
          b.vz = -b.vz*CUSHION_E;
          b.vx = b.vx*RAIL_F + G.english*impact*0.42;
          if(G.shot && !G.shot.cushion) G.shot.cushion = true;
          sfx.cushion(impact);
        }
      }
    }

    // 落袋
    for(let i=0;i<HOLES.length;i++){
      if(inHole(b.x, b.z, HOLES[i], R*0.35)) { pocketBall(b,i); break; }
    }
  }

  // 球-球
  for(let i=0;i<active.length;i++){
    const a = active[i];
    if(a.pocketed) continue;
    for(let j=i+1;j<active.length;j++){
      const b = active[j];
      if(b.pocketed) continue;
      let dx=b.x-a.x, dz=b.z-a.z;
      let d2 = dx*dx+dz*dz;
      if(d2 >= BALL_D*BALL_D) continue;
      let d = Math.sqrt(d2);
      if(d < 1e-7){ dx=1; dz=0; d=1e-7; }
      const nx=dx/d, nz=dz/d;
      const ov = (BALL_D - d)*0.5 + 1e-6;
      a.x -= nx*ov; a.z -= nz*ov;
      b.x += nx*ov; b.z += nz*ov;
      const rvx=b.vx-a.vx, rvz=b.vz-a.vz;
      const vn = rvx*nx + rvz*nz;
      if(vn < 0){
        const jimp = -(1+BALL_E)*vn*0.5;
        a.vx -= jimp*nx; a.vz -= jimp*nz;
        b.vx += jimp*nx; b.vz += jimp*nz;
        // 切向摩擦（撞击带来的轻微"throw"）
        const tx=-nz, tz=nx;
        const vt = (b.vx-a.vx)*tx + (b.vz-a.vz)*tz;
        const jt = -vt*0.012;
        a.vx -= jt*tx; a.vz -= jt*tz;
        b.vx += jt*tx; b.vz += jt*tz;
        const imp = Math.abs(vn);
        sfx.hit(imp);
        if(G.shot && !G.shot.first){
          if(a.id===0) G.shot.first = b.id; else if(b.id===0) G.shot.first = a.id;
        }
        // 杆法（仅对白球的第一碰撞生效）
        if(G.shot && !G.shot.spinApplied){
          if(a.id===0){ applySpin(a,nx,nz); G.shot.spinApplied=true; }
          else if(b.id===0){ applySpin(b,-nx,-nz); G.shot.spinApplied=true; }
        }
      }
    }
  }
}
function applySpin(cue, nx, nz){
  const sp = Math.hypot(cue.vx, cue.vz);
  if(sp < 1e-4) return;
  if(G.spin==='stun'){ const k=0.90; cue.vx*=k; cue.vz*=k; }
  else if(G.spin==='follow'){ const k=0.995; cue.vx*=k; cue.vz*=k; cue.vx+=nx*sp*0.10; cue.vz+=nz*sp*0.10; }
  else { const k=0.62; cue.vx=-cue.vx*0.55 + nx*sp*0.12; cue.vz=-cue.vz*0.55 + nz*sp*0.12; }
}

function allStopped(){
  for(const b of balls){ if(b.pocketed) continue;
    if(Math.hypot(b.vx,b.vz) > STOP_V) return false; }
  return true;
}
function freezeAll(){
  for(const b of balls){ if(b.pocketed) continue; if(Math.hypot(b.vx,b.vz)<=STOP_V){b.vx=0;b.vz=0;} }
}

/* ============================================================
   射线预测
============================================================ */
function castRay(ox,oz,dx,dz,ignoreId){
  let bestT = Infinity, type='none', ball=null, nx=0, nz=0;
  for(const b of balls){
    if(b.pocketed || b.id===ignoreId) continue;
    const ex=b.x-ox, ez=b.z-oz;
    const proj = ex*dx + ez*dz;
    if(proj<=0) continue;
    const perp2 = ex*ex+ez*ez - proj*proj;
    const rr = BALL_D*BALL_D;
    if(perp2 < rr){
      const t = proj - Math.sqrt(rr-perp2);
      if(t>0 && t<bestT){ bestT=t; type='ball'; ball=b; }
    }
  }
  const tw = Math.abs(dx)>1e-6 ? ((dx>0? L/2 : -L/2) - ox)/dx : Infinity;
  if(tw>0 && tw<bestT){
    const hz = oz + dz*tw;
    if(!holeOpenX(Math.sign(dx)*L/2, hz)){
      bestT=tw; type='cushion'; ball=null; nx=-dx; nz=-dz;
    }
  }
  const td = Math.abs(dz)>1e-6 ? ((dz>0? W/2 : -W/2) - oz)/dz : Infinity;
  if(td>0 && td<bestT){
    const hx = ox + dx*td;
    if(!holeOpenZ(hx, Math.sign(dz)*W/2)){
      bestT=td; type='cushion'; ball=null; nx=-dz; nz=dx;
    }
  }
  return {t:bestT, type:type, ball:ball, nx:nx, nz:nz};
}
function pocketLineDir(x,z,dx,dz){
  // 沿 (dx,dz) 前进能否进某个袋
  for(let i=0;i<POCKETS.length;i++){
    const p=POCKETS[i];
    const ex=p.x-x, ez=p.z-z;
    const d=Math.hypot(ex,ez);
    if(d<1e-4) continue;
    const dot=(ex*dx+ez*dz)/d;
    if(dot<0.86) continue;
    const perp = Math.abs(ex*(-dz)+ez*(dx))/d;
    if(perp < 0.075) return i;
  }
  return -1;
}

const _pt=(x,y,z)=>new THREE.Vector3(x,y,z);

function updateAim(){
  const canShoot = (G.state==='idle') && !cueBall().pocketed && !G.topViewLock;
  lineCue.visible=lineObj.visible=linePot.visible=lineRest.visible=false;
  ghost.visible=false;
  if(!canShoot) return;

  const cue0 = cueBall();
  const ox=cue0.x, oz=cue0.z, dx=G.aim.x, dz=G.aim.y;
  const hit = castRay(ox,oz,dx,dz,0);
  const py = TABLE_TOP + R;
  const endD = Math.min(hit.t, 12);
  const p1 = _pt(ox+dx*endD, py, oz+dz*endD);

  if(hit.type==='cushion'){
    setSolid(lineCue, _pt(ox,py,oz), p1);
    const rx = hit.nx>0? hit.nx : (hit.nz===0?0:0);
    // 库边反射方向
    let bdx = dx, bdz = dz;
    if(Math.abs(hit.nz) > 0 && Math.abs(dz)>Math.abs(dx)) bdz = -dz; else bdx = -dx;
    const back = Math.min(0.42, Math.max(0.12, endD*0.5));
    setDash(lineObj, p1, _pt(p1.x+bdx*back, py, p1.z+bdz*back), 0.028, 0.022);
  } else if(hit.type==='ball'){
    setSolid(lineCue, _pt(ox,py,oz), p1);
    ghost.position.set(hit.ball.x, py, hit.ball.z);
    ghost.rotation.x = -Math.PI/2; ghost.visible = true;
    const sepLen = 0.52;
    setDash(lineObj, _pt(hit.ball.x,py,hit.ball.z), _pt(hit.ball.x+dx*sepLen, py, hit.ball.z+dz*sepLen), 0.03, 0.022);
    const pi = pocketLineDir(hit.ball.x, hit.ball.z, dx, dz);
    if(pi>=0){
      setDash(linePot, _pt(hit.ball.x,py,hit.ball.z), _pt(POCKETS[pi].x, py, POCKETS[pi].z), 0.036, 0.028);
      G.hitPocket = pi;
    } else G.hitPocket = -1;
    // 白球后续
    const restK = G.spin==='follow'? 0.42 : (G.spin==='draw'? -0.22 : 0.06);
    if(restK!==0){
      const L2 = Math.min(0.38, Math.max(0.07, hit.t*0.42));
      setDash(lineRest, _pt(hit.ball.x,py,hit.ball.z), _pt(hit.ball.x - dx*L2*Math.sign(restK)*0.2 - dx*L2, py, hit.ball.z - dz*L2*Math.sign(restK)*0.2 - dz*L2), 0.024,0.02);
      lineRest.geometry.setFromPoints([
        _pt(hit.ball.x,py,hit.ball.z),
        _pt(hit.ball.x - dx*L2*(restK>0?1:-1)*1.4 + (restK<0?0:0), py, hit.ball.z - dz*L2*(restK>0?1:-1)*1.4)
      ]);
    }
  } else {
    const L2 = Math.min(1.6, endD);
    setSolid(lineCue, _pt(ox,py,oz), _pt(ox+dx*L2, py, oz+dz*L2));
    G.hitPocket = pocketLineDir(ox,oz,dx,dz);
  }
}

/* ============================================================
   音效
============================================================ */
const sfx = (function(){
  let ac=null, noise=null, ok=false;
  function init(){
    if(ac) return;
    try{
      ac = new (window.AudioContext||window.webkitAudioContext)();
      const len = ac.sampleRate*0.25;
      noise = ac.createBuffer(1, len, ac.sampleRate);
      const d = noise.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
      ok = true;
    }catch(e){ ok=false; }
  }
  function env(node, t0, vol, dur){
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    node.connect(g); g.connect(ac.destination);
    return g;
  }
  return {
    unlock(){ init(); if(ac && ac.state==='suspended') ac.resume(); },
    hit(v){
      if(!ok) return; const t=ac.currentTime;
      const vol = Math.min(0.42, 0.035 + v*0.10);
      const src=ac.createBufferSource(); src.buffer=noise;
      const bp=ac.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value = 1500 + Math.min(3500, v*520); bp.Q.value=1.1;
      src.connect(bp); env(bp,t,vol,0.055); src.start(t); src.stop(t+0.1);
      const o=ac.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(560+Math.min(900,v*150), t);
      o.frequency.exponentialRampToValueAtTime(220, t+0.06);
      env(o,t,vol*0.55,0.07); o.start(t); o.stop(t+0.12);
    },
    cushion(v){
      if(!ok) return; const t=ac.currentTime;
      const vol=Math.min(0.34, 0.03+v*0.075);
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(64, t+0.13);
      env(o,t,vol,0.15); o.start(t); o.stop(t+0.2);
      const src=ac.createBufferSource(); src.buffer=noise;
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
      src.connect(lp); env(lp,t,vol*0.5,0.07); src.start(t); src.stop(t+0.12);
    },
    pocket(){
      if(!ok) return; const t=ac.currentTime;
      const src=ac.createBufferSource(); src.buffer=noise;
      const lp=ac.createBiquadFilter(); lp.type='lowpass';
      lp.frequency.setValueAtTime(900,t); lp.frequency.exponentialRampToValueAtTime(140,t+0.28);
      src.connect(lp); env(lp,t,0.24,0.30); src.start(t); src.stop(t+0.36);
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(48,t+0.24);
      env(o,t+0.02,0.16,0.28); o.start(t+0.02); o.stop(t+0.36);
    },
    strike(p){
      if(!ok) return; const t=ac.currentTime;
      const vol=0.06+p*0.24;
      const src=ac.createBufferSource(); src.buffer=noise;
      const bp=ac.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value=900+p*1400; bp.Q.value=0.9;
      src.connect(bp); env(bp,t,vol,0.07); src.start(t); src.stop(t+0.12);
      const o=ac.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(150,t+0.09);
      env(o,t,vol*0.5,0.1); o.start(t); o.stop(t+0.16);
    },
    click(hi){
      if(!ok) return; const t=ac.currentTime;
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=hi?980:640;
      env(o,t,0.07,0.07); o.start(t); o.stop(t+0.1);
    },
    win(){
      if(!ok) return; const t=ac.currentTime;
      [523,659,784,1047].forEach((f,i)=>{
        const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=f;
        env(o, t+i*0.11, 0.14, 0.35); o.start(t+i*0.11); o.stop(t+i*0.11+0.45);
      });
    }
  };
})();

/* ============================================================
   回合 / 规则
============================================================ */
const el = id=>document.getElementById(id);
function toast(html, ms){
  const m = el('msg'); m.innerHTML = html; m.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>m.classList.remove('show'), ms||1900);
}
function remaining(){
  const s=[], f=[];
  balls.forEach(b=>{
    if(b.id===0||b.pocketed) return;
    if(b.id===8) return;
    (b.id<=7?s:f).push(b.id);
  });
  return {s:s, f:f};
}
function paintHUD(){
  const rem = remaining();
  const mk=(host, arr, isStripe)=>{
    host.innerHTML='';
    for(let i=1;i<=15;i++){
      if(i===8) continue;
      const d=document.createElement('div');
      const gone = arr.indexOf(i)<0;
      d.className='pb'+(gone?' gone':'');
      const col='#'+COLORS[i].toString(16).padStart(6,'0');
      if(isStripe) d.style.background='linear-gradient(180deg,#f6f2e8 0 26%,'+col+' 26% 74%,#f6f2e8 74% 100%)';
      else d.style.background='radial-gradient(circle at 34% 28%, #fff8, transparent 42%),'+col;
      d.title=CN[i]+' '+i;
      host.appendChild(d);
    }
  };
  mk(el('b1'), rem.s, false);
  mk(el('b2'), rem.f, true);
  el('p1').classList.toggle('act', G.turn===1);
  el('p2').classList.toggle('act', G.turn===2);
}

function pottedColor(){
  // 当前玩家已完成本组判定
  const rem = remaining();
  if(G.turn===1) return rem.s.length===0;
  return rem.f.length===0;
}
function groupDone(turn){
  const rem = remaining();
  return turn===1 ? rem.s.length===0 : rem.f.length===0;
}

function settle(){
  freezeAll();
  if(G.state!=='rolling') return;
  G.state='idle';
  const sh = G.shot;
  G.shot = null;

  if(!sh) { paintHUD(); return; }

  const cuePotted = balls[0].pocketed;
  let foul = false, why='';
  if(cuePotted){ foul=true; why='白球落袋'; }
  else if(sh.first===null){ foul=true; why='空杆未碰到任何球'; }
  else {
    const fg = groupOf(sh.first);
    if(!sh.free && fg !== G.turn){ foul=true; why='先碰到了不属于本方的球'; }
  }

  // 判定进球归属
  const potted = sh.potted.filter(id=>id!==0);
  const eight = potted.indexOf(8)>=0;

  if(foul){
    // 犯规：把白球重摆，犯规方所有进球还给对手（球保持在袋里归对手）
    if(cuePotted) respotCue();
    sh.potted.forEach(id=>{
      if(id===0) return;
      const g = groupOf(id);
      if(g!==G.turn){ /* 球算对手的，本方不加分 */ }
    });
    // 若犯规方进了黑8，直接判负
    if(eight && !groupDone(G.turn)){
      G.won = G.turn===1?2:1; gameOver('黑八提前落袋'); return;
    }
    toast('<b>犯规</b> · '+why+' — 对手获得自由球', 2200);
    G.ballInHand = true;
    G.turn = G.turn===1?2:1;
    G.state = 'placing';
    paintHUD();
    return;
  }

  // 正常进球
  let mine = 0;
  potted.forEach(id=>{ if(groupOf(id)===G.turn && id!==8) mine++; });

  if(eight){
    if(groupDone(G.turn)){ G.won = G.turn; gameOver('合法打进黑八'); }
    else { G.won = G.turn===1?2:1; gameOver('本方球未清完就打进黑八'); }
    return;
  }

  if(mine>0){
    const nm = potted.filter(id=>groupOf(id)===G.turn).map(id=>id+'号');
    toast('玩家'+G.turn+' 打进 <b>'+nm.join('、')+'</b> — 继续', 1800);
    if(groupDone(G.turn)) toast('玩家'+G.turn+' 清台！目标：<b>黑8</b>', 2600);
  } else {
    G.turn = G.turn===1?2:1;
    toast('玩家'+G.turn+' 回合', 1200);
  }
  paintHUD();
}

function respotCue(){
  const cb = balls[0];
  cb.pocketed=false; cb.drop=0;
  let x=-L/2+0.42, z=0, okSpot=false;
  for(let tries=0; tries<400; tries++){
    const tx = -L/2 + 0.30 + Math.random()*(L-0.60);
    const tz = -W/2 + 0.14 + Math.random()*(W-0.28);
    if(!balls.some(o=>o.id!==0 && !o.pocketed && Math.hypot(o.x-tx,o.z-tz)<BALL_D+0.004)){ x=tx; z=tz; okSpot=true; break; }
  }
  if(!okSpot){ x=-L/2+0.35; z=0; }
  cb.x=x; cb.z=z; cb.vx=cb.vz=0;
  cb.mesh.position.set(x, R, z);
  cb.mesh.visible=true; cb.mesh.scale.setScalar(1);
}

function gameOver(reason){
  G.state='over';
  sfx.win();
  const box=el('over');
  el('ovt').textContent = '玩家'+G.won+' 获胜';
  el('ovs').textContent = reason + ' · 点击再来一局';
  el('ovt').style.color = G.won===1 ? '#39d98a' : '#7cb8ff';
  box.classList.add('show');
  paintHUD();
}
el('ovb').onclick = ()=>{ el('over').classList.remove('show'); reset(); sfx.click(true); };

/* ============================================================
   开局
============================================================ */
function reset(){
  rack();
  G.turn=1; G.state='idle'; G.shot=null; G.power=0; G.charging=false;
  G.spin='stun'; G.english=0; G.ballInHand=false; G.won=0;
  G.aim.set(1,0); G.yaw=0; G.pitch=0.40; G.dist=1.15; G.topView=false;
  el('bTop').classList.remove('on'); el('bCam').classList.remove('on');
  el('place').classList.remove('show');
  paintHUD();
  toast('玩家一 开球 — 按住左键蓄力，松开出杆', 2600);
}
el('bReset').onclick = ()=>{ reset(); sfx.click(true); };

/* ============================================================
   输入
============================================================ */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tablePlane = new THREE.Plane(new THREE.Vector3(0,1,0), -TABLE_TOP);
let hoverPoint = null;
let dragging = false, dragX=0, dragY=0;

function updateNDC(e){
  ndc.x = ((e.clientX)/innerWidth)*2-1;
  ndc.y = -((e.clientY)/innerHeight)*2+1;
}
function pickTable(){
  ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  if(!ray.ray.intersectPlane(tablePlane, p)) return null;
  return p;
}

function setAimFromPointer(){
  if(G.state==='placing'){
    hoverPoint = pickTable();
    return;
  }
  if(G.state!=='idle' || balls[0].pocketed) return;
  const p = pickTable();
  if(!p) return;
  const cb = balls[0];
  const dx=p.x-cb.x, dz=p.z-cb.z;
  if(Math.hypot(dx,dz) < 0.035) return;
  G.aim.set(dx,dz).normalize();
}

cv.addEventListener('pointermove', e=>{
  updateNDC(e);
  if(dragging){
    G.yaw   -= (e.clientX-dragX)*0.0060;
    G.pitch  = Math.max(-0.22, Math.min(1.32, G.pitch - (e.clientY-dragY)*0.0040));
    dragX=e.clientX; dragY=e.clientY;
    G.camReset=false;
    return;
  }
  setAimFromPointer();
});
cv.addEventListener('pointerdown', e=>{
  sfx.unlock();
  updateNDC(e);
  if(e.button===2){
    dragging=true; dragX=e.clientX; dragY=e.clientY;
    cv.style.cursor='grabbing';
    return;
  }
  if(e.button!==0) return;
  if(G.state==='placing'){ tryPlace(); return; }
  if(G.state==='idle' && !balls[0].pocketed){
    G.charging=true; G.power=0; G.state='charging';
    el('barhint').textContent='蓄力中… 松开击球';
  }
});
window.addEventListener('pointerup', e=>{
  if(e.button===2){ dragging=false; cv.style.cursor='crosshair'; return; }
  if(G.charging){ release(); }
});
window.addEventListener('blur', ()=>{ if(G.charging) release(); dragging=false; });
cv.addEventListener('contextmenu', e=>e.preventDefault());
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  if(G.topView){ G.dist = Math.max(1.3, Math.min(4.2, G.dist + e.deltaY*0.0016)); return; }
  G.dist = Math.max(0.42, Math.min(3.2, G.dist + e.deltaY*0.0009));
},{passive:false});

function release(){
  const p = G.power;
  G.charging=false;
  el('fill').style.width='0%';
  el('barhint').textContent='移动瞄准 · 按住蓄力';
  if(p < 0.055){ G.state='idle'; G.power=0; return; }
  strike(p);
}
function strike(p){
  const cb = balls[0];
  const sp = MIN_V + p*(MAX_V-MIN_V);
  cb.vx = G.aim.x*sp; cb.vz = G.aim.y*sp;
  G.shot = {first:null, potted:[], cushion:false, spinApplied:false, free:!!G.ballInHand};
  G.ballInHand=false;
  G.state='rolling';
  G.power=0;
  sfx.strike(p);
  // 出杆动画
  cueAnim = {t:0, dir:new THREE.Vector2(G.aim.x,G.aim.y), p:p};
}

function tryPlace(){
  const p = pickTable();
  if(!p) return;
  const cb = balls[0];
  let x=p.x, z=p.z;
  x = Math.max(-L/2+R*1.1, Math.min(L/2-R*1.1, x));
  z = Math.max(-W/2+R*1.1, Math.min(W/2-R*1.1, z));
  for(const h of HOLES) if(Math.hypot(x-h.x,z-h.z) < h.r+R*0.8){ toast('这里离袋口太近',1100); return; }
  for(const b of balls){
    if(b.id===0||b.pocketed) continue;
    if(Math.hypot(b.x-x,b.z-z) < BALL_D*1.02){ toast('白球不能与其它球重叠',1100); return; }
  }
  cb.pocketed=false; cb.x=x; cb.z=z; cb.vx=cb.vz=0;
  cb.mesh.position.set(x,R,z); cb.mesh.visible=true; cb.mesh.scale.setScalar(1);
  G.state='idle'; G.ballInHand=false;
  el('place').classList.remove('show');
  toast('自由球已放置 — 玩家'+G.turn+' 击球', 1500);
  sfx.click(true);
}

// 杆法 / 塞
document.querySelectorAll('#spins .spin').forEach(el2=>{
  el2.addEventListener('click', ()=>{
    sfx.unlock();
    if(el2.dataset.s){
      G.spin = el2.dataset.s;
      document.querySelectorAll('#spins .spin[data-s]').forEach(x=>x.classList.remove('act'));
      el2.classList.add('act');
      sfx.click(false);
    } else {
      const v = parseInt(el2.dataset.e);
      G.english = (G.english===v) ? 0 : v;
      document.querySelectorAll('#spins .spin.eng').forEach(x=>x.classList.remove('act'));
      if(G.english!==0) el2.classList.add('act');
      sfx.click(false);
    }
  });
});

function toggleTop(){
  G.topView = !G.topView;
  el('bTop').classList.toggle('on', G.topView);
  if(G.topView){ G.dist=Math.max(G.dist,2.3); }
  else { G.dist=1.15; }
  sfx.click(G.topView);
}
el('bTop').onclick=toggleTop;
el('bCam').onclick=()=>{ G.yaw=0; G.pitch=0.40; G.dist=1.15; G.topView=false; el('bTop').classList.remove('on'); sfx.click(true); };
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='v') toggleTop();
  else if(k==='r') reset();
  else if(k==='c'){ G.yaw=0; G.pitch=0.40; G.dist=1.15; G.topView=false; el('bTop').classList.remove('on'); }
  else if(k==='w'){ G.pitch=Math.min(1.32,G.pitch+0.08); }
  else if(k==='s'){ G.pitch=Math.max(-0.22,G.pitch-0.08); }
  else if(k==='a'){ G.yaw+=0.15; }
  else if(k==='d'){ G.yaw-=0.15; }
});
window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   相机 / 渲染循环
============================================================ */
let cueAnim = null;
const camPos = new THREE.Vector3(-2.4,1.6,1.9);
const camTgt = new THREE.Vector3(0,TABLE_TOP,0);
const _t = new THREE.Vector3(), _p = new THREE.Vector3();

function updateCamera(dt){
  const cb = balls[0];
  const ax = G.aim.x, az = G.aim.y;
  // 相机方向 = 瞄准方向绕 Y 偏转 yaw
  const cy = Math.cos(G.yaw), sy = Math.sin(G.yaw);
  const dx = ax*cy - az*sy, dz = ax*sy + az*cy;

  if(G.topView){
    const cx = 0, cz = 0;
    _t.set(cx, TABLE_TOP, cz);
    _p.set(cx, TABLE_TOP + G.dist*1.25, cz + 0.001);
    camTgt.lerp(_t, 1-Math.pow(0.001, dt));
    camPos.lerp(_p, 1-Math.pow(0.004, dt));
    camera.position.copy(camPos); camera.lookAt(camTgt);
    return;
  }

  const targetX = cb.pocketed ? 0 : cb.x + dx*0.30;
  const targetZ = cb.pocketed ? 0 : cb.z + dz*0.30;
  _t.set(targetX, TABLE_TOP + R*0.5, targetZ);

  const cp = Math.cos(G.pitch), sp = Math.sin(G.pitch);
  const d = G.dist;
  _p.set(targetX - dx*d*cp, TABLE_TOP + R*0.5 + d*sp + 0.06, targetZ - dz*d*cp);

  const k = 1-Math.pow(0.0009, dt);
  camTgt.lerp(_t, k);
  camPos.lerp(_p, k);
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
}

const _q = new THREE.Quaternion();
const _ax = new THREE.Vector3();
const _cd = new THREE.Vector3();
const _lN = new THREE.Vector3(0,0,1);

function updateBalls(dt){
  for(const b of balls){
    if(b.pocketed){
      if(b.drop < 1){
        b.drop = Math.min(1, b.drop + dt*2.4);
        const h = HOLES[b.pocketIdx||0];
        b.mesh.position.x += (h.x-b.mesh.position.x)*Math.min(1,dt*6);
        b.mesh.position.z += (h.z-b.mesh.position.z)*Math.min(1,dt*6);
        b.mesh.position.y = R - b.drop*0.20;
        b.mesh.scale.setScalar(Math.max(0.001, 1-b.drop*0.55));
        if(b.drop>=1) b.mesh.visible=false;
      }
      continue;
    }
    const m=b.mesh;
    m.position.set(b.x, R, b.z);
    const sp = Math.hypot(b.vx,b.vz);
    if(sp > 0.002){
      _ax.set(-b.vz, 0, b.vx).normalize();
      _q.setFromAxisAngle(_ax, (sp*dt)/R);
      m.quaternion.premultiply(_q);
    }
    // 静止时号码转向相机，便于辨认
    const w = Math.max(0, Math.min(1, 1 - sp/0.45));
    if(w > 0.01){
      _cd.copy(camera.position).sub(m.position).normalize();
      _q.setFromUnitVectors(_lN, _cd);
      m.quaternion.slerp(_q, Math.min(1, dt*5*w));
    }
  }
}

function updateCue(dt){
  const cb = balls[0];
  const show = (G.state==='idle' || G.state==='charging') && !cb.pocketed && G.state!=='placing';
  cue.visible = show;
  if(!show) return;

  let pull = 0.055 + G.power*0.30;
  let ax=G.aim.x, az=G.aim.y;
  const ang = Math.atan2(az, ax);
  // 出杆动画
  if(cueAnim){
    cueAnim.t += dt;
    const th = Math.min(1, cueAnim.t/0.075);
    pull = 0.055 + cueAnim.p*0.30 - th*0.075;
    if(th>=1) cueAnim=null;
  }
  const side = G.english * 0.011;
  const tipX = cb.x + ax*(-pull) - az*side;
  const tipZ = cb.z + az*(-pull) + ax*side;
  const lift = 0.012 + (G.spin==='follow'?0.022:(G.spin==='draw'?-0.016:0));
  cue.position.set(tipX, TABLE_TOP+R+lift, tipZ);
  cue.rotation.set(0, 0, 0);
  cue.rotateY(-ang + Math.PI/2);
  cue.rotateX(-0.115);
}

function updateHalo(dt){
  const pi = (G.state==='idle') ? G.hitPocket : -1;
  halos.forEach((h,i)=>{
    const want = (i===pi) ? 0.55 : 0;
    const m = h.material;
    m.opacity += (want - m.opacity) * Math.min(1, dt*8);
    const s = 1 + (i===pi ? Math.sin(performance.now()/220)*0.06 : 0);
    h.scale.set(s,s,1);
  });
}

let acc = 0, last = performance.now();
function frame(){
  requestAnimationFrame(frame);
  const now = performance.now();
  let dt = (now-last)/1000; last = now;
  if(dt > 0.12) dt = 0.12;

  // 蓄力
  if(G.charging){
    G.power = Math.min(1, G.power + dt/1.15);
    el('fill').style.width = (G.power*100).toFixed(1)+'%';
  }

  // 物理
  if(G.state==='rolling'){
    acc += dt;
    let steps=0;
    while(acc >= DT && steps < 24){ physicsStep(DT); acc -= DT; steps++; }
    if(steps>=24) acc=0;
    if(allStopped()){ acc=0; settle(); }
  } else acc = 0;

  updateAim();
  updateBalls(dt);
  updateCue(dt);
  updateHalo(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
}

/* ============================================================
   启动
============================================================ */
reset();
updateCamera(1);
renderer.render(scene,camera);
frame();
setTimeout(()=>{ const b=el('boot'); b.style.opacity='0'; setTimeout(()=>b.remove(),420); }, 260);
setTimeout(()=>toast('玩家一 开球 — 按住左键蓄力，松开出杆', 2800), 900);

})();
</script>
