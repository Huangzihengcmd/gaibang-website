<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELESTINE · 机械天文腕表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#d8b45a; --gold-hi:#f3e3ae; --gold-dk:#8a6d2f;
  --ink:#e9dfc6; --ink-dim:#a99f87;
}
html,body{min-height:100%}
body{
  background:
    radial-gradient(1100px 760px at 50% 28%, #1c2133 0%, #0c101a 55%, #05070c 100%);
  color:var(--ink);
  font-family:"Didot","Bodoni MT","Playfair Display","Times New Roman",Georgia,serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(16px,3vh,30px);
  padding:clamp(14px,3vw,40px);
  overflow-x:hidden;
}
.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}

/* ---------- strap ---------- */
.watch{position:relative;width:min(86vmin,540px);aspect-ratio:1/1;flex:none}
.strap{
  position:absolute;left:50%;transform:translateX(-50%);width:46%;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, rgba(0,0,0,0) 2px 8px),
    linear-gradient(180deg,#3b2b1c 0%, #261b10 55%, #19110a 100%);
  border:1px solid rgba(216,180,90,.20);
  box-shadow:inset 0 0 26px rgba(0,0,0,.75);
  z-index:0;
}
.strap::before{ /* stitching */
  content:"";position:absolute;top:0;bottom:0;left:8%;width:2px;
  background:repeating-linear-gradient(180deg, rgba(216,180,90,.4) 0 6px, transparent 6px 12px);
}
.strap::after{
  content:"";position:absolute;top:0;bottom:0;right:8%;width:2px;
  background:repeating-linear-gradient(180deg, rgba(216,180,90,.4) 0 6px, transparent 6px 12px);
}
.strap-top{bottom:calc(100% - 54px);height:24vh;min-height:110px;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%)}
.strap-bottom{top:calc(100% - 54px);height:24vh;min-height:110px;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%)}

/* ---------- case ---------- */
.crown{
  position:absolute;right:-2.4%;top:50%;width:6%;aspect-ratio:.58;transform:translateY(-50%);
  border-radius:24%;
  background:repeating-linear-gradient(90deg,#caa84f 0 3px,#77591f 3px 6px);
  box-shadow:0 5px 12px rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.35);
  z-index:1;
}
.pusher{
  position:absolute;width:8%;height:3%;border-radius:999px;z-index:1;
  background:linear-gradient(180deg,#e6d194,#8a6d2f);
  box-shadow:0 3px 8px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.4);
}
.pusher-top{right:-1%;top:20%;transform:rotate(-33deg)}
.pusher-bottom{right:-1%;top:77%;transform:rotate(33deg)}
.case{
  position:absolute;inset:0;border-radius:50%;z-index:2;
  padding:2.8%;
  background:
    radial-gradient(circle at 33% 28%, rgba(255,255,255,.30), rgba(255,255,255,0) 44%),
    repeating-conic-gradient(from 0deg, #e9d49a 0deg 3deg, #9c7c33 3deg 6deg);
  box-shadow:
    0 34px 70px rgba(0,0,0,.68),
    0 6px 16px rgba(0,0,0,.5),
    inset 0 2px 3px rgba(255,255,255,.55),
    inset 0 -3px 7px rgba(0,0,0,.55);
}
.case-inner{
  width:100%;height:100%;border-radius:50%;
  background:linear-gradient(160deg,#2b3040 0%, #12151f 55%, #05070b 100%);
  box-shadow:
    inset 0 4px 12px rgba(0,0,0,.85),
    inset 0 -1px 2px rgba(255,255,255,.07),
    0 0 0 2px rgba(216,180,90,.35);
  padding:1.2%;
}
.case-inner svg{width:100%;height:100%;display:block}

/* ---------- crystal & shimmer ---------- */
.shimmer{
  position:absolute;inset:6%;border-radius:50%;pointer-events:none;z-index:4;opacity:.55;
  background:conic-gradient(from 0deg,
    transparent 0deg 40deg, rgba(130,160,255,.07) 72deg, transparent 120deg,
    transparent 195deg, rgba(255,222,150,.06) 232deg, transparent 280deg);
  animation:spin 90s linear infinite;
}
.crystal{
  position:absolute;inset:4%;border-radius:50%;pointer-events:none;z-index:5;
  background:
    radial-gradient(ellipse 58% 36% at 33% 22%, rgba(255,255,255,.13), rgba(255,255,255,.03) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(ellipse 42% 26% at 70% 84%, rgba(180,205,255,.05), rgba(180,205,255,0) 70%);
}
.crystal::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,
    rgba(255,255,255,0) 0deg, rgba(255,255,255,.05) 16deg, rgba(255,255,255,0) 38deg,
    rgba(255,255,255,0) 178deg, rgba(255,255,255,.035) 200deg, rgba(255,255,255,0) 226deg);
  animation:spin 34s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- dial typography ---------- */
.brand{fill:var(--gold-hi);font-family:inherit;font-size:21px;letter-spacing:6px;text-anchor:middle}
.brand2{fill:#8f8672;font-family:inherit;font-size:10.5px;letter-spacing:3.5px;text-anchor:middle}
.date-num{fill:#f2e8cf;font-family:inherit;font-size:27px;letter-spacing:1px;text-anchor:middle;font-variant-numeric:tabular-nums}

/* ---------- panel ---------- */
.panel{
  width:min(92vw,560px);display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(170deg,#161a24 0%, #0d1017 100%);
  border:1px solid rgba(216,180,90,.28);border-radius:16px;
  padding:clamp(16px,3vw,26px);
  box-shadow:0 18px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
}
.section{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid rgba(216,180,90,.18)}
.section:first-child{border-top:0;padding-top:0}
.section-label{
  font-size:11px;letter-spacing:.38em;color:var(--gold);text-transform:uppercase;font-weight:600;
  display:flex;align-items:baseline;gap:10px;
}
.section-label small{letter-spacing:.14em;color:var(--ink-dim);font-size:10px;font-weight:400}
.chrono-display{
  font-size:clamp(30px,6.4vw,42px);text-align:center;color:#f6ead0;font-weight:600;
  letter-spacing:.05em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 20px rgba(216,180,90,.22);
}
.chrono-meta{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:13px;color:var(--ink-dim);letter-spacing:.1em;font-variant-numeric:tabular-nums;
}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.pbtn{
  flex:1;min-width:72px;appearance:none;cursor:pointer;font-family:inherit;
  font-size:13px;letter-spacing:.3em;text-indent:.3em;color:var(--ink);
  background:linear-gradient(180deg,#242938,#12151f);
  border:1px solid rgba(216,180,90,.42);border-radius:10px;padding:10px 12px;
  box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .12s ease, box-shadow .12s ease, background .2s ease, color .2s ease;
}
.pbtn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1)}
.pbtn:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.pbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pbtn.active{background:linear-gradient(180deg,#ecd695,#b98f3e);color:#1a1408;border-color:#f0dda4}
.sun-readout{font-size:13px;letter-spacing:.14em;color:#cfc6ad;text-align:center;font-variant-numeric:tabular-nums}
.sun-readout b{color:var(--gold-hi);font-weight:600}
@media (max-width:430px){
  .btn-row{gap:7px}
  .pbtn{min-width:64px;padding:9px 8px;letter-spacing:.18em;text-indent:.18em}
}
@media (prefers-reduced-motion: reduce){
  .shimmer,.crystal::after{animation:none}
  .pbtn{transition:none}
  .pbtn:hover{transform:none}
}
html.reduced .shimmer, html.reduced .crystal::after{animation:none}
html.reduced .pbtn{transition:none}
</style>
</head>
<body>

<div class="strap strap-top" aria-hidden="true"></div>
<div class="strap strap-bottom" aria-hidden="true"></div>

<div class="watch">
  <div class="crown" aria-hidden="true"></div>
  <div class="pusher pusher-top" aria-hidden="true"></div>
  <div class="pusher pusher-bottom" aria-hidden="true"></div>
  <div class="case" aria-hidden="true">
    <div class="case-inner">
      <svg id="dial" viewBox="0 0 600 600" role="img"
        aria-label="机械天文腕表表盘：主表盘显示本地系统时间，秒针扫秒；12点位置月相小表盘，显示月龄与月相；9点位置昼夜小表盘，显示所选城市日出日落；6点位置计时码表秒针小表盘；3点位置三十分钟计时小表盘；4点半位置日期窗显示当前日期">
        <title>机械天文腕表表盘</title>
      </svg>
    </div>
  </div>
  <div class="shimmer" aria-hidden="true"></div>
  <div class="crystal" aria-hidden="true"></div>
</div>

<div class="panel" role="region" aria-label="腕表信息面板">
  <div class="section">
    <div class="section-label">计时码表 <small>Chronograph</small></div>
    <div class="chrono-display" id="chronoDisplay" aria-hidden="true">00:00.00</div>
    <div class="chrono-meta">
      <span id="lapInfo">计圈 —</span>
      <span id="lapCount">共 0 圈</span>
    </div>
    <div class="btn-row">
      <button class="pbtn" id="btnStart" aria-pressed="false" aria-label="开始或暂停计时">开始</button>
      <button class="pbtn" id="btnLap" aria-label="计一圈">计圈</button>
      <button class="pbtn" id="btnReset" aria-label="归零计时">归零</button>
    </div>
  </div>
  <div class="section">
    <div class="section-label">月相 <small>Moon Phase</small></div>
    <div class="sun-readout" id="moonInfo">—</div>
  </div>
  <div class="section">
    <div class="section-label">昼夜 · 日出日落 <small>Sunrise / Sunset</small></div>
    <div class="btn-row" id="cityRow" role="group" aria-label="选择城市"></div>
    <div class="sun-readout" id="sunInfo">—</div>
  </div>
</div>

<p class="sun-readout" style="margin-top:-8px;opacity:.55">月相按平均朔望月 29.5306 天计算 · 日出日落按太阳视位置逐时求解（含折射修正 −0.833°）</p>

<div class="sr-only" id="live" role="status" aria-live="polite"></div>

<script>
'use strict';
(function(){
const $=id=>document.getElementById(id);
const SVGNS='http://www.w3.org/2000/svg';
const D2R=Math.PI/180, TAU=Math.PI*2;
function el(n,attrs,parent){const e=document.createElementNS(SVGNS,n);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function pt(cx,cy,r,angDeg){return {x:cx+r*Math.sin(angDeg*D2R), y:cy-r*Math.cos(angDeg*D2R)};}

const dial=$('dial'), CX=300, CY=300;
const defs=el('defs',{},dial);
function linGrad(id,stops){const g=el('linearGradient',{id,x1:0,y1:0,x2:1,y2:0},defs);for(const s of stops)el('stop',{offset:s[0],'stop-color':s[1]},g);}
function radGrad(id,stops,cy){const g=el('radialGradient',{id,cx:'50%',cy:cy||'42%',r:'68%'},defs);for(const s of stops)el('stop',{offset:s[0],'stop-color':s[1]},g);}
radGrad('dialBg',[[0,'#1a1f2e'],[.55,'#0e111b'],[1,'#060810']]);
radGrad('subBg',[[0,'#131624'],[.7,'#0b0e17'],[1,'#05070d']],'40%');
radGrad('skyGrad',[[0,'#28427f'],[.55,'#16254f'],[1,'#080d22']]);
radGrad('moonGrad',[[0,'#f8f6ef'],[.75,'#dcd7c7'],[1,'#a9a291']],'38%');
linGrad('goldHand',[[0,'#f7e8b2'],[.5,'#d8b45a'],[1,'#9a7a33']]);
linGrad('steelHand',[[0,'#a3c4e9'],[.5,'#4a7fb5'],[1,'#26496f']]);
const shf=el('filter',{id:'subShadow',x:'-40%',y:'-40%',width:'180%',height:'180%'},defs);
el('feDropShadow',{dx:0,dy:2.5,stdDeviation:3.2,'flood-color':'#000','flood-opacity':.6},shf);
const shf2=el('filter',{id:'handShadow',x:'-40%',y:'-40%',width:'180%',height:'180%'},defs);
el('feDropShadow',{dx:0,dy:2,stdDeviation:2.2,'flood-color':'#000','flood-opacity':.5},shf2);

/* ===== 主表盘 ===== */
el('circle',{cx:CX,cy:CY,r:292,fill:'url(#dialBg)'},dial);
el('circle',{cx:CX,cy:CY,r:292,fill:'none',stroke:'rgba(216,180,90,.8)','stroke-width':2.4},dial);
el('circle',{cx:CX,cy:CY,r:286,fill:'none',stroke:'rgba(0,0,0,.6)','stroke-width':1.5},dial);
for(let i=0;i<60;i++){
  const a=i*6, big=i%5===0;
  const p1=pt(CX,CY,283,a), p2=pt(CX,CY,big?270:277,a);
  el('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:big?'rgba(222,192,110,.95)':'rgba(170,150,95,.55)','stroke-width':big?2.4:1},dial);
}
const ROM={1:'I',2:'II',4:'IV',5:'V',7:'VII',8:'VIII',10:'X',11:'XI'};
for(const n in ROM){
  const p=pt(CX,CY,240,+n*30);
  el('text',{x:p.x,y:p.y,fill:'#e9d69b','font-size':27,'text-anchor':'middle','dominant-baseline':'central','font-family':'Didot, "Times New Roman", serif','letter-spacing':1},dial).textContent=ROM[n];
}
el('text',{x:CX,y:224,class:'brand'},dial).textContent='CELESTINE';
el('text',{x:CX,y:242,class:'brand2'},dial).textContent='A S T R O N O M I Q U E';
el('text',{x:CX,y:394,fill:'#8f8672','font-size':9.5,'text-anchor':'middle','letter-spacing':2.5},dial).textContent='CAL. A-29.53 · GENÈVE';

/* ===== 12点 月相 ===== */
const MX=300, MY=148;
const clip=el('clipPath',{id:'moonClip'},defs);
el('circle',{cx:MX,cy:MY,r:45},clip);
el('circle',{cx:MX,cy:MY,r:46,fill:'url(#subBg)','filter':'url(#subShadow)'},dial);
const sky=el('g',{'clip-path':'url(#moonClip)'},dial);
const moonRot=el('g',{},sky);
el('circle',{cx:MX,cy:MY,r:45,fill:'url(#skyGrad)'},moonRot);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(29530);
el('path',{d:`M ${MX-45} ${MY} A 45 45 0 0 0 ${MX+45} ${MY} Z`,fill:'#04060d'},sky);
el('circle',{cx:MX,cy:MY,r:45,fill:'none',stroke:'rgba(216,180,90,.75)','stroke-width':1.6},dial);
const moonAgeTxt=el('text',{x:CX,y:207,fill:'#b9ad8d','font-size':10.5,'text-anchor':'middle','letter-spacing':1.5},dial);

/* ===== 9点 昼夜 ===== */
const SX=150, SY=300;
el('circle',{cx:SX,cy:SY,r:48,fill:'url(#subBg)','filter':'url(#subShadow)'},dial);
for(let i=0;i<24;i++){
  const a=i*15, big=i%6===0;
  const p1=pt(SX,SY,44,a), p2=pt(SX,SY,big?37:40,a);
  el('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:big?'rgba(222,192,110,.8)':'rgba(150,140,110,.4)','stroke-width':big?1.6:1},dial);
}
const SUNLAB={0:'0',6:'6',12:'12',18:'18'};
for(const h in SUNLAB){
  const p=pt(SX,SY,31,(180-(+h)*15)%360);
  el('text',{x:p.x,y:p.y,fill:'#9a917c','font-size':8.5,'text-anchor':'middle','dominant-baseline':'central'},dial).textContent=SUNLAB[h];
}
const dayArc=el('path',{fill:'none',stroke:'#d8b45a','stroke-width':3.4,'stroke-linecap':'round'},dial);
const nightArc=el('path',{fill:'none',stroke:'#26344f','stroke-width':3.4,'stroke-linecap':'round'},dial);
function sunGlyph(g){el('circle',{cx:0,cy:0,r:3,fill:'#f3c95f'},g);for(let i=0;i<8;i++){const a=i*45*D2R;el('line',{x1:Math.cos(a)*4.4,y1:Math.sin(a)*4.4,x2:Math.cos(a)*6.4,y2:Math.sin(a)*6.4,stroke:'#f3c95f','stroke-width':1.1},g);}}
const riseG=el('g',{},dial), setG=el('g',{},dial);
sunGlyph(riseG); sunGlyph(setG);
const sunHand=el('g',{},dial);
el('line',{x1:0,y1:5,x2:0,y2:-31,stroke:'#d8b45a','stroke-width':1.5},sunHand);
const sunTip=el('circle',{cx:0,cy:-31,r:2.6,fill:'#f3c95f'},sunHand);
el('circle',{cx:SX,cy:SY,r:1.8,fill:'#d8b45a'},dial);
el('circle',{cx:SX,cy:SY,r:48,fill:'none',stroke:'rgba(216,180,90,.75)','stroke-width':1.6},dial);

/* ===== 3点 30分钟计时 ===== */
const M3X=450, M3Y=300;
el('circle',{cx:M3X,cy:M3Y,r:48,fill:'url(#subBg)','filter':'url(#subShadow)'},dial);
for(let i=0;i<30;i++){
  const a=i*12, big=i%5===0;
  const p1=pt(M3X,M3Y,44,a), p2=pt(M3X,M3Y,big?37:40,a);
  el('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:big?'rgba(222,192,110,.8)':'rgba(150,140,110,.4)','stroke-width':big?1.6:1},dial);
}
['5','10','15','20','25','30'].forEach((t,i)=>{
  const p=pt(M3X,M3Y,31,i*60);
  el('text',{x:p.x,y:p.y,fill:'#9a917c','font-size':8.5,'text-anchor':'middle','dominant-baseline':'central'},dial).textContent=t;
});
el('circle',{cx:M3X,cy:M3Y,r:48,fill:'none',stroke:'rgba(216,180,90,.75)','stroke-width':1.6},dial);

/* ===== 6点 小秒针 ===== */
const SMX=300, SMY=452;
el('circle',{cx:SMX,cy:SMY,r:46,fill:'url(#subBg)','filter':'url(#subShadow)'},dial);
for(let i=0;i<60;i++){
  const a=i*6, big=i%5===0;
  const p1=pt(SMX,SMY,42,a), p2=pt(SMX,SMY,big?36:39,a);
  el('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:big?'rgba(222,192,110,.8)':'rgba(150,140,110,.4)','stroke-width':big?1.5:1},dial);
}
el('circle',{cx:SMX,cy:SMY,r:46,fill:'none',stroke:'rgba(216,180,90,.75)','stroke-width':1.6},dial);

/* ===== 4点半 日期窗 ===== */
const DW={x:388,y:388,w:54,h:38};
el('rect',{x:DW.x-4,y:DW.y-4,width:DW.w+8,height:DW.h+8,rx:5,fill:'#05060a',stroke:'rgba(216,180,90,.7)','stroke-width':1.4,'filter':'url(#subShadow)'},dial);
el('rect',{x:DW.x,y:DW.y,width:DW.w,height:DW.h,rx:3,fill:'#10141f'},dial);
const dateNum=el('text',{x:DW.x+DW.w/2,y:DW.y+DW.h/2+1,class:'date-num','dominant-baseline':'central'},dial);

/* ===== 主指针（位于子盘之上，如真实天文机芯叠层）===== */
const gMin=el('g',{'filter':'url(#handShadow)'},dial), gHr=el('g',{'filter':'url(#handShadow)'},dial), gSec=el('g',{'filter':'url(#handShadow)'},dial);
el('path',{d:'M -3.4 10 L -3.4 -188 L 0 -216 L 3.4 -188 L 3.4 10 Z',fill:'url(#goldHand)',stroke:'#6f5623','stroke-width':.8},gMin);
el('path',{d:'M -3.2 10 L -3.2 -132 L 0 -162 L 3.2 -132 L 3.2 10 Z',fill:'url(#goldHand)',stroke:'#6f5623','stroke-width':.8},gHr);
el('line',{x1:0,y1:32,x2:0,y2:-236,stroke:'#3f76ad','stroke-width':1.8},gSec);
el('circle',{cx:0,cy:14,r:7,fill:'#3f76ad',stroke:'#2a537d','stroke-width':1},gSec);
el('circle',{cx:CX,cy:CY,r:4.6,fill:'url(#goldHand)',stroke:'#5d4718','stroke-width':1},dial);
el('circle',{cx:CX,cy:CY,r:1.8,fill:'#2b2413'},dial);

/* ===== 计时指针（6点小秒针 + 3点30分针）===== */
const chSm=el('g',{},dial);
el('line',{x1:0,y1:8,x2:0,y2:-37,stroke:'#c94f3f','stroke-width':1.8},chSm);
el('circle',{cx:0,cy:5,r:4,fill:'#c94f3f',stroke:'#7e2f24','stroke-width':.8},chSm);
el('circle',{cx:SMX,cy:SMY,r:2,fill:'#c94f3f'},dial);
const chM3=el('g',{},dial);
el('line',{x1:0,y1:6,x2:0,y2:-35,stroke:'url(#steelHand)','stroke-width':1.6},chM3);
el('circle',{cx:M3X,cy:M3Y,r:1.8,fill:'#4a7fb5'},dial);

/* ===== 月相重绘：星空背景 + 相位圆盘 ===== */
while(sky.firstChild)sky.removeChild(sky.firstChild);
for(let i=0;i<18;i++){
  const r=8+34*Math.sqrt(rnd()), a=rnd()*360, p=pt(MX,MY,r,a);
  el('circle',{cx:p.x,cy:p.y,r:.5+rnd()*1,fill:'#d5defc',opacity:.35+rnd()*.55},sky);
}
const phaseG=el('g',{},sky);
el('circle',{cx:MX,cy:MY,r:38,fill:'#0a0d16'},phaseG);
const phasePathEl=el('path',{fill:'#ece8db'},phaseG);
const craterSpots=[[-9,-10,5.2],[6,-16,3.6],[10,4,4.4],[-4,9,3],[12,-4,2.2],[-14,2,2.6],[2,-27,2.8],[15,14,2]];
for(const [dx,dy,cr] of craterSpots){
  el('circle',{cx:MX+dx,cy:MY+dy,r:cr,fill:'rgba(60,58,48,.22)'},phaseG);
}
el('circle',{cx:MX,cy:MY,r:38,fill:'none',stroke:'rgba(0,0,0,.55)','stroke-width':1.2},phaseG);
function phaseD(age){
  const T=29.530588853, p=((age%T)+T)%T;
  const phi=TAU*p/T, c=Math.cos(phi), waxing=p<T/2;
  const rim=waxing?1:0, rx=Math.max(.4,38*Math.abs(c));
  const ts=waxing?(c>0?0:1):(c>0?1:0);
  return `M ${MX} ${MY-38} A 38 38 0 0 ${rim} ${MX} ${MY+38} A ${rx} 38 0 0 ${ts} ${MX} ${MY-38} Z`;
}

/* ===== 天文算法 ===== */
const SYN=29.530588853, NEWMOON_JD=2451550.26;
const MOON_NAMES=[[1,'新月'],[6.4,'娥眉月'],[8.4,'上弦月'],[13.8,'盈凸月'],[15.8,'满月'],[21.2,'亏凸月'],[23.2,'下弦月'],[Infinity,'残月']];
function moonAge(nowMs){
  const jd=nowMs/86400000+2440587.5;
  return ((jd-NEWMOON_JD)%SYN+SYN)%SYN;
}
function moonName(age){for(const [t,nm] of MOON_NAMES)if(age<t)return nm;}

/* 太阳时角解析法：低精度太阳位置 + 格林尼治平恒星时 */
function sunTimes(cityDate, lat, lon){
  const JD0=Date.UTC(cityDate.getFullYear(),cityDate.getMonth(),cityDate.getDate())/86400000+2440587.5;
  const n0=JD0-2451545.0;
  const GMST0=((280.46061837+360.98564736629*n0)%360+360)%360;
  function sunPos(n){
    const L0=(280.460+0.9856474*n)%360;
    const M=(357.528+0.9853018*n)%360;
    const C=(1.914-0.0048*Math.sin(M*D2R))*Math.sin(M*D2R)+0.0171*Math.sin(2*M*D2R);
    const lam=(L0+C+360)%360;
    const eps=23.439-0.0000004*n;
    const dec=Math.asin(Math.sin(eps*D2R)*Math.sin(lam*D2R));
    const a=Math.atan2(Math.cos(eps*D2R)*Math.sin(lam*D2R),Math.cos(lam*D2R))/D2R;
    return {a:((a%360)+360)%360, dec};
  }
  let s=sunPos(n0);
  let tnoon=((s.a-lon-GMST0)%360+360)%360/360.98564736629*24;
  s=sunPos(n0+tnoon/24);
  tnoon=((s.a-lon-GMST0)%360+360)%360/360.98564736629*24;
  const cosH=(Math.sin(-0.833*D2R)-Math.sin(s.dec)*Math.sin(lat*D2R))/(Math.cos(s.dec)*Math.cos(lat*D2R));
  if(cosH<-1)return {state:'midnight'};
  if(cosH>1)return {state:'polar'};
  const H=Math.acos(cosH)/D2R;
  const t0=Date.UTC(cityDate.getFullYear(),cityDate.getMonth(),cityDate.getDate()); /* 当地日 0 点 UTC 毫秒 */
  return {state:'ok', riseUtc:t0+(tnoon-H/15)*3600000, setUtc:t0+(tnoon+H/15)*3600000};
}
function hhmm(h){
  h=((h%24)+24)%24;
  const H=Math.floor(h), M=Math.floor((h-H)*60);
  return `${String(H).padStart(2,'0')}:${String(M).padStart(2,'0')}`;
}
function localWall(tz,utcMs){return (utcMs/3600000+tzOffset(tz,utcMs))%24;}
function tzHhmm(tz,utcMs){return hhmm(localWall(tz,utcMs));}

/* 某 UTC 时刻的 IANA 时区偏移（小时，自动含夏令时）；30 分钟桶缓存，避免每帧重建 Intl */
let _tzc={k:'',v:0};
function tzOffset(tz,ms){
  const k=tz+':'+Math.floor(ms/1800000);
  if(_tzc.k===k)return _tzc.v;
  let v=0;
  try{
    const loc=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms));
    const P={};for(const p of loc)P[p.type]=p.value;
    v=(Date.UTC(+P.year,+P.month-1,+P.day,+P.hour%24,+P.minute,+P.second)-ms)/3600000;
  }catch(e){}
  _tzc={k,v};
  return v;
}

/* ===== 城市 ===== */
const CITIES=[
  {name:'北京',lat:39.90,lon:116.41,tz:'Asia/Shanghai'},
  {name:'东京',lat:35.68,lon:139.69,tz:'Asia/Tokyo'},
  {name:'伦敦',lat:51.51,lon:-0.13,tz:'Europe/London'},
  {name:'纽约',lat:40.71,lon:-74.01,tz:'America/New_York'},
];
let cityIdx=0, sunCache={key:'',res:null};
const cityRow=$('cityRow');
CITIES.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='pbtn'+(i===0?' active':'');
  b.textContent=c.name;
  b.setAttribute('aria-pressed',i===0?'true':'false');
  b.addEventListener('click',()=>{
    if(cityIdx===i)return;
    cityIdx=i;
    [...cityRow.children].forEach((el2,j)=>{el2.classList.toggle('active',j===i);el2.setAttribute('aria-pressed',j===i?'true':'false');});
    sunCache.key='';
    announce();
  });
  cityRow.appendChild(b);
});
function cityLocalDate(nowMs){
  const tz=CITIES[cityIdx].tz;
  const p={};
  for(const x of new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(nowMs)))p[x.type]=x.value;
  return new Date(+p.year,+p.month-1,+p.day);
}
function getSun(nowMs){
  const c=CITIES[cityIdx];
  const key=c.lat+','+c.lon+','+cityLocalDate(nowMs).toDateString();
  if(sunCache.key!==key){
    sunCache.key=key;
    sunCache.res=sunTimes(cityLocalDate(nowMs),c.lat,c.lon);
  }
  return sunCache.res;
}

/* ===== 计时码表 ===== */
let chRunning=false, chBase=0, chStamp=0, chLaps=[];
function chElapsed(now){return chRunning?chBase+(now-chStamp):chBase;}
const btnStart=$('btnStart'), btnLap=$('btnLap'), btnReset=$('btnReset');
btnStart.addEventListener('click',()=>{
  const now=performance.now();
  if(chRunning){chBase+=now-chStamp;chRunning=false;}
  else{chStamp=now;chRunning=true;}
  btnStart.textContent=chRunning?'暂停':'继续';
  btnStart.setAttribute('aria-pressed',String(chRunning));
  announce();
});
btnLap.addEventListener('click',()=>{
  if(!chRunning&&chBase<=0)return;
  const e=chElapsed(performance.now());
  chLaps.push({t:e,d:e-(chLaps.length?chLaps[chLaps.length-1].t:0)});
  updateLapInfo();
});
btnReset.addEventListener('click',()=>{
  chBase=0;chLaps=[];
  if(chRunning)chStamp=performance.now();
  updateLapInfo();
  $('chronoDisplay').textContent='00:00.00';
});
function updateLapInfo(){
  const L=chLaps[chLaps.length-1];
  $('lapInfo').textContent=L?`第 ${chLaps.length} 圈 ${fmtCh(L.t)}（本圈 ${fmtCh(L.d)}）`:'计圈 —';
  $('lapCount').textContent=`共 ${chLaps.length} 圈`;
}
function fmtCh(ms){
  ms=Math.max(0,ms);
  const mm=Math.floor(ms/60000), ss=Math.floor(ms/1000)%60, cs=Math.floor(ms/10)%100;
  return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

/* ===== 昼夜弧线与标记 ===== */
function sunArcD(aFrom,aTo){
  const p1=pt(SX,SY,41,aFrom), p2=pt(SX,SY,41,aTo);
  const span=((aTo-aFrom)%360+360)%360;
  return `M ${p1.x} ${p1.y} A 41 41 0 ${span>180?1:0} 1 ${p2.x} ${p2.y}`;
}
function drawSunDial(res,nowMs){
  if(res.state==='ok'){
    const aR=180-localWall(CITIES[cityIdx].tz,res.riseUtc)*15,
          aS=180-localWall(CITIES[cityIdx].tz,res.setUtc)*15;
    dayArc.setAttribute('d',sunArcD(aS,aR));
    nightArc.setAttribute('d',sunArcD(aR,aS+360));
    dayArc.style.display=nightArc.style.display='';
    const rp=pt(SX,SY,44,aR), sp=pt(SX,SY,44,aS);
    riseG.setAttribute('transform',`translate(${rp.x} ${rp.y})`);
    setG.setAttribute('transform',`translate(${sp.x} ${sp.y})`);
    riseG.style.display=setG.style.display='';
  }else{
    dayArc.setAttribute('d',res.state==='midnight'
      ?sunArcD(0,359.99):'');
    nightArc.setAttribute('d',res.state==='polar'
      ?sunArcD(0,359.99):'');
    dayArc.style.display=res.state==='midnight'?'':'none';
    nightArc.style.display=res.state==='polar'?'':'none';
    riseG.style.display=setG.style.display='none';
  }
}
function sunInfoText(res,cd,nowMs){
  const c=CITIES[cityIdx];
  const ds=`${cd.getMonth()+1}/${cd.getDate()}`;
  if(res.state==='midnight')return `${c.name} ${ds} · <b>极昼</b>（太阳不落）`;
  if(res.state==='polar')return `${c.name} ${ds} · <b>极夜</b>（太阳不出）`;
  const lenH=res.setUtc-res.riseUtc, LH=Math.floor(lenH/3600000), LM=Math.round((lenH%3600000)/60000);
  return `${c.name} ${ds}（当地） · 日出 <b>${tzHhmm(c.tz,res.riseUtc)}</b> · 日落 <b>${tzHhmm(c.tz,res.setUtc)}</b> · 昼长 ${LH}时${String(LM).padStart(2,'0')}分`;
}

/* ===== ARIA 播报 ===== */
let lastAnnounce=0;
function announce(force){
  const now=Date.now();
  if(!force&&now-lastAnnounce<1000)return;
  lastAnnounce=now;
  const d=new Date(now);
  const res=getSun(now);
  const cd=cityLocalDate(now);
  const age=moonAge(now);
  const ct=hhmm(localWall(CITIES[cityIdx].tz,now));
  let sunTxt;
  if(res.state==='midnight')sunTxt='当地极昼';
  else if(res.state==='polar')sunTxt='当地极夜';
  else sunTxt=`日出${tzHhmm(CITIES[cityIdx].tz,res.riseUtc)} 日落${tzHhmm(CITIES[cityIdx].tz,res.setUtc)}`;
  $('live').textContent=
    `时间 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}。`+
    `${CITIES[cityIdx].name}当地 ${ct}，${sunTxt}。月相 ${moonName(age)}，月龄 ${age.toFixed(1)} 日。`+
    (chRunning?`计时 ${fmtCh(chElapsed(performance.now()))}。`:'');
}

/* ===== 主循环：requestAnimationFrame，时间恒取自系统时钟 ===== */
const mq=matchMedia('(prefers-reduced-motion: reduce)');
let reduced=mq.matches;
document.documentElement.classList.toggle('reduced',reduced);
mq.addEventListener?.('change',e=>{reduced=e.matches;document.documentElement.classList.toggle('reduced',reduced);});

let lastDay=-1, lastMoonTxt='', lastSunRes=null;
function frame(){
  const now=Date.now();
  const d=new Date(now);

  /* 主指针（每帧由 Date.now 推导，永不漂移；后台标签页唤醒后立即正确） */
  const s=reduced?d.getSeconds():d.getSeconds()+d.getMilliseconds()/1000;
  const m=d.getMinutes()+s/60;
  const h=(d.getHours()%12)+m/60;
  gSec.setAttribute('transform',`translate(${CX} ${CY}) rotate(${s*6})`);
  gMin.setAttribute('transform',`translate(${CX} ${CY}) rotate(${m*6})`);
  gHr.setAttribute('transform',`translate(${CX} ${CY}) rotate(${h*30})`);

  /* 计时码表 */
  const e=chElapsed(performance.now());
  chSm.setAttribute('transform',`translate(${SMX} ${SMY}) rotate(${reduced?Math.floor(e/1000)%60*6:(e%60000)/60000*360})`);
  chM3.setAttribute('transform',`translate(${M3X} ${M3Y}) rotate(${(e%1800000)/1800000*360})`);
  const cs=fmtCh(e);
  if($('chronoDisplay').textContent!==cs)$('chronoDisplay').textContent=cs;

  /* 月相（连续变化） */
  const age=moonAge(now);
  phasePathEl.setAttribute('d',phaseD(age));
  const mt=`月龄 ${age.toFixed(1)} 日`;
  if(mt!==lastMoonTxt){
    lastMoonTxt=mt;
    moonAgeTxt.textContent=mt;
    const f=(1-Math.cos(TAU*age/SYN))/2;
    $('moonInfo').textContent=`${moonName(age)} · 月龄 ${age.toFixed(1)} 日 · 照亮 ${(f*100).toFixed(0)}%`;
  }

  /* 日期窗（大小月 / 闰年由 Date 对象精确处理，此处仅检测换日） */
  if(d.getDate()!==lastDay){
    lastDay=d.getDate();
    dateNum.textContent=String(d.getDate());
  }

  /* 昼夜小表盘：当地时刻 + 日出日落弧（仅当地日期/城市变化时重算弧线） */
  sunHand.setAttribute('transform',`translate(${SX} ${SY}) rotate(${180-localWall(CITIES[cityIdx].tz,now)*15})`);
  const res=getSun(now);
  if(res!==lastSunRes){
    lastSunRes=res;
    drawSunDial(res,now);
    $('sunInfo').innerHTML=sunInfoText(res,cityLocalDate(now),now);
  }

  announce();
  requestAnimationFrame(frame);
}
const bootNow=Date.now();
lastSunRes=getSun(bootNow);
drawSunDial(lastSunRes,bootNow);
$('sunInfo').innerHTML=sunInfoText(lastSunRes,cityLocalDate(bootNow),bootNow);
updateLapInfo();
requestAnimationFrame(frame);
})();
</script>
