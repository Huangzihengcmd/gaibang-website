<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清明賽博上河圖 · Cyber Qingming Scroll</title>
<style>
/* ============================================================
   清明賽博上河圖 —— 单文件动态长卷
   滚动：#track 双份场景无缝循环（右→左）
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#03010c;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;cursor:crosshair}
#viewport{position:fixed;inset:0;background:#03010c}
#scroll{width:100%;height:100%;display:block}

/* ---------- 画卷滚动 ---------- */
#track{animation:scroll 170s linear infinite}
#track.paused{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-7200px)}}

/* ---------- 霓虹闪烁（4种错拍，避免整齐划一） ---------- */
@keyframes flick1{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.3}44%{opacity:1}
  63%{opacity:1}64%{opacity:.45}66%{opacity:1}91%{opacity:.7}93%{opacity:1}}
@keyframes flick2{0%,48%,52%,100%{opacity:1}50%{opacity:.25}77%{opacity:.85}79%{opacity:1}}
@keyframes flick3{0%,30%,34%,70%,74%,100%{opacity:1}32%{opacity:.4}72%{opacity:.2}}
@keyframes flick4{0%,100%{opacity:.92}25%{opacity:.5}26%{opacity:1}55%{opacity:.6}57%{opacity:1}}
.flick1{animation:flick1 4.7s linear infinite}
.flick2{animation:flick2 3.9s linear infinite}
.flick3{animation:flick3 5.6s linear infinite}
.flick4{animation:flick4 6.8s linear infinite}

/* ---------- 通用动效 ---------- */
@keyframes blink{0%,55%,100%{opacity:1}15%,35%{opacity:.12}}
.blink{animation:blink 2.2s linear infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5.5deg)}}
.sway{transform-box:fill-box;transform-origin:50% 0%;animation:sway 3.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.bob{animation:bob .55s ease-in-out infinite}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:0}18%{opacity:.55}
  100%{transform:translateY(-78px) scale(1.5);opacity:0}}
.steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 3.6s ease-out infinite}
@keyframes rainFall{from{transform:translateY(-160px)}to{transform:translateY(1180px)}}
.rain{animation:rainFall linear infinite}
@keyframes petalFall{0%{transform:translate(0,0) rotate(0);opacity:.95}
  100%{transform:translate(-80px,150px) rotate(260deg);opacity:0}}
.petal{transform-box:fill-box;transform-origin:center;animation:petalFall linear infinite}
@keyframes twinkle{0%,100%{opacity:.85}50%{opacity:.15}}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes cloudDrift{0%,100%{transform:translateX(-60px)}50%{transform:translateX(60px)}}
.cloud{animation:cloudDrift 46s ease-in-out infinite}
@keyframes dashFlow{to{stroke-dashoffset:-240}}
.flowline{stroke-dasharray:46 74;animation:dashFlow 7s linear infinite}
@keyframes rotorSpin{to{transform:rotate(360deg)}}
.rotor{transform-box:fill-box;transform-origin:center;animation:rotorSpin .28s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.spinSlow{transform-box:fill-box;transform-origin:center;animation:spinSlow 26s linear infinite}
@keyframes hScan{0%{transform:translateY(0);opacity:.75}
  50%{opacity:1}100%{transform:translateY(var(--sd,392px));opacity:.15}}
.hscan{animation:hScan 3.2s ease-in-out infinite}
@keyframes holoFlick{0%,100%{opacity:.92}18%{opacity:.7}20%{opacity:.95}
  47%{opacity:.8}49%{opacity:1}78%{opacity:.65}80%{opacity:.92}}
.holo{animation:holoFlick 2.8s linear infinite}
@keyframes figFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.figfloat{animation:figFloat 4.6s ease-in-out infinite}
@keyframes ribbon{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.ribbon{transform-box:fill-box;transform-origin:50% 0%;animation:ribbon 3s ease-in-out infinite}
@keyframes fishSwim{0%,100%{transform:translateX(-34px) rotate(-3deg)}
  50%{transform:translateX(34px) rotate(3deg)}}
.fishswim{animation:fishSwim 6s ease-in-out infinite}
@keyframes boatBob{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-6px) rotate(.7deg)}}
.boatbob{transform-box:fill-box;transform-origin:center;animation:boatBob 5.5s ease-in-out infinite}
@keyframes waterReflect{0%,100%{opacity:.10}50%{opacity:.22}}
.reflect{animation:waterReflect 3.8s ease-in-out infinite}
@keyframes pulseRing{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pulsering{transform-box:fill-box;transform-origin:center;animation:pulseRing 3.4s ease-in-out infinite}
@keyframes moonGlow{0%,100%{opacity:.55}50%{opacity:.9}}
.moonglow{animation:moonGlow 6s ease-in-out infinite}

/* ---------- 行人 / 飞行车 巡航 ---------- */
@keyframes moveL{from{transform:translateX(var(--d,1560px))}to{transform:translateX(calc(var(--d,1560px) * -1))}}
@keyframes moveR{from{transform:translateX(calc(var(--d,1560px) * -1))}to{transform:translateX(var(--d,1560px))}}
.moveL{animation:moveL linear infinite}
.moveR{animation:moveR linear infinite}
@keyframes legA{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
@keyframes legB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
.leg{transform-box:fill-box;transform-origin:50% 0%}
.legA{animation:legA .55s ease-in-out infinite}
.legB{animation:legB .55s ease-in-out infinite}
@keyframes armA{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes armB{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
.arm{transform-box:fill-box;transform-origin:50% 0%}
.armA{animation:armA .55s ease-in-out infinite}
.armB{animation:armB .55s ease-in-out infinite}

.shop{cursor:pointer}
.shop:hover .shop-body{filter:brightness(1.3)}

/* ---------- CRT / 暗角 覆盖层 ---------- */
.crt{position:absolute;inset:0;pointer-events:none;z-index:8;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.scanbeam{position:absolute;left:0;right:0;height:140px;z-index:8;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(61,240,255,.06),transparent);
  animation:beamMove 7s linear infinite}
@keyframes beamMove{from{top:-160px}to{top:110%}}
.vignette{position:absolute;inset:0;z-index:7;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(2,0,12,.55) 100%)}

/* ---------- HUD ---------- */
.hud{position:absolute;z-index:10;color:#9ff6ff;pointer-events:none;
  text-shadow:0 0 8px rgba(61,240,255,.8);user-select:none}
.hud-box{background:rgba(6,2,24,.72);border:1px solid rgba(61,240,255,.55);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  box-shadow:0 0 18px rgba(61,240,255,.18) inset,0 0 14px rgba(61,240,255,.15)}
#title{top:18px;left:20px;padding:10px 18px}
#title h1{font-size:22px;letter-spacing:6px;color:#d8fbff;font-weight:800}
#title h1 .alt{color:#ff3ddb;text-shadow:0 0 10px rgba(255,61,219,.8)}
#title p{font-size:11px;letter-spacing:3px;margin-top:4px;color:#67d9e8}
#hint{left:20px;bottom:18px;padding:8px 14px;font-size:12px;letter-spacing:2px;color:#8fe9f5}
#hint b{color:#ffe04d;text-shadow:0 0 8px rgba(255,224,77,.8)}
#counter{right:20px;bottom:18px;padding:8px 14px;font-size:12px;letter-spacing:2px;text-align:right}
#counter b{color:#4dffa6;font-size:15px;text-shadow:0 0 8px rgba(77,255,166,.8)}
#btnPause{position:absolute;top:18px;right:20px;z-index:11;pointer-events:auto;cursor:pointer;
  background:rgba(6,2,24,.78);color:#9ff6ff;border:1px solid rgba(255,61,219,.6);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  padding:9px 18px;font-size:13px;letter-spacing:3px;font-family:inherit;
  text-shadow:0 0 8px rgba(255,61,219,.8);box-shadow:0 0 14px rgba(255,61,219,.2)}
#btnPause:hover{background:rgba(40,6,48,.85)}

/* ---------- 悬停情报卡 ---------- */
#card{position:fixed;z-index:20;width:268px;pointer-events:none;opacity:0;
  transform:translateY(8px);transition:opacity .16s,transform .16s;
  background:rgba(7,2,22,.94);border:1px solid var(--cc,#3df0ff);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  box-shadow:0 0 22px var(--cc,#3df0ff),0 0 4px var(--cc,#3df0ff) inset;padding:13px 15px 12px;color:#dffcff}
#card.show{opacity:1;transform:translateY(0)}
#card::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cc,#3df0ff),transparent);
  animation:cardScan 1.6s linear infinite}
@keyframes cardScan{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
#card .c-name{font-size:17px;font-weight:800;letter-spacing:2px;color:#fff;
  text-shadow:0 0 10px var(--cc,#3df0ff)}
#card .c-id{font-size:10px;letter-spacing:2px;color:#7fb9c4;margin-top:2px}
#card .c-tag{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:1px;
  border:1px solid var(--cc,#3df0ff);padding:2px 8px;color:var(--cc,#3df0ff)}
#card .c-rate{margin-top:9px;font-size:12px;display:flex;justify-content:space-between;
  letter-spacing:1px;color:#bfeef5}
#card .c-rate b{color:var(--cc,#3df0ff)}
#card .bar{height:5px;background:rgba(255,255,255,.1);margin-top:4px;position:relative;overflow:hidden}
#card .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cc,#3df0ff);
  box-shadow:0 0 8px var(--cc,#3df0ff)}
#card .c-blurb{margin-top:9px;font-size:11.5px;line-height:1.65;color:#a9d7df;
  border-top:1px dashed rgba(159,246,255,.25);padding-top:7px}
#card .c-foot{margin-top:8px;font-size:10px;letter-spacing:2px;color:#6f9aa3;
  display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="viewport">
  <svg id="scroll" viewBox="0 0 14400 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#04010f"/>
        <stop offset=".42" stop-color="#0d0438"/>
        <stop offset=".78" stop-color="#230a52"/>
        <stop offset="1" stop-color="#3a0f5e"/>
      </linearGradient>
      <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#120733"/>
        <stop offset=".45" stop-color="#0a1a48"/>
        <stop offset="1" stop-color="#030416"/>
      </linearGradient>
      <radialGradient id="moonGrad" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fdf3ff"/>
        <stop offset=".7" stop-color="#d9b8ff"/>
        <stop offset="1" stop-color="#8a5cff"/>
      </radialGradient>
      <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3df0ff" stop-opacity=".5"/>
        <stop offset="1" stop-color="#3df0ff" stop-opacity=".05"/>
      </linearGradient>
    </defs>
    <g id="track"><g id="scene"></g><g id="sceneB"></g></g>
  </svg>

  <div class="scanbeam"></div>
  <div class="crt"></div>
  <div class="vignette"></div>

  <div class="hud hud-box" id="title">
    <h1>清明賽博上河圖 <span class="alt">· 大宋2077</span></h1>
    <p>CYBERPUNK ALONG THE BIAN RIVER — 汴梁不夜長卷</p>
  </div>
  <button id="btnPause">❚❚ 暫停卷軸</button>
  <div class="hud hud-box" id="hint">懸停任意店鋪查看情報卡 · <b>雙擊畫面</b> 暫停 / 繼續</div>
  <div class="hud hud-box" id="counter">在線動態元素 <b id="dynCount">0</b>+<br>霓虹汴梁 · 晝夜不息</div>

  <div id="card">
    <div class="c-name"></div>
    <div class="c-id"></div>
    <div class="c-tag"></div>
    <div class="c-rate"><span>好評率</span><b></b></div>
    <div class="bar"><i></i></div>
    <div class="c-blurb"></div>
    <div class="c-foot"><span>SYS//BIAN-STREET</span><span>► LIVE</span></div>
  </div>
</div>

<script>
"use strict";
/* ================================================================
   0. 工具
================================================================ */
const NS="http://www.w3.org/2000/svg";
const scene=document.getElementById("scene");
let DYN=0;                                   // 动态元素计数（单份场景）
function E(tag,attr={},parent){
  const n=document.createElementNS(NS,tag);
  for(const k in attr) n.setAttribute(k,attr[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function G(parent,attr={}){return E("g",attr,parent)}
function rnd(seed){let s=seed>>>0;return ()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rnd(20770829);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=arr=>arr[Math.floor(R()*arr.length)];
const glow=(c,r=3)=>`drop-shadow(0 0 ${r}px ${c})`;
const C={cyan:"#3df0ff",magenta:"#ff3ddb",purple:"#a066ff",yellow:"#ffe04d",
  green:"#4dffa6",orange:"#ff8a3d",red:"#ff4d6d",blue:"#5b8cff",pink:"#ff7de2"};
const W=7200, GY=700;                         // 单份场景宽 / 岸上街面基线
const anim=(el,name,dur,delay=0,iter="infinite",tf="linear")=>{
  el.style.animation=`${name} ${dur}s ${tf} ${delay}s ${iter}`;};

/* ================================================================
   1. 天空：底色 / 星 / 月 / 云 / 远天际线 / 宋塔
================================================================ */
E("rect",{x:0,y:0,width:W,height:1000,fill:"url(#skyGrad)"},scene);
for(let i=0;i<90;i++){
  const s=E("circle",{cx:ri(0,W),cy:ri(10,340),r:R()<.12?1.8:1,
    fill:"#cfeeff",opacity:(.3+R()*.6).toFixed(2)},scene);
  anim(s,"twinkle",(2+R()*4).toFixed(2),(-R()*4).toFixed(2));DYN++;
}
const moonG=G(scene);
E("circle",{cx:780,cy:138,r:128,fill:"#8a5cff",opacity:.18,class:"moonglow"},moonG);
E("circle",{cx:780,cy:138,r:88,fill:"url(#moonGrad)",filter:glow("#b98cff",14)},moonG);
E("circle",{cx:752,cy:112,r:16,fill:"#b794ee",opacity:.5},moonG);
E("circle",{cx:806,cy:158,r:11,fill:"#b794ee",opacity:.45},moonG);
E("circle",{cx:792,cy:118,r:8,fill:"#c9aef7",opacity:.4},moonG);
const moonRing=E("ellipse",{cx:780,cy:138,rx:118,ry:34,fill:"none",
  stroke:"#3df0ff","stroke-width":1.4,"stroke-dasharray":"10 14",opacity:.6},moonG);
anim(moonRing,"spinSlow",40,-5);DYN++;
for(let i=0;i<6;i++){
  const cg=G(scene), x=ri(300,W-300), y=ri(60,300), w=ri(260,520);
  E("ellipse",{cx:x,cy:y,rx:w,ry:16,fill:"#3a1a6e",opacity:.35},cg);
  E("ellipse",{cx:x-40,cy:y-10,rx:w*.55,ry:12,fill:"#4a2288",opacity:.28},cg);
  anim(cg,"cloudDrift",(38+R()*20).toFixed(1),(-R()*30).toFixed(1));DYN++;
}
for(let x=-60;x<W+60;x+=ri(150,230)){
  const w=ri(110,190), h=ri(70,230), bg=G(scene);
  E("rect",{x,y:430-h,width:w,height:h,fill:"#0d0726",stroke:"#241348","stroke-width":1},bg);
  const lamp=E("circle",{cx:x+w/2,cy:430-h-6,r:3,fill:C.red,filter:glow(C.red,4)},bg);
  anim(lamp,"blink",(1.6+R()*1.6).toFixed(2),(-R()*2).toFixed(2));DYN++;
  for(let wy=430-h+14;wy<414;wy+=22)for(let wx=x+12;wx<x+w-12;wx+=24){
    if(R()<.22) E("rect",{x:wx,y:wy,width:8,height:10,
      fill:pick(["#3df0ff","#ffe04d","#ff3ddb","#4dffa6"]),opacity:(.25+R()*.4).toFixed(2)},bg);
  }
  if(R()<.5)E("line",{x1:x+w*.3,y1:430-h,x2:x+w*.3,y2:430-h-ri(20,46),stroke:"#3a2570","stroke-width":2},bg);
}
function pagoda(x,h,c){
  const g=G(scene);let y=430;
  for(let f=0;f<4;f++){
    const fw=h-f*22, fh=30, ry=y-fh;
    E("rect",{x:x-fw/2+14,y:ry,width:fw-28,height:fh,fill:"#160c38",stroke:c,"stroke-width":1,opacity:.9},g);
    E("path",{d:`M ${x-fw/2} ${ry+4} Q ${x} ${ry-18} ${x+fw/2} ${ry+4} Z`,
      fill:"#22114d",stroke:c,"stroke-width":1.4,opacity:.9},g);
    E("rect",{x:x-6,y:ry+8,width:12,height:14,fill:c,opacity:.55},g);
    y=ry;
  }
  E("line",{x1:x,y1:y,x2:x,y2:y-34,stroke:c,"stroke-width":2},g);
  const top=E("circle",{cx:x,cy:y-38,r:4,fill:c,filter:glow(c,5)},g);
  anim(top,"blink",2.4,-R()*2);DYN++;
}
pagoda(1340,150,C.cyan);pagoda(4360,178,C.magenta);pagoda(5260,140,C.purple);

/* ================================================================
   2. 飞行汽车 ×8 / 无人机 ×3
================================================================ */
function flyer(x,y,scale,c,dir,dur,delay){
  const wrap=G(scene,{transform:`translate(${x},${y}) scale(${scale})`});
  const mv=G(wrap,{class:dir<0?"moveL":"moveR"});
  mv.style.animationDuration=dur+"s";mv.style.animationDelay=delay+"s";
  const fl=G(mv,{class:"floaty"});fl.style.animationDuration=(3.2+R()*2).toFixed(1)+"s";
  E("line",{x1:-96,y1:2,x2:-34,y2:2,stroke:c,"stroke-width":2.4,opacity:.5,"stroke-linecap":"round"},fl);
  E("path",{d:"M-48 0 Q-30 -16 30 -14 Q54 -10 56 0 Q50 13 20 15 L-32 15 Q-50 11 -48 0 Z",
    fill:"#1a1038",stroke:c,"stroke-width":2,filter:glow(c,3)},fl);
  E("path",{d:"M-16 -13 Q6 -27 27 -12 Z",fill:c,opacity:.22,stroke:c,"stroke-width":1.2},fl);
  E("line",{x1:-36,y1:15,x2:40,y2:15,stroke:"#9ff6ff","stroke-width":3,filter:glow("#3df0ff",6)},fl);
  E("circle",{cx:-20,cy:15,r:3,fill:"#9ff6ff",filter:glow("#3df0ff",5)},fl);
  E("circle",{cx:24,cy:15,r:3,fill:"#9ff6ff",filter:glow("#3df0ff",5)},fl);
  const tl=E("circle",{cx:-48,cy:0,r:3.4,fill:C.red,filter:glow(C.red,5)},fl);
  anim(tl,"blink",1.3,-R());
  E("circle",{cx:56,cy:0,r:3.6,fill:C.yellow,filter:glow(C.yellow,5)},fl);
  E("path",{d:"M-6 -14 L0 -24 L8 -14 Z",fill:c,opacity:.7},fl);
  DYN++;
}
[
 [900,84,1.05,C.cyan,-1,26,-4],[2200,140,.82,C.magenta,1,34,-12],
 [3300,108,1.2,C.purple,-1,22,-18],[4200,190,.75,C.yellow,-1,30,-8],
 [5000,128,.95,C.cyan,1,28,-22],[5800,250,.7,C.green,-1,24,-14],
 [6400,160,1.1,C.magenta,-1,32,-3],[1700,280,.66,C.blue,1,36,-26]
].forEach(a=>flyer(...a));
function drone(x,y,c,dur,delay){
  const wrap=G(scene,{transform:`translate(${x},${y})`});
  const mv=G(wrap,{class:"moveL"});mv.style.animationDuration=dur+"s";mv.style.animationDelay=delay+"s";
  const fl=G(mv,{class:"floaty"});
  E("polygon",{points:"-30,6 30,6 12,120 -12,120",fill:c,opacity:.07},fl);
  E("line",{x1:0,y1:6,x2:0,y2:118,stroke:c,"stroke-width":1,opacity:.4,"stroke-dasharray":"4 6"},fl);
  E("ellipse",{cx:0,cy:0,rx:12,ry:6,fill:"#1c1140",stroke:c,"stroke-width":1.6},fl);
  [[-18],[18]].forEach(([rx])=>{
    E("line",{x1:0,y1:0,x2:rx,y2:0,stroke:"#4a3480","stroke-width":2},fl);
    E("ellipse",{cx:rx,cy:0,rx:9,ry:2.4,fill:"none",stroke:c,"stroke-width":1.4,class:"rotor"},fl);
  });
  const l1=E("circle",{cx:-12,cy:4,r:2.4,fill:C.red},fl);anim(l1,"blink",1,-.3);
  const l2=E("circle",{cx:12,cy:4,r:2.4,fill:C.green},fl);anim(l2,"blink",1,-.8);

/* ================================================================
   14. 交互：悬停情报卡 + 暂停控制
================================================================ */
const track=document.getElementById("track");
const card=document.getElementById("card");
const cName=card.querySelector(".c-name"),cId=card.querySelector(".c-id"),
  cTag=card.querySelector(".c-tag"),cRate=card.querySelector(".c-rate b"),
  cBar=card.querySelector(".bar i"),cBlurb=card.querySelector(".c-blurb");
let active=null,userPaused=false;
function showCard(s){
  const c=s.dataset.color;
  card.style.setProperty("--cc",c);
  cName.textContent=s.dataset.name;
  cId.textContent=s.dataset.id+" // 汴梁街市商戶數據庫";
  cTag.textContent=s.dataset.tag;
  cRate.textContent=s.dataset.rate+"%";
  cBar.style.width=s.dataset.rate+"%";cBar.style.background=c;cBar.style.boxShadow=`0 0 8px ${c}`;
  cBlurb.textContent=s.dataset.blurb;
  card.classList.add("show");
}
function hideCard(){card.classList.remove("show");active=null;
  if(!userPaused)track.classList.remove("paused");}
document.addEventListener("mouseover",e=>{
  const s=e.target.closest&&e.target.closest(".shop");
  if(s&&s!==active){active=s;showCard(s);if(!userPaused)track.classList.add("paused");}
});
document.addEventListener("mousemove",e=>{
  if(active){
    let x=e.clientX+22,y=e.clientY+18;
    if(x+280>innerWidth)x=e.clientX-286;
    if(y+200>innerHeight)y=e.clientY-208;
    card.style.left=x+"px";card.style.top=y+"px";
  }
});
document.addEventListener("mouseout",e=>{
  const to=e.relatedTarget;
  if(active&&!(to&&to.closest&&to.closest(".shop")===active))hideCard();
});
const btn=document.getElementById("btnPause");
function togglePause(){
  userPaused=!userPaused;
  track.classList.toggle("paused",userPaused);
  btn.textContent=userPaused?"► 繼續卷軸":"❚❚ 暫停卷軸";
}
btn.addEventListener("click",togglePause);
document.getElementById("viewport").addEventListener("dblclick",togglePause);
document.getElementById("dynCount").textContent=DYN*2;
