<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>机械腕表 · 天文时钟</title>
<style>
:root{--bg:#080a0d;--dial:#12171c;--dial2:#202830;--gold:#c9a562;--white:#e8edf0;--muted:#85919b;--red:#c95c50;--blue:#9ebdcd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 35%,#26313a 0,#0d1115 42%,#050609 100%);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}.page{min-height:100vh;display:grid;place-items:center;padding:24px}.layout{width:min(1160px,96vw);display:grid;grid-template-columns:minmax(0,760px) 270px;gap:28px;align-items:center}.watch{position:relative;width:min(78vw,760px);aspect-ratio:1;border-radius:50%;padding:18px;margin:auto;background:linear-gradient(135deg,#eef2f4 0,#8f999f 13%,#30363b 31%,#07090b 53%,#899197 82%,#edf0f2);box-shadow:0 40px 90px rgba(0,0,0,.62),inset 0 2px rgba(255,255,255,.8),inset 0 -7px 16px rgba(0,0,0,.8)}.watch:before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 0 0 5px rgba(0,0,0,.24),inset 0 0 0 8px rgba(255,255,255,.07);pointer-events:none}.dial{position:relative;width:100%;height:100%;overflow:hidden;border-radius:50%;background:radial-gradient(circle at 42% 36%,#2b343c 0,#1a2128 30%,#10151a 63%,#080b0e 100%);box-shadow:inset 0 0 40px #000,inset 0 0 0 2px rgba(255,255,255,.07)}.dial:before,.dial:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.dial:before{inset:4%;border:1px solid rgba(255,255,255,.08)}.dial:after{inset:8%;border:1px solid rgba(255,255,255,.055)}.ticks{position:absolute;inset:3%;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.7) 0deg .45deg,transparent .45deg 6deg);-webkit-mask:radial-gradient(circle,transparent 0 91.5%,#000 92% 100%);mask:radial-gradient(circle,transparent 0 91.5%,#000 92% 100%);opacity:.55}.markers{position:absolute;inset:7%;border-radius:50%}.marker{position:absolute;left:50%;top:2%;width:2.4%;height:7%;border-radius:2px;background:linear-gradient(#f0d58e,#b48c4d);transform-origin:50% 690%;box-shadow:0 0 5px rgba(201,165,98,.25)}.marker.m{width:1%;height:4%;top:3.5%;transform-origin:50% 1130%;background:rgba(229,234,238,.62);box-shadow:none}.brand{position:absolute;top:16%;left:50%;transform:translateX(-50%);font:600 clamp(8px,1.5vw,14px)/1.1 Georgia,serif;letter-spacing:.23em;text-align:center;white-space:nowrap}.brand small{display:block;margin-top:5px;color:var(--gold);font:600 .6em/1 system-ui;letter-spacing:.34em}.numerals{position:absolute;inset:11%;font:600 clamp(11px,2.1vw,23px)/1 Georgia,serif;color:#eef1f2;text-shadow:0 1px 2px #000}.num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--r)) translateY(-34%)}.num span{display:block;transform:rotate(calc(-1*var(--r)))}.hand{position:absolute;left:50%;top:50%;transform-origin:50% 84%;border-radius:999px;z-index:6;pointer-events:none}.h{width:1.8%;height:23%;background:linear-gradient(#fff,#abb2b7);box-shadow:0 0 4px rgba(255,255,255,.2)}.min{width:1.1%;height:33%;background:linear-gradient(#fff,#d4d8da);box-shadow:0 0 5px rgba(255,255,255,.2)}.sec{width:.45%;height:39%;background:var(--red);box-shadow:0 0 8px rgba(201,92,80,.55);transform-origin:50% 91%}.tail{position:absolute;left:50%;top:50%;width:1px;height:12%;background:var(--red);transform:translate(-50%,-100%);z-index:6}.hub{position:absolute;left:50%;top:50%;width:8%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 12%,#ccd0d2 14% 30%,#616970 32% 72%,#101419 74%);box-shadow:0 0 0 2px #090b0e,0 0 8px rgba(255,255,255,.18);z-index:8}.sub{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 30%,#29333b 0,#171d23 58%,#090c10 100%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 0 0 5px rgba(0,0,0,.22),inset 0 0 18px rgba(0,0,0,.72);z-index:4}.moon{left:9%;top:38%;width:23%;aspect-ratio:1}.csec{right:9%;top:38%;width:23%;aspect-ratio:1}.cmin{left:41.5%;bottom:9%;width:17%;aspect-ratio:1}.sub .st{position:absolute;left:50%;top:14%;transform:translateX(-50%);font:600 clamp(7px,1vw,10px) system-ui;letter-spacing:.14em;color:var(--muted)}.sub .stx{position:absolute;inset:18%;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.5) 0deg .8deg,transparent .8deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 80%,#000 81%);mask:radial-gradient(circle,transparent 0 80%,#000 81%)}.subhand{position:absolute;left:50%;top:50%;width:1.8px;height:38%;transform-origin:50% 100%;background:linear-gradient(#f4f5f4,var(--red));border-radius:99px}.subhand.blue{background:linear-gradient(#edf7fa,var(--blue))}.moonface{position:absolute;inset:24%;border-radius:50%;overflow:hidden;background:#090c10;border:1px solid rgba(255,255,255,.08)}#moonDisc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d3 0 9%,#d8d1aa 47%,#6f6d59 100%)}#moonShadow{position:absolute;border-radius:50%;background:#090c10;box-shadow:inset 0 0 9px rgba(0,0,0,.8)}.date{position:absolute;right:23%;top:66%;transform:translateY(-50%);min-width:14%;height:8%;display:grid;place-items:center;background:linear-gradient(#f8f6ed,#c8c6bb,#eceae2);color:#14171a;border:2px solid #50565b;border-radius:4px;font:700 clamp(11px,2vw,21px)/1 "Courier New";letter-spacing:.05em;z-index:9;box-shadow:inset 0 2px rgba(255,255,255,.7),inset 0 -3px 4px rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.5)}.astro{position:absolute;left:50%;bottom:11%;width:36%;min-width:170px;transform:translateX(-50%);text-align:center;z-index:4}.bar{height:6px;border-radius:99px;background:linear-gradient(90deg,#273c62,#bca16b 50%,#273c62);position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.08),inset 0 0 7px #000}.markerDay{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#f1d98d;box-shadow:0 0 10px rgba(241,217,141,.7);transform:translate(-50%,-50%)}.ss{display:flex;justify-content:space-between;margin-top:8px;font:10px "Courier New";color:#9aa6af}.loc{margin-top:6px;color:var(--gold);font:600 9px system-ui;letter-spacing:.18em}.crown{position:absolute;right:-12px;top:41%;width:46px;height:76px;border-radius:11px;background:repeating-linear-gradient(90deg,#d2d7da 0 3px,#71787d 3px 6px);box-shadow:8px 10px 14px rgba(0,0,0,.4)}.panel{border:1px solid rgba(255,255,255,.1);background:linear-gradient(155deg,rgba(34,41,48,.84),rgba(9,12,16,.88));border-radius:18px;padding:16px;box-shadow:0 16px 28px rgba(0,0,0,.27),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(10px);margin-bottom:14px}.panel h1{margin:0 0 10px;color:#eed28f;font:650 11px system-ui;letter-spacing:.16em}.digital{font:24px "Courier New";letter-spacing:.05em;color:#eef4f7;margin-bottom:10px}.muted{font-size:11px;line-height:1.5;color:#76818b}.panel select,.panel button{width:100%;min-height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(#3e484f,#101419);color:#e8edf0;padding:8px 10px;font:inherit;cursor:pointer}.panel select:focus,.panel button:focus-visible{outline:2px solid #edd18e;outline-offset:2px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.laps{margin:10px 0 0;padding:0;list-style:none;max-height:140px;overflow:auto;border-top:1px solid rgba(255,255,255,.07)}.laps li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font:10px "Courier New";color:#aeb8be}
@media(max-width:900px){.layout{grid-template-columns:1fr}.watch{width:min(92vw,700px)}.controls{width:min(92vw,700px);margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{margin:0}}@media(max-width:560px){.page{padding:12px}.controls{grid-template-columns:1fr}.watch{padding:11px}.astro{width:44%;min-width:130px;bottom:10%}.date{right:20%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page"><main class="layout" aria-label="机械腕表风格天文时钟">
<section class="watch" aria-label="主表盘：系统本地时间、日期、月相、昼夜和日出日落">
<div class="dial">
<div class="ticks" aria-hidden="true"></div><div class="markers" id="markers"></div><div class="numerals" id="numerals"></div>
<div class="brand">ASTRO HOROLOGIE<small>CHRONOMÈTRE</small></div>
<div class="sub moon" aria-label="月相小表盘"><div class="st">MOON</div><div class="stx" aria-hidden="true"></div><div class="moonface"><div id="moonDisc"></div><div id="moonShadow"></div></div><div class="hub" style="width:11%"></div></div>
<div class="sub csec" aria-label="计时码表秒盘"><div class="st">CHRONO</div><div class="stx" aria-hidden="true"></div><div id="csecHand" class="subhand"></div><div class="hub" style="width:11%"></div></div>
<div class="sub cmin" aria-label="计时码表分钟盘"><div class="st">MIN</div><div class="stx" aria-hidden="true"></div><div id="cminHand" class="subhand blue"></div><div class="hub" style="width:11%"></div></div>
<div class="date" aria-live="polite" aria-label="当前日期"><span id="dateDisplay">----</span></div>
<div class="astro" aria-label="昼夜及日出日落指示"><div class="bar"><div id="dayMarker" class="markerDay"></div></div><div class="ss"><span id="sunrise">SUNRISE --:--</span><span id="sunset">SUNSET --:--</span></div><div id="loc" class="loc">TOKYO</div></div>
<div id="hourHand" class="hand h"></div><div id="minuteHand" class="hand min"></div><div id="secondHand" class="hand sec"></div><div class="tail"></div><div class="hub"></div>
</div><div class="crown" aria-hidden="true"></div></section>
<aside class="controls" aria-label="天文与计时控制">
<section class="panel"><h1>LOCAL TIME</h1><div id="digitalTime" class="digital">00:00:00</div><div class="muted">秒针角度由当前系统时间直接计算，而不是累加上一帧，因此长时间运行不会积累漂移；页面重新可见时立即重新校准。</div></section>
<section class="panel"><h1>ASTRONOMY LOCATION</h1><label for="city" class="muted">CITY / LOCAL SKY</label><div style="height:7px"></div><select id="city" aria-label="选择天文计算城市"></select></section>
<section class="panel"><h1>CHRONOGRAPH</h1><div id="chronoDisplay" class="digital">00:00.00</div><div class="buttons"><button id="start">START</button><button id="pause">PAUSE</button><button id="resume">CONTINUE</button><button id="lap">LAP</button><button id="reset">RESET</button></div><ul id="laps" class="laps" aria-label="计圈记录"></ul></section>
</aside>
</main></div>
<script>
(()=>{
'use strict';
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const $=id=>document.getElementById(id), pad=n=>String(Math.trunc(n)).padStart(2,'0');
const markers=$('markers'); for(let i=0;i<60;i++){const e=document.createElement('i');e.className='marker'+(i%5?' m':'');e.style.transform=`rotate(${i*6}deg)`;markers.appendChild(e)}
const vals=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];const nums=$('numerals'); vals.forEach((v,i)=>{const e=document.createElement('div');const r=i*30;e.className='num';e.style.setProperty('--r',`${r}deg`);e.innerHTML=`<span>${v}</span>`;nums.appendChild(e)});
const cities={tokyo:{name:'TOKYO',lat:35.6895,lon:139.6917,zone:'Asia/Tokyo'},london:{name:'LONDON',lat:51.5072,lon:-.1276,zone:'Europe/London'},newyork:{name:'NEW YORK',lat:40.7128,lon:-74.006,zone:'America/New_York'},sydney:{name:'SYDNEY',lat:-33.8688,lon:151.2093,zone:'Australia/Sydney'}};
const city=$('city');Object.entries(cities).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.name;city.appendChild(o)});let cityKey='tokyo';city.value=cityKey;
const SYN=29.530588853, known=Date.UTC(2000,0,6,18,14);
function moonAge(d){let x=(d.getTime()-known)/86400000%SYN;return x<0?x+SYN:x}
function moon(d){const a=moonAge(d),f=a/SYN,wan=f<.5, p=wan?f*2:(1-f)*2, w=Math.max(0,Math.min(1,p)), sh=$('moonShadow');if(a<.25||a>SYN-.25){sh.style.width='100%';sh.style.left='0';sh.style.top='0';sh.style.height='100%';sh.style.transform='none';return}sh.style.height='116%';sh.style.top='-8%';sh.style.width=`${Math.abs(1-2*w)*100}%`;sh.style.left=wan?`${46+54*w}%`:`${54-54*w}%`;sh.style.transform='translateX(-50%)'}
const RAD=Math.PI/180,DEG=180/Math.PI;
function doy(d){const y=d.getUTCFullYear();return Math.floor((Date.UTC(y,d.getUTCMonth(),d.getUTCDate())-Date.UTC(y,0,0))/86400000)}
function sunEvent(date,lat,lon,rise){const n=doy(date),lh=lon/15,t=n+((rise?6:18)-lh)/24,M=.9856*t-3.289;let L=(M+1.916*Math.sin(M*RAD)+.020*Math.sin(2*M*RAD)+282.634)%360;if(L<0)L+=360;let RA=Math.atan(.91764*Math.tan(L*RAD))*DEG;if(RA<0)RA+=360;const lq=Math.floor(L/90)*90,rq=Math.floor(RA/90)*90;RA=(RA+lq-rq)/15;const sd=.39782*Math.sin(L*RAD),cd=Math.cos(Math.asin(sd)),cz=(Math.cos(90.8333*RAD)-sd*Math.sin(lat*RAD))/(cd*Math.cos(lat*RAD));if(cz>1||cz<-1)return null;let H=(rise?360-Math.acos(cz)*DEG:Math.acos(cz)*DEG)/15;let ut=H+RA-.06571*t-6.622-lh;ut=((ut%24)+24)%24;return new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate())+ut*3600000)}
function localParts(d,zone){return new Intl.DateTimeFormat('en-US',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d)}
function localDateStart(now,zone){const p=localParts(now,zone);return new Date(Date.UTC(+p.find(x=>x.type==='year').value,+p.find(x=>x.type==='month').value-1,+p.find(x=>x.type==='day').value))}
function hm(d,zone){if(!d)return'--:--';return new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function mins(d,zone){const p=localParts(d,zone);return +p.find(x=>x.type==='hour').value*60 + +p.find(x=>x.type==='minute').value + +p.find(x=>x.type==='second').value/60}
let astroKey='',astro=null;
function astroUpdate(force=false){const now=new Date(),c=cities[cityKey],ld=localDateStart(now,c.zone),key=cityKey+'|'+ld.toISOString().slice(0,10);if(!force&&key===astroKey&&astro)return;astroKey=key;astro={rise:sunEvent(ld,c.lat,c.lon,true),set:sunEvent(ld,c.lat,c.lon,false)};$('sunrise').textContent='SUNRISE '+hm(astro.rise,c.zone);$('sunset').textContent='SUNSET '+hm(astro.set,c.zone);$('loc').textContent=`${c.name} · ${Math.abs(c.lat).toFixed(2)}°${c.lat>=0?'N':'S'} ${Math.abs(c.lon).toFixed(2)}°${c.lon>=0?'E':'W'}`;astroPosition(now)}
function astroPosition(now){const c=cities[cityKey];const cur=mins(now,c.zone),r=astro?.rise?safe(mins(astro.rise,c.zone),0,1440):null,s=astro?.set?safe(mins(astro.set,c.zone),0,1440):null;let pos=cur/1440;if(r!==null&&s!==null&&s>r){if(cur>=r&&cur<=s)pos=(cur-r)/(s-r);else if(cur<r)pos=.5*cur/Math.max(1,r);else pos=.5+.5*(cur-s)/Math.max(1,1440-s)}$('dayMarker').style.left=(pos*100)+'%'}function safe(x,a,b){return Math.max(a,Math.min(b,x))}
function clock(now){const ms=now.getMilliseconds(),s=now.getSeconds(),m=now.getMinutes(),h=now.getHours(),ss=reduced.matches?s:s+ms/1000,mf=m+ss/60,hf=h%12+mf/60;$('secondHand').style.transform=`translate(-50%,-82%) rotate(${ss*6}deg)`;$('minuteHand').style.transform=`translate(-50%,-84%) rotate(${mf*6}deg)`;$('hourHand').style.transform=`translate(-50%,-84%) rotate(${hf*30}deg)`;$('digitalTime').textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;$('dateDisplay').textContent=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;moon(now)}
const chrono={running:false,start:0,acc:0,lastLap:0,laps:[]};function elapsed(t=performance.now()){return chrono.acc+(chrono.running?t-chrono.start:0)}function start(){if(!chrono.running){chrono.start=performance.now();chrono.running=true}}function pause(){if(chrono.running){chrono.acc+=performance.now()-chrono.start;chrono.running=false}}function reset(){chrono.running=false;chrono.start=0;chrono.acc=0;chrono.lastLap=0;chrono.laps=[];renderLaps()}function fmt(ms){const cs=Math.floor(ms/10),m=Math.floor(cs/6000),s=Math.floor(cs/100)%60,c=cs%100;return`${pad(m)}:${pad(s)}.${pad(c)}`}function lap(){const e=elapsed(),split=e-chrono.lastLap;chrono.lastLap=e;chrono.laps.unshift({split,total:e,n:chrono.laps.length+1});if(chrono.laps.length>20)chrono.laps.pop();renderLaps()}function renderLaps(){$('laps').innerHTML=chrono.laps.map(x=>`<li><span>LAP ${pad(x.n)}</span><span>+${fmt(x.split)}</span><span>${fmt(x.total)}</span></li>`).join('')}
$('start').onclick=start;$('pause').onclick=pause;$('resume').onclick=start;$('reset').onclick=reset;$('lap').onclick=lap;city.onchange=()=>{cityKey=city.value;astroUpdate(true)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const n=new Date();clock(n);astroUpdate(true);renderLaps()}});window.addEventListener('focus',()=>{const n=new Date();clock(n);astroUpdate(true)});
function frame(){const n=new Date(),p=performance.now();clock(n);const ck=cityKey+'|'+localDateStart(n,cities[cityKey].zone).toISOString().slice(0,10);if(ck!==astroKey)astroUpdate(true);else if(astro)astroPosition(n);const e=elapsed(p);$('chronoDisplay').textContent=fmt(e);const sec=(e/1000)%60,min=Math.floor(e/60000)%60;$('csecHand').style.transform=`translate(-50%,-100%) rotate(${sec*6}deg)`;$('cminHand').style.transform=`translate(-50%,-100%) rotate(${min*6+(sec/60)*6}deg)`;requestAnimationFrame(frame)}
astroUpdate(true);frame();
})();
</script>
</body>
</html>
