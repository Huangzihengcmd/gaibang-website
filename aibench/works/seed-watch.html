<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astronomia · 机械天文腕表</title>
<style>
  :root{
    --gold:#c9a86a; --gold-soft:rgba(201,168,106,.35);
    --ink:#0a0e16; --paper:#ece4cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; color:var(--paper);
    font-family:"Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%,#1c2638 0%,#0b0f18 55%,#05070c 100%);
  }
  .stage{
    max-width:1180px;margin:0 auto;padding:26px 16px 40px;
    display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start;
  }
  .watch{flex:1 1 520px;max-width:660px;min-width:300px}
  .watch svg{width:100%;height:auto;display:block;filter:drop-shadow(0 28px 55px rgba(0,0,0,.75))}
  .panel{flex:1 1 300px;max-width:380px;display:flex;flex-direction:column;gap:14px}
  .card{
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--gold-soft);border-radius:14px;padding:14px 16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.35);
  }
  .card h3{
    margin:0 0 10px;font-size:11px;letter-spacing:3px;font-weight:600;
    color:var(--gold);text-transform:uppercase;
  }
  .city-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    cursor:pointer;color:var(--paper);font-size:13px;font-family:inherit;
    background:#182030;border:1px solid var(--gold-soft);border-radius:9px;
    padding:9px 6px;transition:border-color .15s,background .15s,color .15s;
  }
  button:hover{border-color:var(--gold)}
  button.active{background:linear-gradient(180deg,#e3c88c,#b8934f);color:#14100a;border-color:#e3c88c;font-weight:700}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;line-height:1.9}
  .kv span:first-child{color:#9aa3b5}
  .kv span:last-child{font-variant-numeric:tabular-nums}
  .chrono-readout{
    text-align:center;font-family:"Courier New",Consolas,monospace;
    font-size:30px;letter-spacing:2px;margin:2px 0 10px;color:#f3e6c4;
  }
  .chrono-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  button.primary{background:linear-gradient(180deg,#3a4a66,#222d42)}
  #lapList{margin:6px 0 0;padding-left:20px;max-height:170px;overflow:auto;
    font-family:"Courier New",Consolas,monospace;font-size:12.5px;line-height:1.85}
  #lapList li{color:#cfd6e2}
  #lapList .lap-n{color:var(--gold);display:inline-block;width:46px}
  .hint{font-size:11.5px;line-height:1.7;color:#8b95a7}
  .pusher{cursor:pointer}
  .pusher:active .pusher-body{fill:#6d7681}
  .pusher:focus{outline:none}
  .pusher:focus-visible .pusher-body{stroke:#e3c88c;stroke-width:2}
  .serif{font-family:Georgia,"Times New Roman","Songti SC",serif}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  @keyframes sheenSpin{to{transform:rotate(360deg)}}
  #sheen{animation:sheenSpin 18s linear infinite;transform-origin:500px 500px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .running-dot{animation:pulse 1.1s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){
    #sheen,.running-dot{animation:none!important}
  }
  @media (max-width:560px){
    .city-btns{grid-template-columns:repeat(2,1fr)}
    .chrono-readout{font-size:25px}
  }
</style>
</head>
<body>
<main class="stage">
  <div class="watch">
    <svg id="watch" viewBox="-50 -40 1100 1080" role="group"
         aria-labelledby="watchTitle watchDesc" xmlns="http://www.w3.org/2000/svg">
      <title id="watchTitle">Astronomia 机械天文腕表</title>
      <desc id="watchDesc">主表盘显示本地时间，另含月相、计时码表、日期窗与昼夜日出日落指示。</desc>

      <defs>
        <radialGradient id="caseGrad" cx="48%" cy="44%" r="62%">
          <stop offset="0%" stop-color="#f2f5f9"/>
          <stop offset="42%" stop-color="#aab3bd"/>
          <stop offset="72%" stop-color="#616a75"/>
          <stop offset="100%" stop-color="#333b45"/>
        </radialGradient>
        <radialGradient id="bezelGrad" cx="48%" cy="42%" r="60%">
          <stop offset="0%" stop-color="#dde3ea"/>
          <stop offset="50%" stop-color="#8f99a5"/>
          <stop offset="100%" stop-color="#454e59"/>
        </radialGradient>
        <radialGradient id="dialGrad" cx="50%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#1d283b"/>
          <stop offset="55%" stop-color="#0e1626"/>
          <stop offset="100%" stop-color="#05080f"/>
        </radialGradient>
        <radialGradient id="subGrad" cx="50%" cy="38%" r="70%">
          <stop offset="0%" stop-color="#16203240"/>
          <stop offset="70%" stop-color="#0a101c"/>
          <stop offset="100%" stop-color="#04070e"/>
        </radialGradient>
        <linearGradient id="handSteel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f6f3ea"/>
          <stop offset="28%" stop-color="#aab3c0"/>
          <stop offset="50%" stop-color="#3a4250"/>
          <stop offset="72%" stop-color="#aab3c0"/>
          <stop offset="100%" stop-color="#f6f3ea"/>
        </linearGradient>
        <radialGradient id="capGrad" cx="42%" cy="38%" r="70%">
          <stop offset="0%" stop-color="#f3f0e6"/>
          <stop offset="60%" stop-color="#8a94a1"/>
          <stop offset="100%" stop-color="#2e3640"/>
        </radialGradient>
        <radialGradient id="moonLit" cx="42%" cy="38%" r="70%">
          <stop offset="0%" stop-color="#fbf5df"/>
          <stop offset="70%" stop-color="#e9ddba"/>
          <stop offset="100%" stop-color="#c9bb91"/>
        </radialGradient>
        <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
          <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <pattern id="guilloche" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle cx="5" cy="5" r="4.6" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width=".6"/>
        </pattern>
        <clipPath id="moonClip"><circle cx="500" cy="232" r="50"/></clipPath>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".55"/>
        </filter>
      </defs>

      <!-- 表壳 -->
      <circle cx="500" cy="500" r="490" fill="url(#caseGrad)"/>
      <circle cx="500" cy="500" r="470" fill="url(#bezelGrad)"/>
      <g id="bezelLines"></g>
      <circle cx="500" cy="500" r="436" fill="url(#dialGrad)"/>
      <circle cx="500" cy="500" r="436" fill="url(#guilloche)"/>
      <circle cx="500" cy="500" r="430" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="2"/>
      <circle cx="500" cy="500" r="424" fill="none" stroke="#c9a86a" stroke-opacity=".5" stroke-width="1.2"/>

      <!-- 表圈螺丝 -->
      <g id="bezelScrews"></g>

      <!-- 表冠与按钮 -->
      <g id="crown">
        <rect x="946" y="466" width="40" height="68" rx="12" fill="url(#caseGrad)" stroke="#2a313a" stroke-width="1.5"/>
        <g stroke="#2f3740" stroke-width="1.6">
          <line x1="954" y1="476" x2="954" y2="524"/><line x1="961" y1="474" x2="961" y2="526"/>
          <line x1="968" y1="473" x2="968" y2="527"/><line x1="975" y1="474" x2="975" y2="526"/>
          <line x1="982" y1="476" x2="982" y2="524"/>
        </g>
      </g>
      <g class="pusher" id="pusherA" role="button" tabindex="0" aria-label="计时码表开始、暂停或继续">
        <g transform="rotate(60 500 500)">
          <rect class="pusher-body" x="484" y="6" width="32" height="42" rx="10" fill="url(#caseGrad)" stroke="#2a313a" stroke-width="1.5"/>
          <rect x="489" y="12" width="22" height="6" rx="3" fill="#c9a86a" fill-opacity=".75"/>
        </g>
      </g>
      <g class="pusher" id="pusherB" role="button" tabindex="0" aria-label="计时码表计圈，暂停时归零">
        <g transform="rotate(120 500 500)">
          <rect class="pusher-body" x="484" y="6" width="32" height="42" rx="10" fill="url(#caseGrad)" stroke="#2a313a" stroke-width="1.5"/>
          <rect x="489" y="12" width="22" height="6" rx="3" fill="#d8dfe7" fill-opacity=".6"/>
        </g>
      </g>

      <!-- 主表盘刻度与数字（JS 生成刻度） -->
      <g id="minuteTicks"></g>
      <g id="hourNumerals" class="serif" fill="#d9bd84" font-size="30" font-weight="600"
         text-anchor="middle" dominant-baseline="central"></g>

      <!-- 12点位：月相 -->
      <g id="moonDial" role="img" aria-label="月相表盘">
        <circle cx="500" cy="205" r="116" fill="url(#subGrad)" stroke="#c9a86a" stroke-opacity=".45"/>
        <circle cx="500" cy="205" r="108" fill="none" stroke="#fff" stroke-opacity=".06"/>
        <text x="500" y="118" text-anchor="middle" fill="#c9a86a" font-size="11" letter-spacing="3">MOONPHASE</text>
        <g fill="#f3ead0">
          <circle cx="452" cy="180" r="1.4"/><circle cx="548" cy="172" r="1.1"/>
          <circle cx="446" cy="246" r="1"/><circle cx="556" cy="252" r="1.3"/>
          <circle cx="470" cy="152" r="1"/>
        </g>
        <circle cx="500" cy="232" r="50" fill="#0b1322" stroke="#c9a86a" stroke-opacity=".6"/>
        <g clip-path="url(#moonClip)">
          <path id="moonLitPath" fill="url(#moonLit)"></path>
          <g id="moonCraters" fill="#b8a978" fill-opacity=".55"></g>
        </g>
        <text id="moonText" x="500" y="299" text-anchor="middle" fill="#cfd6e2" font-size="11.5">--</text>
      </g>

      <!-- 3点位：昼夜 / 日出日落 -->
      <g id="dayNightDial" role="img" aria-label="昼夜与日出日落指示">
        <circle cx="795" cy="500" r="116" fill="url(#subGrad)" stroke="#c9a86a" stroke-opacity=".45"/>
        <circle cx="795" cy="500" r="108" fill="none" stroke="#fff" stroke-opacity=".06"/>
        <text x="795" y="412" text-anchor="middle" fill="#c9a86a" font-size="11" letter-spacing="3">DAY / NIGHT</text>
        <circle cx="795" cy="500" r="74" fill="#0a1322" stroke="#c9a86a" stroke-opacity=".35"/>
        <path id="dayArc" fill="none" stroke="#e6b85c" stroke-opacity=".85" stroke-width="9" stroke-linecap="round"></path>
        <g id="dnTicks"></g>
        <g id="dnLabels" fill="#9aa6ba" font-size="11" text-anchor="middle" dominant-baseline="central"></g>
        <g id="dayNightHand">
          <line x1="795" y1="508" x2="795" y2="442" stroke="#dfe5ee" stroke-width="2"/>
          <circle id="sunDot" cx="795" cy="436" r="7" fill="#e6b85c" stroke="#8a6a2e" stroke-width="1"/>
        </g>
        <text id="srText" x="795" y="497" text-anchor="middle" fill="#cfd6e2" font-size="10.5">↑ --:--</text>
        <text id="ssText" x="795" y="513" text-anchor="middle" fill="#cfd6e2" font-size="10.5">↓ --:--</text>
      </g>

      <!-- 6点位：计时 12 小时 -->
      <g id="chHourDial" role="img" aria-label="计时码表小时盘">
        <circle cx="500" cy="795" r="112" fill="url(#subGrad)" stroke="#c9a86a" stroke-opacity=".45"/>
        <g id="chHourTicks"></g>
        <g id="chHourLabels" fill="#9aa6ba" font-size="12" text-anchor="middle" dominant-baseline="central"></g>
        <g id="chHourHand" filter="url(#softShadow)">
          <polygon points="500,742 503.5,792 500,806 496.5,792" fill="#e7ecf3"/>
        </g>
        <circle cx="500" cy="795" r="4" fill="url(#capGrad)"/>
        <text x="500" y="884" text-anchor="middle" fill="#c9a86a" font-size="10" letter-spacing="2">CHRONO HOURS</text>
      </g>

      <!-- 9点位：计时 30 分钟 -->
      <g id="chMinDial" role="img" aria-label="计时码表分钟盘">
        <circle cx="205" cy="500" r="112" fill="url(#subGrad)" stroke="#c9a86a" stroke-opacity=".45"/>
        <g id="chMinTicks"></g>
        <g id="chMinLabels" fill="#9aa6ba" font-size="12" text-anchor="middle" dominant-baseline="central"></g>
        <g id="chMinHand" filter="url(#softShadow)">
          <polygon points="205,447 208.5,497 205,511 201.5,497" fill="#e7ecf3"/>
        </g>
        <circle cx="205" cy="500" r="4" fill="url(#capGrad)"/>
        <text x="205" y="596" text-anchor="middle" fill="#c9a86a" font-size="10" letter-spacing="2">30 MINUTES</text>
      </g>

      <!-- 品牌字样 -->
      <text x="500" y="348" text-anchor="middle" fill="#d9bd84" font-size="24" letter-spacing="7" class="serif">ASTRONOMIA</text>
      <text x="500" y="371" text-anchor="middle" fill="#8f9aae" font-size="10.5" letter-spacing="3">AUTOMATIC · ASTRONOMIC</text>
      <g id="chronoMark">
        <circle id="chronoDot" cx="452" cy="636" r="4" fill="#5b6472"/>
        <text id="chronoStateText" x="462" y="636" fill="#8f9aae" font-size="10.5" letter-spacing="2" dominant-baseline="central">READY</text>
      </g>
      <text x="500" y="664" text-anchor="middle" fill="#7d8696" font-size="9.5" letter-spacing="3">SWISS MADE</text>

      <!-- 日期窗（4:30 位置） -->
      <g id="dateWindow">
        <rect x="674" y="683" width="56" height="40" rx="5" fill="#efe7d2" stroke="#c9a86a" stroke-width="2"/>
        <text id="dateText" x="702" y="704" text-anchor="middle" dominant-baseline="central"
              fill="#141a26" font-size="26" font-weight="700" class="serif">--</text>
      </g>

      <!-- 中央指针组 -->
      <g id="chSecondHand" filter="url(#softShadow)">
        <line x1="500" y1="540" x2="500" y2="205" stroke="#e2493d" stroke-width="2.4"/>
        <circle cx="500" cy="540" r="6.5" fill="none" stroke="#e2493d" stroke-width="2"/>
      </g>
      <g id="hourHand" filter="url(#softShadow)">
        <polygon points="500,288 509,466 500,522 491,466" fill="url(#handSteel)" stroke="#1a2029" stroke-opacity=".6" stroke-width=".7"/>
        <line x1="500" y1="300" x2="500" y2="510" stroke="#fff" stroke-opacity=".18" stroke-width="1.2"/>
      </g>
      <g id="minuteHand" filter="url(#softShadow)">
        <polygon points="500,182 506.5,468 500,524 493.5,468" fill="url(#handSteel)" stroke="#1a2029" stroke-opacity=".6" stroke-width=".7"/>
        <line x1="500" y1="196" x2="500" y2="512" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>
      </g>
      <g id="secondHand">
        <line x1="500" y1="578" x2="500" y2="150" stroke="#d8b26a" stroke-width="1.8"/>
        <circle cx="500" cy="560" r="9" fill="none" stroke="#d8b26a" stroke-width="2.2"/>
        <circle cx="500" cy="150" r="3" fill="#d8b26a"/>
      </g>
      <circle cx="500" cy="500" r="12" fill="url(#capGrad)" stroke="#202730" stroke-width="1"/>
      <line x1="494" y1="500" x2="506" y2="500" stroke="#1c222b" stroke-width="1.6"/>

      <!-- 蓝宝石反光 -->
      <g id="sheen" pointer-events="none">
        <path d="M500,70 A430,430 0 0 1 930,500" fill="none" stroke="url(#sheenGrad)" stroke-width="130" stroke-opacity=".55"/>
      </g>
    </svg>
  </div>

  <aside class="panel">
    <section class="card" aria-label="城市切换">
      <h3>预设城市 · 昼夜指示</h3>
      <div class="city-btns" id="cityBtns"></div>
      <div style="height:10px"></div>
      <div class="kv"><span>当地时间</span><span id="cityLocal">--:--:--</span></div>
      <div class="kv"><span>日出</span><span id="citySunrise">--:--</span></div>
      <div class="kv"><span>日落</span><span id="citySunset">--:--</span></div>
      <div class="kv"><span>正午</span><span id="cityNoon">--:--</span></div>
      <div class="kv"><span>昼长</span><span id="cityDayLen">--</span></div>
    </section>

    <section class="card" aria-label="计时码表控制">
      <h3>Chronograph · 计时码表</h3>
      <div class="chrono-readout" id="chronoReadout" aria-live="off">00:00.00</div>
      <div class="chrono-btns">
        <button class="primary" id="btnA">开始</button>
        <button id="btnB">计圈</button>
        <button id="btnReset">归零</button>
      </div>
      <ol id="lapList" aria-label="计圈记录"></ol>
    </section>

    <section class="card">
      <h3>操作说明</h3>
      <p class="hint">
        2 点位表冠按钮 = 开始 / 暂停 / 继续；4 点位按钮 = 运行中计圈（再按解除定格）、暂停时归零。<br>
        主表盘读取本机系统时间，秒针由 requestAnimationFrame 逐帧按绝对时间校准，无累积漂移；切回标签页即刻对齐。<br>
        系统开启“减少动态效果”后，秒针自动改为跳秒并关闭装饰动画。
      </p>
    </section>
  </aside>
</main>

<div class="sr-only" aria-live="polite" id="liveTime"></div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;
  const mod = (a,b) => ((a % b) + b) % b;
  const pad = (n,w=2) => String(n).padStart(w,'0');
  const setRot = (el,deg,cx,cy) => el.setAttribute('transform',`rotate(${deg.toFixed(3)} ${cx} ${cy})`);

  /* ---------- 静态刻度生成 ---------- */
  function ringTicks(groupId,cx,cy,rOut,rIn,count,majorEvery,majorW,minorW,majorColor){
    const g=$(groupId); let html='';
    for(let i=0;i<count;i++){
      const a=rad(i*360/count);
      const major = majorEvery && i%majorEvery===0;
      const r1 = major ? rIn-4 : rIn;
      const x1=cx+Math.sin(a)*r1, y1=cy-Math.cos(a)*r1;
      const x2=cx+Math.sin(a)*rOut, y2=cy-Math.cos(a)*rOut;
      html+=`<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"
        stroke="${major?(majorColor||'#d9bd84'):'#c6ccd8'}" stroke-opacity="${major?'.9':'.4'}"
        stroke-width="${major?majorW:minorW}"/>`;
    }
    g.innerHTML=html;
  }
  function ringLabels(groupId,cx,cy,r,vals,fmt){
    const g=$(groupId); let html='';
    vals.forEach(v=>{
      const a=rad(v.angle);
      html+=`<text x="${(cx+Math.sin(a)*r).toFixed(1)}" y="${(cy-Math.cos(a)*r).toFixed(1)}">${fmt?v.fmt:v.label}</text>`;
    });
    g.innerHTML=html;
  }

  // 主表盘分钟轨
  ringTicks('minuteTicks',500,500,421,408,60,5,3.2,1.2);
  // 主表盘罗马数字（12/3/6/9 让位给小表盘）
  (function(){
    const romans={1:'I',2:'II',4:'IV',5:'V',7:'VII',8:'VIII',10:'X',11:'XI'};
    let html='';
    for(const h of Object.keys(romans)){
      const a=rad(h*30);
      html+=`<text x="${(500+Math.sin(a)*350).toFixed(1)}" y="${(500-Math.cos(a)*350).toFixed(1)}">${romans[h]}</text>`;
    }
    $('hourNumerals').innerHTML=html;
  })();
  // 表圈发丝纹与螺丝
  (function(){
    let html='';
    for(let i=0;i<120;i++){
      const a=rad(i*3);
      const x1=500+Math.sin(a)*444, y1=500-Math.cos(a)*444;
      const x2=500+Math.sin(a)*466, y2=500-Math.cos(a)*466;
      html+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
        stroke="#ffffff" stroke-opacity="${i%2?'.05':'.11'}" stroke-width="1"/>`;
    }
    $('bezelLines').innerHTML=html;
    html='';
    [15,105,195,285].forEach(a0=>{
      const a=rad(a0), x=500+Math.sin(a)*455, y=500-Math.cos(a)*455;
      html+=`<g transform="rotate(${a0} ${x.toFixed(1)} ${y.toFixed(1)})">
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="url(#bezelGrad)" stroke="#2c333c" stroke-width="1"/>
        <line x1="${(x-5).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+5).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#232a33" stroke-width="1.6"/>
      </g>`;
    });
    $('bezelScrews').innerHTML=html;
  })();

  // 计时小表盘
  ringTicks('chHourTicks',500,795,92,78,60,5,2,1);
  ringTicks('chMinTicks',205,500,92,78,60,5,2,1);
  (function(){
    let h='';
    for(let v=1;v<=12;v++){const a=rad(v/12*360);
      h+=`<text x="${(500+Math.sin(a)*64).toFixed(1)}" y="${(795-Math.cos(a)*64).toFixed(1)}">${v===12?12:v}</text>`;}
    $('chHourLabels').innerHTML=h;
    h='';
    for(let v=5;v<=30;v+=5){const a=rad(v/30*360);
      h+=`<text x="${(205+Math.sin(a)*64).toFixed(1)}" y="${(500-Math.cos(a)*64).toFixed(1)}">${v}</text>`;}
    $('chMinLabels').innerHTML=h;
  })();
  // 昼夜盘刻度
  ringTicks('dnTicks',795,500,74,66,48,12,1.8,1);
  (function(){
    const vals=[{t:0,label:'24'},{t:6,label:'6'},{t:12,label:'12'},{t:18,label:'18'}];
    let h='';
    vals.forEach(v=>{const a=rad(v.t/24*360+180);
      h+=`<text x="${(795+Math.sin(a)*54).toFixed(1)}" y="${(500-Math.cos(a)*54).toFixed(1)}">${v.label}</text>`;});
    $('dnLabels').innerHTML=h;
  })();
  // 月面陨石坑（静态装饰）
  (function(){
    const craters=[[484,216,6],[512,244,8],[494,258,4],[518,214,3.5],[476,240,3.5]];
    $('moonCraters').innerHTML=craters.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}"/>`).join('');
  })();

  /* ---------- 月相：自行实现的朔望月公式 ---------- */
  const SYNODIC = 29.530588853;     // 平均朔望月（天）
  const NEW_MOON_JD = 2451550.26;   // 2000-01-06 18:14 UT 新月
  const PHASE_NAMES=['新月','蛾眉月','上弦月','盈凸月','满月','亏凸月','下弦月','残月'];
  function julianDateUTC(date){ return date.getTime()/86400000 + 2440587.5; }
  function moonLitPath(cx,cy,R,p){
    // p: 0 新月 → 0.5 满月 → 1 新月；北半球视角，右侧为盈
    const c=Math.cos(TAU*p);
    const a=Math.abs(c)*R;
    const waxing=p<0.5;
    let d;
    if(waxing){
      d=`M ${cx} ${cy-R} A ${R} ${R} 0 0 1 ${cx} ${cy+R}`;
      if(a<0.5) d+=` L ${cx} ${cy-R} Z`;
      else d+=` A ${a.toFixed(2)} ${R} 0 0 ${p<0.25?0:1} ${cx} ${cy-R} Z`;
    }else{
      d=`M ${cx} ${cy-R} A ${R} ${R} 0 0 0 ${cx} ${cy+R}`;
      if(a<0.5) d+=` L ${cx} ${cy-R} Z`;
      else d+=` A ${a.toFixed(2)} ${R} 0 0 ${(p-0.5)<0.25?0:1} ${cx} ${cy-R} Z`;
    }
    return d;
  }

  /* ---------- 日出日落：NOAA 太阳算法现场计算 ---------- */
  const CITIES=[
    {name:'北京', lat:39.9042, lon:116.4074, tz:'Asia/Shanghai'},
    {name:'伦敦', lat:51.5074, lon:-0.1278,  tz:'Europe/London'},
    {name:'纽约', lat:40.7128, lon:-74.0060, tz:'America/New_York'},
    {name:'悉尼', lat:-33.8688,lon:151.2093, tz:'Australia/Sydney'}
  ];
  let cityIdx=0;
  const tzFormatter = tz => new Intl.DateTimeFormat('en-US',{
    timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit'
  });
  const tzCache={};
  function cityParts(date,city){
    let fmt=tzCache[city.tz]; if(!fmt) fmt=tzCache[city.tz]=tzFormatter(city.tz);
    const o={}; fmt.formatToParts(date).forEach(p=>o[p.type]=p.value);
    let h=+o.hour; if(h===24)h=0;
    return {y:+o.year,mo:+o.month,d:+o.day,h,mi:+o.minute,s:+o.second,key:o.year+'-'+o.month+'-'+o.day};
  }
  function sunCalc(lat,lon,tzHours,y,m,d){
    let Y=y,M=m; if(M<=2){Y--;M+=12;}
    const A=Math.floor(Y/100), B=2-A+Math.floor(A/4);
    const JD=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5 - tzHours/24;
    const T=(JD-2451545)/36525;
    let L0=(280.46646+T*(36000.7698+0.0003032*T))%360; if(L0<0)L0+=360;
    let Ma=mod(357.52911+T*(35999.05029-0.0001537*T),360);
    const e=0.016708634-T*(0.000042037+0.0000001267*T);
    const Mar=rad(Ma);
    const C=Math.sin(Mar)*(1.914602-T*(0.004817+0.000014*T))
           +Math.sin(2*Mar)*(0.019993-0.000101*T)+Math.sin(3*Mar)*0.000289;
    const appLon=L0+C-0.00569-0.00478*Math.sin(rad(125.04-1934.136*T));
    const sec0=21.448-T*(46.815+T*(0.00059-T*0.001813));
    const eps0=23+(26+sec0/60)/60;
    const eps=eps0+0.00256*Math.cos(rad(125.04-1934.136*T));
    const yy=Math.tan(rad(eps/2))**2;
    const eqTime=4*deg(
      yy*Math.sin(2*rad(L0)) - 2*e*Math.sin(Mar)
      + 4*e*yy*Math.sin(Mar)*Math.cos(2*rad(L0))
      - 0.5*yy*yy*Math.sin(4*rad(L0)) - 1.25*e*e*Math.sin(2*Mar)
    );
    const decl=deg(Math.asin(Math.sin(rad(eps))*Math.sin(rad(appLon))));
    const cosH=Math.cos(rad(90.833))/(Math.cos(rad(lat))*Math.cos(rad(decl)))
             - Math.tan(rad(lat))*Math.tan(rad(decl));
    const noon=720-4*lon-eqTime+tzHours*60;
    if(cosH>1)  return {polar:'night',noon};
    if(cosH<-1) return {polar:'day',noon};
    const H=deg(Math.acos(cosH));
    return {rise:noon-4*H,set:noon+4*H,noon};
  }
  function fmtMin(min){
    min=mod(min,1440);
    return `${pad(Math.floor(min/60))}:${pad(Math.floor(min%60))}`;
  }
  function ringArc(cx,cy,r,t1,t2){
    const a1=rad(t1/24*360+180), a2=rad(t2/24*360+180);
    return `M ${(cx+r*Math.sin(a1)).toFixed(2)} ${(cy-r*Math.cos(a1)).toFixed(2)}
            A ${r} ${r} 0 0 1 ${(cx+r*Math.sin(a2)).toFixed(2)} ${(cy-r*Math.cos(a2)).toFixed(2)}`;
  }
  let sunCache={key:''};

  /* ---------- 计时码表状态机 ---------- */
  const ch={state:'idle',base:0,segStart:0,laps:[],frozen:null};
  function chElapsed(){
    return ch.state==='running' ? ch.base+(performance.now()-ch.segStart) : ch.base;
  }
  function chDisplay(){
    return (ch.state==='running' && ch.frozen!=null) ? ch.frozen : chElapsed();
  }
  function resetChrono(){
    ch.state='idle';ch.base=0;ch.segStart=0;ch.laps=[];ch.frozen=null;
    $('lapList').innerHTML='';
  }
  function pressA(){
    if(ch.state==='idle'){ ch.base=0;ch.segStart=performance.now();ch.state='running'; }
    else if(ch.state==='running'){ ch.base+=performance.now()-ch.segStart;ch.frozen=null;ch.state='paused'; }
    else { ch.segStart=performance.now();ch.state='running'; }
    refreshChronoUI();
  }
  function pressB(){
    if(ch.state==='running'){
      if(ch.frozen!=null){ ch.frozen=null; }
      else{
        const e=chElapsed();
        const prev=ch.laps.length?ch.laps[ch.laps.length-1].split:0;
        ch.laps.push({n:ch.laps.length+1,split:e,lap:e-prev});
        ch.frozen=e; renderLaps();
      }
    }else if(ch.state==='paused'){ resetChrono(); }
    refreshChronoUI();
  }
  function fmtChrono(ms){
    const cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60,
          mi=Math.floor(ms/60000)%60, hh=Math.floor(ms/3600000);
    return (hh>0?`${hh}:${pad(mi)}:${pad(s)}`:`${pad(mi)}:${pad(s)}`)+'.'+pad(cs);
  }
  function renderLaps(){
    $('lapList').innerHTML=ch.laps.slice().reverse().map(L=>
      `<li><span class="lap-n">#${pad(L.n)}</span>计圈 ${fmtChrono(L.lap)}　累计 ${fmtChrono(L.split)}</li>`
    ).join('');
  }
  function refreshChronoUI(){
    const btnA=$('btnA'),btnB=$('btnB'),btnReset=$('btnReset');
    btnA.textContent={idle:'开始',running:'暂停',paused:'继续'}[ch.state];
    if(ch.state==='running') btnB.textContent = ch.frozen!=null?'解除计圈':'计圈';
    else if(ch.state==='paused') btnB.textContent='归零';
    else btnB.textContent='计圈';
    btnReset.disabled = ch.state==='running';
    btnReset.style.opacity = btnReset.disabled?.45:1;
    const st={idle:'READY',running:(ch.frozen!=null?'SPLIT':'RUNNING'),paused:'PAUSED'}[ch.state];
    $('chronoStateText').textContent=st;
    const dot=$('chronoDot');
    dot.setAttribute('fill', ch.state==='running'?'#e2493d':'#5b6472');
    dot.classList.toggle('running-dot', ch.state==='running' && !reducedMotion);
  }

  /* ---------- 城市按钮 ---------- */
  const cityBtns=$('cityBtns');
  cityBtns.innerHTML=CITIES.map((c,i)=>`<button data-i="${i}">${c.name}</button>`).join('');
  cityBtns.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    cityIdx=+b.dataset.i; sunCache.key='';
    [...cityBtns.children].forEach((x,i)=>x.classList.toggle('active',i===cityIdx));
  });
  [...cityBtns.children][0].classList.add('active');

  /* ---------- 控制事件（任意顺序安全） ---------- */
  $('btnA').addEventListener('click',pressA);
  $('btnB').addEventListener('click',pressB);
  $('btnReset').addEventListener('click',()=>{ if(ch.state!=='running'){resetChrono();refreshChronoUI();} });
  function bindPusher(id,fn){
    const el=$(id);
    el.addEventListener('click',fn);
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();} });
  }
  bindPusher('pusherA',pressA); bindPusher('pusherB',pressB);

  /* ---------- 减少动态效果 ---------- */
  let reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{
    reducedMotion=e.matches; refreshChronoUI();
  });

  /* ---------- 主循环：每帧按绝对时间计算，绝不增量累加 ---------- */
  let lastSec=-1, lastDateKey='', lastAria={};
  const live=$('liveTime');
  function tick(){
    const now=new Date();

    // 1. 主表盘本地时间
    const ms=now.getMilliseconds();
    const sec = reducedMotion ? now.getSeconds() : now.getSeconds()+ms/1000;
    const min = now.getMinutes()+sec/60;
    const hr  = (now.getHours()%12)+min/60;
    setRot($('secondHand'),sec*6,500,500);
    setRot($('minuteHand'),min*6,500,500);
    setRot($('hourHand'),hr*30,500,500);

    // 4. 日期窗（大小月、闰年由 Date 原生保证）
    const dateKey=`${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
    if(dateKey!==lastDateKey){
      lastDateKey=dateKey;
      $('dateText').textContent=now.getDate();
    }
    const iSec=now.getSeconds();
    if(iSec!==lastSec){
      lastSec=iSec;
      live.textContent=`当前本地时间 ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(iSec)}`;
    }

    // 2. 月相
    const age=mod(julianDateUTC(now)-NEW_MOON_JD,SYNODIC);
    const p=age/SYNODIC;
    $('moonLitPath').setAttribute('d',moonLitPath(500,232,50,p));
    const pIdx=Math.min(7,Math.floor(p*8));
    $('moonText').textContent=`${PHASE_NAMES[pIdx]} · ${age.toFixed(1)} 天`;
    const moonAria=`月相 ${PHASE_NAMES[pIdx]}，月龄 ${age.toFixed(1)} 天`;
    if(lastAria.moon!==moonAria){lastAria.moon=moonAria;$('moonDial').setAttribute('aria-label',moonAria);}

    // 3. 计时码表
    const ce=chDisplay();
    setRot($('chSecondHand'),(ce/1000)*6,500,500);
    setRot($('chMinHand'),mod(ce/60000,30)/30*360,205,500);
    setRot($('chHourHand'),mod(ce/3600000,12)/12*360,500,795);
    $('chronoReadout').textContent=fmtChrono(ce);

    // 5. 城市当地时间 + 日出日落
    const city=CITIES[cityIdx];
    const cp=cityParts(now,city);
    const localSec=cp.h*3600+cp.mi*60+cp.s;
    setRot($('dayNightHand'),localSec/86400*360,795,500);
    $('cityLocal').textContent=`${pad(cp.h)}:${pad(cp.mi)}:${pad(cp.s)}`;
    if(sunCache.key!==city.name+cp.key){
      sunCache.key=city.name+cp.key;
      const tzMin=(Date.UTC(cp.y,cp.mo-1,cp.d,cp.h,cp.mi,cp.s)-now.getTime())/60000;
      const r=sunCalc(city.lat,city.lon,tzMin/60,cp.y,cp.mo,cp.d);
      sunCache.r=r;
      if(r.polar){
        $('dayArc').setAttribute('d', r.polar==='day'
          ? circleArcPath(795,500,74) : '');
        $('srText').textContent = r.polar==='day'?'极昼':'极夜';
        $('ssText').textContent = '';
        $('citySunrise').textContent = r.polar==='day'?'— 极昼 —':'— 极夜 —';
        $('citySunset').textContent  = r.polar==='day'?'太阳不落':'太阳不升';
        $('cityDayLen').textContent = r.polar==='day'?'24h00m':'0h00m';
      }else{
        $('dayArc').setAttribute('d',ringArc(795,500,74,r.rise/60,r.set/60));
        $('srText').textContent='↑ '+fmtMin(r.rise);
        $('ssText').textContent='↓ '+fmtMin(r.set);
        $('citySunrise').textContent=fmtMin(r.rise);
        $('citySunset').textContent=fmtMin(r.set);
        const dl=mod(r.set-r.rise,1440);
        $('cityDayLen').textContent=`${Math.floor(dl/60)}h${pad(Math.floor(dl%60))}m`;
      }
      $('cityNoon').textContent=fmtMin(r.noon);
    }
    // 白天金色太阳 / 夜间银白
    const r=sunCache.r;
    const isDay = r && !r.polar ? (localSec/60>=r.rise && localSec/60<=r.set) : r&&r.polar==='day';
    $('sunDot').setAttribute('fill', isDay?'#e6b85c':'#c3cdda');
    const dnAria=`${city.name}昼夜指示，当地时间 ${pad(cp.h)}:${pad(cp.mi)}，`+
      (r.polar? (r.polar==='day'?'极昼':'极夜') :`日出 ${fmtMin(r.rise)}，日落 ${fmtMin(r.set)}`);
    if(lastAria.dn!==dnAria){lastAria.dn=dnAria;$('dayNightDial').setAttribute('aria-label',dnAria);}
    const chAria=`计时码表，${$('chronoStateText').textContent}，${fmtChrono(ce)}`;
    if(lastAria.ch!==chAria){lastAria.ch=chAria;
      $('chHourDial').setAttribute('aria-label','计时小时盘，'+chAria);
      $('chMinDial').setAttribute('aria-label','计时分钟盘，'+chAria);
    }
  }
  function circleArcPath(cx,cy,r){ // 整圆描边（极昼用）
    return `M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r} ${cy} A ${r} ${r} 0 1 1 ${cx-r} ${cy} Z`;
  }
  function loop(){ tick(); requestAnimationFrame(loop); }

  // 切回标签页立即校准（rAF 在后台暂停，回前台先同步跑一帧）
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tick(); });
  window.addEventListener('pageshow',tick);
  window.addEventListener('focus',tick);

  refreshChronoUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
