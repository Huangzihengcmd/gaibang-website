<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI 能力检测：同一道测试题，对比各家 AI 模型的实际产出。">
<meta name="keywords" content="AI能力检测,AI评测,大模型对比,benchmark">
<title>Top AI · 能力检测</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
  --border-color: #e2e8f0;
  --tag-bg: #f1f5f9;
  --tag-text: #334155;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Microsoft YaHei", "PingFang SC", sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 32px; }

header.site { padding: 44px 0 20px; }
.brand { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 8px; }
.subtitle { color: var(--text-secondary); font-size: 15px; margin: 0; }
.top-link { float: right; font-size: 13px; color: var(--text-tertiary); text-decoration: none; }
.top-link:hover { color: var(--text-primary); }

.models-bar { margin: 26px auto 30px; }
.models-bar-title {
  font-size: 12px; letter-spacing: 0.14em; color: var(--text-tertiary);
  text-transform: uppercase; margin-bottom: 10px;
}
.models-bar-list { display: flex; flex-wrap: wrap; gap: 8px; }
.models-bar-item {
  font-size: 12px; background: var(--tag-bg); color: var(--tag-text);
  padding: 5px 12px; border-radius: 20px; border: 1px solid transparent;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 30px;
  margin-top: 20px;
}

.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(15,23,42,.10);
  border-color: #cbd5e1;
}
.card-image-area {
  aspect-ratio: 21 / 9;
  background-color: #0f172a;
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid var(--border-color);
  overflow: hidden; cursor: pointer;
}
.card-image-area .en {
  font-size: 38px; letter-spacing: 0.18em; font-weight: 700;
  color: #f0dfac; text-shadow: 0 0 24px rgba(240,223,172,0.18); text-align: center;
}
.card-image-area .sub {
  margin-top: 10px; font-size: 12px; letter-spacing: 0.28em; color: #c4b07a; text-align: center;
}
.card-content { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
.card-header { margin-bottom: 8px; }
.card-title { font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 0; }
.card-title a { color: inherit; text-decoration: none; }
.card-title a:hover { text-decoration: underline; }
.badge {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  padding: 2px 7px; border-radius: 4px; vertical-align: middle; margin-left: 8px;
}
.badge-updated { background: #dbeafe; color: #1d4ed8; }
.badge-new { background: #dcfce7; color: #15803d; }
.card-desc { font-size: 14px; color: var(--text-secondary); margin: 0 0 12px; line-height: 1.65; }
.card-date { font-size: 12px; color: var(--text-tertiary); margin-bottom: 2px; }
.card-meta {
  font-size: 11px; color: var(--text-tertiary);
  font-family: "JetBrains Mono", ui-monospace, monospace; margin-bottom: 14px;
}
.models-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.model-tag {
  font-size: 12px; background: var(--tag-bg); color: var(--tag-text);
  padding: 6px 12px; border-radius: 20px; font-weight: 500;
  border: 1px solid transparent; text-decoration: none; transition: all .15s ease;
}
.model-tag:hover { background: var(--text-primary); color: #fff; }
.model-tag-new { border-color: #86efac; color: #15803d; }
.model-tag.pending {
  background: transparent; color: #b8c1cc; border: 1px dashed #d8dee7; cursor: default;
}

footer {
  border-top: 1px solid var(--border-color); margin-top: 50px;
  padding: 24px 0 50px; color: var(--text-tertiary); font-size: 13px;
}
@media (max-width: 700px) {
  .wrap { padding: 0 18px; }
  .grid { grid-template-columns: 1fr; }
  .card-image-area .en { font-size: 28px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <a class="top-link" href="https://gaibang.pages.dev/">丐帮主站</a>
    <h1 class="brand">AI 能力检测</h1>
    <p class="subtitle">同一道测试题，看看各家模型交出什么答卷</p>
  </header>

  <div class="models-bar">
    <div class="models-bar-title">参与模型</div>
    <div class="models-bar-list" id="modelBar"></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    题目原文取自 D:\AI能力检测\说明，未作改写。有新作品放入该目录后会自动同步。
  </footer>
</div>

<script src="data.js"></script>
<script>
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
         "-" + String(d.getDate()).padStart(2, "0");
}
function daysAgo(dateStr) {
  if (!dateStr) return 9999;
  var a = new Date(dateStr), b = new Date(todayStr());
  return Math.floor((b - a) / 86400000);
}

function render() {
  var d = window.AIBENCH;
  if (!d || !d.tests) {
    document.getElementById("grid").innerHTML = "<p>数据加载失败：data.js</p>"; return;
  }

  document.getElementById("modelBar").innerHTML = d.models.map(function(m) {
    var n = Object.keys(m.works || {}).length;
    return '<span class="models-bar-item">' + esc(m.name) + " · " + n + "</span>";
  }).join("");

  function latest(t) {
    var s = "";
    d.models.forEach(function(m) {
      var dt = (m.dates || {})[t.id] || "";
      if (dt > s) s = dt;
    });
    return s;
  }

  var tests = d.tests.slice().sort(function(a, b) {
    return latest(b) < latest(a) ? -1 : (latest(b) > latest(a) ? 1 : 0);
  });

  document.getElementById("grid").innerHTML = tests.map(function(t) {
    var done = d.models.filter(function(m) { return m.works && m.works[t.id]; });
    var pending = d.models.filter(function(m) { return !(m.works && m.works[t.id]); });
    var latestStr = latest(t);
    var age = daysAgo(latestStr);
    var badge = "";
    if (age <= 3) badge = '<span class="badge badge-new">NEW</span>';
    else if (age <= 14) badge = '<span class="badge badge-updated">UPDATED</span>';

    var tags = done.map(function(m) {
      var dt = (m.dates || {})[t.id] || "";
      var isNew = daysAgo(dt) <= 14;
      return '<a class="model-tag' + (isNew ? " model-tag-new" : "") + '" href="works/' +
             esc(m.works[t.id]) + '" target="_blank" rel="noopener">' +
             esc(m.name) + "</a>";
    }).join("") + pending.map(function(m) {
      return '<span class="model-tag pending">' + esc(m.name) + " · 未提交</span>";
    }).join("");

    return '<article class="card">' +
      '<div class="card-image-area" style="background:' + esc(t.grad) + ';" ' +
           'onclick="location.href=\'test.html?id=' + encodeURIComponent(t.id) + '\'">' +
        '<div style="display:flex;flex-direction:column;align-items:center;">' +
          '<div class="en">' + esc(t.en) + "</div>" +
          '<div class="sub">' + esc(t.sub) + "</div>" +
        "</div>" +
      "</div>" +
      '<div class="card-content">' +
        '<div class="card-header">' +
          '<h2 class="card-title"><a href="test.html?id=' + encodeURIComponent(t.id) + '">' +
            esc(t.name) + "</a>" + badge + "</h2>" +
        "</div>" +
        '<p class="card-desc">' + esc(t.prompt || "（说明原文缺失）") + "</p>" +
        '<div class="card-date">📅 ' + (latestStr || "暂无提交") + "</div>" +
        '<div class="card-meta">path: works/' + esc(t.id) + "</div>" +
        '<div class="models-list">' + tags + "</div>" +
      "</div>" +
    "</article>";
  }).join("");
}

window.onload = render;
</script>

</body>
</html>
