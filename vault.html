<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="云囊·丐帮协作资料库——上传文件自动保存，团队用协作码共享资料。">
<title>云囊 - 协作资料库 | 丐帮</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="style.css">
<style>
header { text-align: center; position: relative; padding: 15px 0; }
.site-logo { width: 80px; height: 80px; object-fit: contain;
  position: absolute; left: 30px; top: 50%; transform: translateY(-50%); z-index: 10; }
header h1 { margin: 0 auto; position: relative; z-index: 5; color: #fff; }
.container { max-width: 820px; margin: 34px auto; padding: 0 20px; }
.page-title { text-align: center; color: #ffd700; font-size: 30px; margin-bottom: 8px; }
.page-sub { text-align: center; color: #999; font-size: 14px; margin-bottom: 32px; }
.panel { background: rgba(0,0,0,.6); border: 1px solid rgba(255,215,0,.2);
  border-radius: 12px; padding: 26px; margin-bottom: 22px; color: #fff; }
.panel h2 { color: #ffd700; margin: 0 0 16px; font-size: 19px; }
label { display: block; color: #bbb; font-size: 13px; margin: 14px 0 6px; }
input { width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 8px;
  border: 1px solid rgba(255,215,0,.3); background: rgba(255,255,255,.06); color: #fff;
  box-sizing: border-box; }
input:focus { outline: none; border-color: #ffd700; }
input::placeholder { color: #666; }
.btn { display: block; width: 100%; padding: 13px; margin-top: 16px; font-size: 16px;
  font-weight: bold; border: none; border-radius: 8px; cursor: pointer;
  background: linear-gradient(135deg, #ffd700, #e6a800); color: #000; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; border: 1px solid rgba(255,215,0,.5); color: #ffd700; }
.btn.ghost:hover { background: rgba(255,215,0,.12); }
.split { display: flex; gap: 12px; margin-top: 18px; }
.split .btn { margin-top: 0; }
.hint { color: #888; font-size: 12px; margin-top: 14px; line-height: 1.7; }
.code-box { background: rgba(255,215,0,.1); border: 1px dashed #ffd700;
  border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 18px; }
.code-box .label { color: #aaa; font-size: 13px; }
.code-box .code { font-size: 32px; font-weight: bold; color: #ffd700;
  letter-spacing: 4px; margin: 8px 0; font-family: Consolas, monospace; }
.drop { border: 2px dashed rgba(255,215,0,.35); border-radius: 12px; padding: 34px 20px;
  text-align: center; cursor: pointer; transition: .2s; }
.drop:hover, .drop.on { background: rgba(255,215,0,.08); border-color: #ffd700; }
.drop .icon { font-size: 34px; margin-bottom: 10px; }
.drop .t { color: #ddd; font-size: 15px; margin-bottom: 6px; }
.drop .s { color: #777; font-size: 12px; }
.bar { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
.bar .info { flex: 1; min-width: 0; }
.bar .nm { color: #fff; font-size: 14px; margin-bottom: 3px; word-break: break-all; }
.bar .mt { color: #777; font-size: 12px; }
.bar a.dl { color: #ffd700; text-decoration: none; font-size: 13px;
  border: 1px solid #ffd700; padding: 5px 12px; border-radius: 6px; white-space: nowrap; }
.bar a.dl:hover { background: #ffd700; color: #000; }
.bar button.dl { background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b;
  padding: 5px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.empty { text-align: center; color: #666; font-size: 14px; padding: 30px 0; }
.msg { text-align: center; font-size: 14px; margin-top: 12px; min-height: 20px; }
.ok { color: #4caf50; } .err { color: #ff6b6b; } .busy { color: #ffd700; }
.back { text-align: center; margin-top: 30px; }
.back a { color: #ffd700; font-size: 16px; text-decoration: none; }
</style>
</head>

<body>
<header>
  <img src="logo.jpg" class="site-logo" alt="丐帮Logo">
  <h1 class="floating">丐帮</h1>
  <nav>
    <ul>
      <li><a href="index.html">首页</a></li>
      <li><a href="about.html">帮派介绍</a></li>
      <li><a href="news.html">新闻</a></li>
      <li><a href="sites.html">分舵</a></li>
      <li><a href="contact.html">联系</a></li>
    </ul>
  </nav>
</header>

<div class="container">
  <h2 class="page-title">云囊</h2>
  <p class="page-sub">协作资料库 · 上传即自动保存</p>

  <!-- 入口 -->
  <div id="gate">
    <div class="panel">
      <h2>请输入协作码</h2>
      <label>协作码</label>
      <input id="code" placeholder="请输入 4-16 位协作码" maxlength="16" style="text-transform:uppercase">
      <label>访问密码（该库设置了密码才需要填）</label>
      <input id="pwd" type="password" placeholder="没有可留空">
      <div class="split">
        <button class="btn" onclick="joinVault()">进入资料库</button>
      </div>
      <div class="msg" id="gateMsg"></div>
    </div>

    <div class="panel">
      <h2>还没有协作码？</h2>
      <div class="split">
        <button class="btn ghost" onclick="quickCreate('personal')">个人协作</button>
        <button class="btn ghost" onclick="showTeam()">成为团队创建者</button>
      </div>
      <div class="msg" id="quickMsg"></div>
      <div id="teamForm" style="display:none;margin-top:20px">
        <label>团队名称</label>
        <input id="teamName" placeholder="例如：丐帮物理研究组" maxlength="30">
        <label>自定义协作码（留空自动生成）</label>
        <input id="teamCode" placeholder="例如：GAI2026" maxlength="16" style="text-transform:uppercase">
        <label>访问密码（可选）</label>
        <input id="teamPwd" type="password" placeholder="设置后他人需密码才能进入">
        <div class="split">
          <button class="btn" onclick="createTeam()">创建团队资料库</button>
          <button class="btn ghost" onclick="showTeam()">取消</button>
        </div>
      </div>
      <div class="hint">协作码就像一把钥匙：把它发给同伴，对方输入即可进入同一个资料库，一起上传、下载文件。</div>
    </div>
  </div>

  <!-- 库内 -->
  <div id="inner" style="display:none">
    <div class="code-box">
      <div class="label">当前协作码</div>
      <div class="code" id="showCode">--------</div>
      <div class="label" id="showName"></div>
    </div>

    <div class="panel">
      <h2>上传文件</h2>
      <div class="drop" id="drop" onclick="document.getElementById('picker').click()">
        <div class="icon">📦</div>
        <div class="t">点击选择文件，或把文件拖到这里</div>
        <div class="s">上传后自动保存到服务器 · 单个文件不超过 4MB</div>
      </div>
      <input type="file" id="picker" style="display:none" multiple>
      <div class="msg" id="upMsg"></div>
    </div>

    <div class="panel">
      <h2>文件列表</h2>
      <div id="list"><div class="empty">加载中…</div></div>
    </div>

    <div class="back"><a href="sites.html">← 回分舵</a></div>
  </div>
</div>

<script>
let CODE = "", NAME = "";
const $ = id => document.getElementById(id);

function fmtSize(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(2) + " MB";
}
function showMsg(id, text, cls) {
  const el = $(id);
  el.textContent = text || "";
  el.className = "msg " + (cls || "");
}

// 个人协作：一键生成
async function quickCreate(kind) {
  showMsg("quickMsg", "正在创建…", "busy");
  const r = await fetch("/api/vault/create", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: "我的资料库", isTeam: false })
  }).then(r => r.json());
  if (r.code !== 200) return showMsg("quickMsg", r.msg, "err");
  enter(r.data);
}
function showTeam() {
  const f = $("teamForm");
  f.style.display = f.style.display === "none" ? "block" : "none";
}
async function createTeam() {
  const name = $("teamName").value.trim();
  const code = $("teamCode").value.trim().toUpperCase();
  const password = $("teamPwd").value;
  showMsg("quickMsg", "正在创建…", "busy");
  const r = await fetch("/api/vault/create", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, code, password, isTeam: true })
  }).then(r => r.json());
  if (r.code !== 200) return showMsg("quickMsg", r.msg, "err");
  enter(r.data);
}
async function joinVault() {
  const code = $("code").value.trim().toUpperCase();
  const password = $("pwd").value;
  if (!code) return showMsg("gateMsg", "请先输入协作码", "err");
  showMsg("gateMsg", "正在进入…", "busy");
  const r = await fetch("/api/vault/join", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, password })
  }).then(r => r.json());
  if (r.code !== 200) return showMsg("gateMsg", r.msg, "err");
  enter(r.data);
}

function enter(v) {
  CODE = v.code; NAME = v.name;
  $("showCode").textContent = CODE;
  $("showName").textContent = NAME;
  $("gate").style.display = "none";
  $("inner").style.display = "block";
  loadFiles();
}

async function loadFiles() {
  const box = $("list");
  box.innerHTML = '<div class="empty">加载中…</div>';
  const r = await fetch("/api/vault/files?code=" + encodeURIComponent(CODE)).then(r => r.json());
  if (r.code !== 200) { box.innerHTML = '<div class="empty">读取失败</div>'; return; }
  if (!r.data.length) { box.innerHTML = '<div class="empty">资料库还是空的，上传第一个文件吧</div>'; return; }
  box.innerHTML = r.data.map(f => {
    const time = (f.time || "").replace("T", " ").slice(0, 16);
    const url = "/api/vault/download?code=" + encodeURIComponent(CODE) + "&id=" + encodeURIComponent(f.id);
    return '<div class="bar">' +
      '<div class="info"><div class="nm">' + esc(f.name) + "</div>" +
      '<div class="mt">' + fmtSize(f.size) + " · " + time + "</div></div>" +
      '<a class="dl" href="' + url + '">下载</a>' +
      '<button class="dl" onclick="delFile(\'' + f.id + '\')">删除</button>' +
    "</div>";
  }).join("");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function delFile(id) {
  if (!confirm("确定要删除这个文件吗？")) return;
  const r = await fetch("/api/vault/delete", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: CODE, id })
  }).then(r => r.json());
  alert(r.msg);
  loadFiles();
}

async function uploadFiles(files) {
  for (const f of files) {
    if (f.size > 4 * 1024 * 1024) {
      showMsg("upMsg", f.name + " 超过 4MB，已跳过", "err");
      continue;
    }
    showMsg("upMsg", "正在上传并保存：" + f.name, "busy");
    const b64 = await new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => res(rd.result);
      rd.onerror = rej;
      rd.readAsDataURL(f);
    });
    const r = await fetch("/api/vault/upload", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: CODE, name: f.name, data: b64 })
    }).then(r => r.json());
    if (r.code !== 200) { showMsg("upMsg", f.name + "：" + r.msg, "err"); }
    else { showMsg("upMsg", f.name + " 已自动保存", "ok"); }
  }
  loadFiles();
}

$("picker").addEventListener("change", e => uploadFiles(e.target.files));
const dz = $("drop");
["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => {
  e.preventDefault(); dz.classList.add("on");
}));
["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => {
  e.preventDefault(); dz.classList.remove("on");
}));
dz.addEventListener("drop", e => uploadFiles(e.dataTransfer.files));
</script>

</body>
</html>
